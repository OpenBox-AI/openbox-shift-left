# GoReleaser config for the unified `openbox` engine (OD17: one static, no-cgo
# binary that is CLI + hook + sidecar + git-hook). Produces per-platform archives
# + a checksums.txt that install.sh downloads and verifies, so `curl … | bash`
# drops a prebuilt binary with NO Go toolchain on the developer's machine.
#
# The engine lives in the `cli` module (github.com/openbox-ai/openbox-shift-left/cli),
# which uses relative `replace` directives to its sibling modules in this repo — so
# the build runs from `dir: cli` where those replaces resolve.
#
# Release: push a tag `vX.Y.Z`; the release workflow runs `goreleaser release`.
version: 2

project_name: openbox

builds:
  - id: openbox
    dir: cli
    main: ./cmd/openbox
    binary: openbox
    env:
      - CGO_ENABLED=0
      # Ignore the repo's go.work. The workspace exists so CI and editors can see
      # all 12 modules at once; a release binary must resolve through the module's
      # own `replace` directives, exactly as it would outside this checkout.
      - GOWORK=off
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: openbox
    ids:
      - openbox
    formats:
      - tar.gz
    # Deterministic, script-parseable name: openbox_<version>_<os>_<arch>.tar.gz
    # (install.sh constructs this exact name from uname). {{ .Version }} is the tag
    # without its leading `v`.
    name_template: "openbox_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  github:
    owner: OpenBox-AI
    name: openbox-shift-left
  prerelease: auto

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
