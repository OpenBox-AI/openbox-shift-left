# Durable lessons surfaced by retros, so `route` can replay them on future work.
# Each entry: id, lesson, source_retro, optional graph_anchor + owner/phase.
lessons:
  - id: "LESSON-E6E7-01"
    lesson: >
      The status ledger is authoritative only once reconciled against reality. On
      a resumed run, diff done/committed stories against their ledger entries and
      each ledger entry against a backing assignment + commit BEFORE acting — a
      committed+approved story with no ledger entry (E6-S6/S10/S11 in E6-E7) is a
      drift signal to close first, not build on.
    source_retro: ".fab7/sdlc/retros/E6-E7.retro.yaml"
    followup_phase: "build"
    owner: "orchestrator"
    graph_anchor: "resume / status; tune-skill (ledger-vs-evidence drift guard)"
  - id: "LESSON-E6E7-02"
    lesson: >
      Cross-repo write/push access is uneven and per-repo, and it is a design
      input. Verify push access to each target repo before building a cross-repo
      change — a walled repo (openbox-sdk-python: denied) turns an upstream edit
      into a locally-carried mirror with standing drift risk, a different design;
      an unwalled one (openbox-core: confirmed) does not.
    source_retro: ".fab7/sdlc/retros/E6-E7.retro.yaml"
    followup_phase: "release"
    owner: "brian"
    graph_anchor: "open_decisions/OD-E6E7-PUSH; client/hookspan.go mirror drift"
  - id: "LESSON-E6E7-03"
    lesson: >
      A flip of a default on a privacy invariant must be paired with either the
      compensating control live or an explicit, documented risk-acceptance that
      keeps the residual gap visible. Content-capture ON by default (e83d925) with
      redaction inert ([EXT-guardrail-redaction]) egresses prompt text unredacted;
      accepted as an opt-OUT posture, docs-only — keep the gap visible.
    source_retro: ".fab7/sdlc/retros/E6-E7.retro.yaml"
    followup_phase: "design"
    owner: "brian"
    graph_anchor: "open_decisions/OD-E6E7-REDACT"
  - id: "LESSON-E6E7-04"
    lesson: >
      An inert/flagged seam needs a conformance quadrant for its "seam absent in
      the field" state, not just the happy path. A reachable-but-unbundled sidecar
      silently left a fail-closed org ungoverned (E6-S3 INFO-1); E6-S7 closed it
      with load-bearing case C6. Every future inert seam adds its degraded-state
      conformance case before it is done.
    source_retro: ".fab7/sdlc/retros/E6-E7.retro.yaml"
    followup_phase: "review"
    owner: "orchestrator"
    graph_anchor: "enforcement conformance suite C1-C11"
  - id: "LESSON-E6E7-05"
    lesson: >
      Keep-doing: cross-repo Explore recon before every build (caught: no OPA
      bundle distributed, CC discards SessionEnd output, EXT-core accept-list
      retirable, no session-id to git) + dual independent G3/G_SEC gating on every
      security/enforcement-touching story, with must-fix findings fixed and
      re-validated before done.
    source_retro: ".fab7/sdlc/retros/E6-E7.retro.yaml"
    followup_phase: "build"
    owner: "orchestrator"
    graph_anchor: "recon-before-build; dual-gate"
