lessons:
  - id: "L1"
    mistake: >
      A resumed session acted on a working narrative that had diverged from
      on-disk reality — the repo was far ahead of the mental model. The residue
      is visible now: the authoritative ledger (status.yaml) is missing E6-S6,
      E6-S10 and E6-S11 even though all three were built, reviewed, signed and
      committed. State drifted between the ledger and reality with nothing to
      catch it.
    lesson: >
      The status ledger is authoritative only if it is reconciled against reality
      before it is trusted. On any resumed run, reconcile the ledger against git
      log + on-disk assignment/result artifacts BEFORE acting — a story committed
      with an approved assignment but no ledger entry (or vice versa) is a drift
      signal that must be closed first, not built on.
    followup: >
      Enforce a reconcile guard at resume: the fab7-sdlc `resume` task should diff
      every done/committed story against its ledger entry (and each ledger entry
      against a backing assignment + commit), and block build until drift is
      reconciled. Immediate action: run status/resume to add the 3 missing E6
      entries from their assignment artifacts + commits. Recurring class ->
      candidate for tune-skill (a ledger-vs-evidence drift check hardened into the
      resume/build gate).
    followup_phase: "build"
    owner: "orchestrator"
    routed_to: "resume / status; tune-skill (G_SKILL_EVOLUTION) for the durable guard"
  - id: "L2"
    mistake: >
      E7-S1 was first built by editing the sibling repo openbox-sdk-python
      (commit c3aa8c7, independently reviewed and signed) before it was
      discovered that the session SSH key (brianthebox) is DENIED push to
      OpenBox-AI/openbox-sdk-python. The reviewed work had to be reverted
      (git reset --hard origin/main) and re-expressed as a shift-left-owned Go
      mirror (client/hookspan.go), amending ADR-0004. openbox-core, by contrast,
      is NOT walled (push confirmed 2026-07-15).
    lesson: >
      Cross-repo write/push access is uneven and per-repo, and it is a design
      input, not a deploy detail. Verify push access to each target repo BEFORE
      building a cross-repo change — a walled repo turns an upstream edit into a
      locally-carried mirror (with a standing drift risk against the base
      contract), which is a different design.
    followup: >
      Route the upstream shell/mcp/tool hook-types PR to openbox-sdk-python as a
      HUMAN-OWNED blocker (needs someone with push access; gh is unauthenticated
      here). Track that the Go mirror in client/hookspan.go WILL drift from the
      base SDK — the intra-repo TestFamilyRootFieldsMirror guard is the only drift
      check today; consider a scheduled base-SDK diff. Recorded in open_decisions.
    followup_phase: "release"
    owner: "brian"
    routed_to: "open_decisions (OD-E6E7-PUSH)"
  - id: "L3"
    mistake: >
      Content capture was flipped ON by default (commit e83d925, 2026-07-15),
      reversing the OD4/INV-2/NFR-1 metadata-only-by-default posture, while the
      compensating control — server-side Guardrail redaction-at-source
      [EXT-guardrail-redaction] — is still inert. Net effect: prompt text
      egresses UNREDACTED on UserPromptSubmit -> SignalReceived (tool commands
      and file bodies still never egress; E6-S9 Tier-1 detection only covers
      Write/Edit bodies in enforce mode).
    lesson: >
      Flipping a default on a privacy invariant must be paired with either the
      compensating control live, or an explicit, documented risk-acceptance that
      keeps the residual gap visible. Here brian accepted it as an org-level
      opt-OUT posture (2026-07-15) with docs-hardening only (no code) — a valid
      decision, but the unredacted-egress gap must not silently fade from view.
    followup: >
      Full server-side Guardrail redaction ([EXT-guardrail-redaction]) plus an
      optional local prompt secret-scrub (reuse E6-S9 secretDetector.Redact)
      remain OPEN and unprioritized. This is a human prioritization/privacy
      decision, not something to resolve here.
    followup_phase: "design"
    owner: "brian"
    routed_to: "open_decisions (OD-E6E7-REDACT)"
  - id: "L4"
    mistake: >
      Enforcement shipped tested-but-inert seams flagged by external dependency
      ([EXT-opa-bundle], [EXT-guardrail-redaction]). One such seam hid a real
      hole: a reachable-but-UNBUNDLED sidecar returned a well-formed reply that
      the client treated as a real verdict, so a fail-closed org was SILENTLY
      ungoverned while the daemon was up but unbundled (E6-S3 INFO-1) — a live
      state because core ships no real bundle yet.
    lesson: >
      An inert/flagged seam needs a conformance quadrant for the "seam absent in
      the field" state, not just the happy path. E6-S7 closed INFO-1 by making
      Decision.FailOpen mean "no real daemon verdict" and adding conformance case
      C6 (fail-closed + unbundled DENIES) — a load-bearing test that fails
      pre-fix. That pattern (assert the inert/degraded state, not only the
      wired-up one) is what caught it.
    lesson_polarity: "gate-hardening"
    followup: >
      Keep the enforcement conformance suite covering the unbundled/inert/stale
      quadrants (C6/C8/C9) as [EXT-opa-bundle] and [EXT-guardrail-redaction] land;
      every future inert seam must add its "seam absent" conformance case before
      the seam is called done.
    followup_phase: "review"
    owner: "orchestrator"
    routed_to: "review / validate (conformance suite as standing evidence)"
  - id: "L5"
    mistake: "none observed"
    lesson: >
      What kept E6/E7 clean: (1) cross-repo Explore recon before every build
      repeatedly caught aspirational assumptions before they shipped — core
      distributes no OPA bundle (E6-S5), CC discards SessionEnd hook output
      (E6-S11), the SL-13 EXT-core accept-list is retirable on stock core
      (E7-S0/S2), CC exposes no session-id to git (SL-5). (2) Every enforce story
      ran dual independent gates (G3 correctness + G_SEC) with must-fix findings
      fixed and re-validated before done. Keep both practices.
    followup: "keep-doing — recon-before-build + dual G3/G_SEC gating on any security/enforcement-touching story"
    followup_phase: "build"
    owner: "orchestrator"
    routed_to: "none (keep-doing)"

