c/assignments/build-story-E6-S5-20260713.result.yaml. E6-S5 DONE (brian G3 + Sam G_SEC, committed 0d4c30e). E6-S1 BUILT 2026-07-14 (status=review): enforce-mode synchronous PreToolUse gate — in ENFORCE mode (ResolveEnforce; default OFF=observe) the hook builds a sidecar.DecisionRequest (reusing Mapper classifyTool/filePath) and calls sidecar.Client.Decide BEFORE the tool runs, bounded ~50ms, fail-open (OD9), NO network (local socket only, INV-3b). Cross-repo recon (SDK) confirmed the split: E6-S1 = obtain-the-verdict; the enforce_verdict cascade -> CC deny/ask/allow is E6-S2's apply. E6-S1 OBTAINS+records only (secret/content-free stderr diag), writes NOTHING to stdout (INV-3 verbatim); observe path byte-identical when enforce off (0 dials, tested). Shell command carried LOCAL-ONLY for matching (never egressed; Mapper egress unchanged). adapter/sidecar/cli build/vet/test -race GREEN + live E2E vs real binary (rm -rf->BLOCK, echo->ALLOW, absent->fail-open, all exit 0/empty stdout). PENDING: brian G3 + Sam G_SEC. Artifact: .fab7/sdlc/assignments/build-story-E6-S1-20260714.result.yaml. E6-S1 DONE (brian G3 + Sam G_SEC, committed 268fbfb). E6-S2 DONE (apply(verdict): SDK enforce_verdict cascade -> CC deny/ask, tighten-only, content-free enforcements.jsonl audit; brian G3 + Sam G_SEC, committed ccb7e93). E6-S3 BUILT 2026-07-14 (status=review; NOT committed): the enforce FAILURE POLICY — fail-open default (OD9) + per-org opt-in fail-closed + configurable clamped hard timeout. A THIN transform applyFailurePolicy(dec, policy) inserted between E6-S1 obtain and E6-S2 apply — the Go port of the SDK's _handle_api_error (client.py:204-208, recovered by Explore): on an OUTAGE (dec.FailOpen) under fail-closed it synthesizes client.VerdictHalt so the UNCHANGED policy-agnostic mapVerdict/applyDecision cascade denies; every other case passes through. Keys on dec.FailOpen (sole producer sidecar.allowFailOpen->VerdictUnknown), NOT the verdict, so a REAL allow from a reachable sidecar is NEVER denied under fail-closed (blocks on outage only). ResolveFailClosed fail-safe default (never fail-closed by accident); ResolveEnforceTimeout (OPENBOX_ENFORCE_TIMEOUT_MS) clamped overflow-proof to 2s so the hook stays under CC's 5s PreToolUse kill (a kill = a CC-layer fail-OPEN that would defeat fail-closed — a correctness bound). Content-free reason (static allowFailOpen cause) + audit signature HALT+fail_open=true. NO new sidecar/core/backend surface; mapVerdict/applyDecision/sidecar.Client UNCHANGED. adapter/sidecar/cli build/vet/test -race GREEN + live E2E all four quadrants (fail-open|closed x outage|real-verdict), 0 command leaks. BOTH REVIEWS APPROVE: G3 (review_auditor) APPROVE (2 NITs fixed) + G_SEC (Sam) APPROVE (INFO-2 overflow-hardening + INFO-3 test FIXED; INFO-1 CARRIED to E6-S7 = fail-closed does NOT engage on a reachable-but-UNBUNDLED sidecar, Source=fail-open:no-bundle but FailOpen=false -> a fail-closed org silently ungoverned while the daemon is up but unbundled; out of E6-S3 scope). E6-S3 DONE (brian G3 sign-off + Sam G_SEC APPROVE 2026-07-14; committed to main, build + ledger together, no push, no signature per brian). Artifact: .fab7/sdlc/assignments/build-story-E6-S3-20260714.result.yaml. E6-S4 BUILT 2026-07-14 (status=review, NOT committed): guardrail redaction-apply leg — ports the SDK _apply_input_redaction to CC hookSpecificOutput.updatedInput on the PROCEED path, gated on content-capture (OD4 opt-in, default OFF -> byte-identical to E6-S3). INV-2 crux: redacted content rides the LOCAL sidecar.Decision.RedactedInput (NOT client.Evaluation) -> structurally cannot reach the advisory/enforcement/evaluate sinks; buildDecisionRequest carries the file body to the local socket only when capture on. [EXT-guardrail-redaction]: the metadata-only bundleEvaluator produces no redaction, so the apply is a faithful, tested, INERT seam until a redaction-capable evaluator lands (S4 §4 reuse-the-server-Guardrail-API). adapter/sidecar/cli -race GREEN + live E2E (capture-on->updatedInput redacted no permissionDecision; capture-off->empty; sinks clean). Reviews: G3 (review_auditor) APPROVE-WITH-MINOR (SHOULD-FIX null/empty->updatedInput:null FIXED via len(obj)==0 guard) + G_SEC (Sam) APPROVE (5 invariants hold; 3 INFO carried to E6-S7/engine). E6-S4 DONE (brian G3 sign-off + Sam G_SEC APPROVE 2026-07-14; committed to main, build + ledger together, no push, no signature per brian). Artifact: .fab7/sdlc/assignments/build-story-E6-S4-20260714.result.yaml.
