  STORY-SL-1:
    title: "Normalized developer event contract + conformance test"
    status: "done"
    epic: "E1"
    sprint: null
    priority: "P0"
    dependencies: []
    blocked_by: []
    write_scope:
      - "contracts/dev-event/"
    validation_commands:
      - "cd contracts/dev-event/conformance && go build ./... && go test ./..."
    invariants:
      - "INV-2: content fields optional and absent by default; schema rejects content-when-disabled"
      - "INV-8: additive/compatible with openbox-core's accepted event types; no change to Temporal event semantics"
    gates:
      G1_READY:
        decision: "confirm"
        evidence: "Cross-repo review (SDK/core/backend): NO shared-contract mechanism exists anywhere (no contracts//proto//shared package; payload hand-transcribed per repo; core governance.go is de-facto SoT). So contracts/dev-event/ in openbox-shift-left is the correct home — nothing to slot into, shift-left-owned deliverable, and the ecosystem's first machine-checkable schema+conformance harness. Publish plan: repo-local single source consumed by SL-3 (imports conformance pkg) + adapters; serves as the spec EXT-core implements (hand-adds the 7 strings, as every other type is maintained). No relocation to a shared repo in Phase 1."
        decided_by: "brian"
        decided_at: "2026-07-07T08:00:00Z"
      G3_REVIEW:
        decision: "approve"
        evidence: "All 7 lifecycle types map onto GovernanceEventPayload/SpanData with NO core wire change. Verified live: (1) no downstream consumer (metadata extractor, guardrails-eligibility, OPA, AGE, observability, webhooks, backend read + varchar(50) column) errors/drops/crashes on a new event_type once accept-listed — INV-8 holds, R5 retired. (2) Envelope mapping matches SDK (source/workflow_id/run_id/spans/metadata; multi_agent/from_agent Handoff-only). (3) Tool-docs review: Claude Code/Cursor/Codex events map cleanly; bounded non-goals documented in COVERAGE.md. Caveat folded into MAPPING.md: SessionStarted->create/SessionEnded->terminal requires EXT-core edit #3 (lifecycle switch, S6 §3-scoped); overloading WorkflowStarted rejected (OPA-bypass + guardrail-skip + semantic conflation). CONSTRAIN 5th verdict tier + lowercase wire accepted as additive."
        decided_by: "brian"
        decided_at: "2026-07-07T08:00:00Z"
    audit:
      commit: null
      completed_at: "2026-07-07T08:00:00Z"
      validation_artifact: ".fab7/sdlc/assignments/build-story-SL1-20260707-0759.result.yaml"
      last_run_id: null
      status_reason: "Built + validated (go build/vet/test green). Both human gates resolved via cross-repo + tool-docs review at brian's direction: G1_READY confirm (contract home), G3_REVIEW approve (clean additive mapping, INV-8 verified downstream). Unblocks STORY-SL-3."
