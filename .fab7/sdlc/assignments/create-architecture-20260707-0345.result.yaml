summary: >
  Authored the Phase-1 architecture of record for shift-left developer-runtime
  governance, rewritten around the sponsor's guiding principle: maximal reuse,
  mirroring the OpenBox agent-runtime SDK for the developer runtime. Discovered
  that OpenBox already has the full lineage substrate (SessionEntity →
  GovernanceEventEntity → SpanEntity, plus SessionMerkleLeafEntity for tamper
  evidence) and a governance ingestion channel (POST /api/v1/governance/evaluate,
  Bearer obx_ + AIP signing) that the shift-left adapters onboard onto directly.
  The three prior open architecture decisions (OD-A host, OD-B OTLP intake, OD-C
  lineage store) are resolved to reuse and recorded as decisions D1/D2/D3. Net-new
  work is mostly client-side adapters + one additive event-type change.
