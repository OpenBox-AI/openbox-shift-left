assignment_id: "security-review-SL5-20260709"
role: "security_reviewer"
reviewer: "Sam"
story: "STORY-SL-5"
gate: "G_SEC"
status: "completed"
scope: >
  review-only (no source modified). Covers the provider-independent commit-trailer
  write side — NEW module adapters/common/git/ (trailer.go, session.go, registry.go,
  hook.go, notes.go, cmd/openbox-git-hook/main.go) read in full — plus the SL5-WIRE-1
  wiring diff (git diff HEAD): adapters/claude-code/{cmd/openbox-cc-hook/main.go,
  creds.go, installer.go, go.mod} and cli/{cmd/openbox/main.go,
  internal/devinit/devinit.go, internal/provider/provider.go}. This story writes into
  PERMANENT git history, maintains an on-disk per-session registry, and can modify a
  repo's .git/hooks — so it is reviewed against INV-1 (no secret in history), INV-2
  (metadata-only) and the git analog of INV-3 (a hook must never abort a commit).
summary: >
  APPROVE-WITH-CONDITIONS. The three security invariants HOLD on every path I traced
  and re-ran: INV-1 (no secret ever reaches a commit trailer, git note, argv, or log),
  INV-2 (registry + trailer carry only structural fields; 0600/0700 perms), and the
  INV-3-analog (every hook path — bad args, git error, unreadable msg file, panic —
  exits 0 and never aborts a commit). I independently rebuilt and re-ran the full test
  matrix under -race across all three modules (109 subtests green) and empirically
  reproduced the trailer-injection and forged-attribution behaviors against real git
  2.53.0 rather than trusting the builder's claims.

  There is NO hard blocker on the SL-5 code. The single security-relevant finding of
  substance is FORGED ATTRIBUTION (SL5-SEC-1, medium): squash-healing harvests ANY
  column-0 `OpenBox-Session:` line from the WHOLE commit-message body into the trailing
  trailer block, on EVERY commit — not only squashes. I confirmed empirically that a
  well-formed (non-secret) session id placed in a commit body by an attacker is promoted
  verbatim into the authoritative trailer block. Because a victim's real session id is
  an opaque UUID visible in the trailers of any commit they already pushed, an attacker
  with repo write/PR access can copy it and stamp a MALICIOUS commit as belonging to the
  victim's session. This is an attribution-integrity issue (INV-6-adjacent), NOT an INV-1
  leak (the obx_-shaped body line WAS correctly rejected in the same test) and NOT
  commit-breaking. It is inherent to the healing design (the write side deliberately
  cannot tell a forged body line from a legitimately-squashed one — that is the point of
  healing) so the authoritative fix belongs SERVER-SIDE in SL-6: exactly like the SL-3
  DID cross-binding check (SL3-SEC-5), SL-6 MUST bind each trailer value to a session
  actually OWNED by the authenticated pushing actor and reject/flag any that does not —
  never trust the trailer as identity. That is the primary condition.

  Two smaller conditions: SL5-SEC-2 (ambient install can be redirected by a malicious
  repo's core.hooksPath to write a — benign — prepare-commit-msg outside the repo; gated
  behind opt-in, low impact, but bound the write to the repo or refuse escaping hooksPath)
  and SL5-SEC-3 (WriteSessionRecord does not run validateSessionID before persisting the
  id to the 0600 registry — the trailer sink still rejects obx_, so INV-1 holds in git
  history, but the source feeding the sink should share the same gate as defense-in-depth).
  Ambient install is correctly OFF by default and opt-in only (confirmed). Decision:
  APPROVE-WITH-CONDITIONS.

inv1_trace:
  invariant: "No secret (obx_ key / Ed25519 seed) ever lands in git history, a git note, argv, or a log line."
  verdict: "PASS"
  evidence:
    - "validateSessionID (trailer.go:196-210) rejects, before anything reaches git: empty/whitespace, len>512 (maxSessionIDLen=512, trailer.go:18), any value containing \\n / \\r / \\x00 (blocks trailer-line / message-split injection), and any obx_-prefixed value (secret-shaped). Every id — env-tier, registry-tier, AND squash-harvested — passes through validSessionIDs->validateSessionID (trailer.go:88,172-186) before stamping."
    - "The trailer is written via `git interpret-trailers --if-exists=addIfDifferent --if-missing=add --trailer OpenBox-Session=<id> --in-place <file>` with exec.Command (trailer.go:93-105, run() at :38-54) — argv, NO shell, NO `sh -c`. The key=value is a single argv element that always begins with the literal 'OpenBox-Session=', so a crafted id can never be reinterpreted as a flag (comment at trailer.go:99-100 verified)."
    - "EMPIRICALLY CONFIRMED against real git 2.53.0: a commit body containing `OpenBox-Session: obx_livekey_shouldberejected` was NOT re-asserted into the trailing trailer block (validateSessionID dropped it), while a well-formed id was. So the obx_ secret shape cannot be promoted from a body line into the authoritative block."
    - "git notes mirror (notes.go:31-33) builds `-m` message from already-validated ids (validSessionIDs at :27) joined by literal newlines and passes it as a single argv element — no shell, no secret."
    - "No secret is logged: the hook binary (cmd/openbox-git-hook/main.go) and RunPrepareCommitMsg (hook.go:39-60) log only diagnostics + err; run() error wraps git's stderr, to which no secret is ever passed. Session ids are not secrets."
  residual: >
    SL-5 does not SCRUB a pre-existing secret-shaped line an author themselves typed into
    the body (it only declines to promote it to a trailer) — out of scope for the write
    side and not an SL-5-introduced leak. Noted, not charged.

inv2_trace:
  invariant: "Registry record and trailer carry ONLY structural fields (session_id, cwd, timestamp) — never content (prompt/command/file/output)."
  verdict: "PASS"
  evidence:
    - "SessionRecord (registry.go:45-49) = {session_id, cwd, updated_at} only. cwd is a blessed SL-1 structural field (HookEvent.Cwd, hookevent.go:52; the CC adapter deliberately decodes NO content-bearing field — hookevent.go doc :40-49). No prompt/command/file/output is read or written."
    - "The trailer value is the opaque session id ONLY — cwd is used solely for worktree matching (session.go:129-162) and is NEVER written into the commit."
    - "File perms correct: registry dir MkdirAll 0o700 and each record os.WriteFile 0o600, written atomically temp+rename (registry.go:73-85). RemoveSessionRecord tolerates absence (:90-98)."
    - "The CC wiring writes only ev.SessionID + ev.Cwd into the registry (adapters/claude-code/cmd/openbox-cc-hook/main.go +79..+88) — structural only, best-effort, logged fail-open."
  note: >
    InstallHook uses 0o755 for the hooks dir and the hook script — correct (a hooks dir
    must be traversable and the script executable); no secret material is written there.

inv3_analog_trace:
  invariant: "The prepare-commit-msg hook and openbox-git-hook binary must ALWAYS exit 0 — a non-zero exit aborts the developer's commit. Registry writes and ambient install are best-effort and never break a commit or session."
  verdict: "PASS"
  evidence:
    - "hookScript (hook.go:168-192) runs the engine only if resolvable (`command -v || [ -x ]`), appends `|| true`, and ends with `exit 0` — a missing/failing engine degrades to a no-op commit. Confirmed by TestE2E_MissingBinaryDoesNotBreakCommit."
    - "cmd/openbox-git-hook/main.go wraps main in `defer { recover(); os.Exit(0) }` (:28-34) — even a panic exits 0. No-args, unknown subcommand, and missing message-file all `return` (=> exit 0). Confirmed by TestBinary_AlwaysExitsZero."
    - "RunPrepareCommitMsg (hook.go:39-60) returns errors ONLY for logging; the caller always exits 0. StampMessageFile's git/read errors surface as a logged error, leaving the commit unstamped (SL-6 marks unattributed) rather than failing. interpret-trailers --in-place is atomic — on error the message file is left unchanged, so no half-written message can break the commit."
    - "Registry touch/cleanup (main.go +79..+88) and ambient install (maybeInstallGitHook +99..+128) are best-effort: every error is logged and swallowed; neither returns non-zero nor blocks the session/commit. The CC hook's own SL-4 exit-0 contract is unchanged."

findings:
  - id: "SL5-SEC-1"
    classification: "attribution_integrity"
    severity: "medium"
    target: "trailer.go:78-107 (StampMessageFile always harvests) + :124-148 (harvestSessionLines/scanSessionLines scan the WHOLE body); hook.go:28-30,51-58 (harvest runs on every commit, source-agnostic)"
    detail: >
      Squash-healing harvests every column-0 `OpenBox-Session:` line from the ENTIRE
      commit message (not just the trailing block) and re-asserts each valid one into
      the authoritative trailer block. StampMessageFile calls harvestSessionLines
      unconditionally on EVERY prepare-commit-msg invocation — PrepareCommitMsg
      deliberately ignores git's <source> arg (hook.go:24-27) — so this is not limited
      to squash/merge commits. Empirically reproduced against git 2.53.0: a body line
      `OpenBox-Session: 11111111-forged-attacker-2222` (well-formed, non-secret) was
      promoted verbatim into the trailing trailer block alongside the in-scope session.
      Consequence (adversarial): a session id is an opaque UUID that is PUBLICLY VISIBLE
      in the trailers of any commit the victim already pushed. An attacker with commit
      authorship (a PR author, or anyone who can craft a commit message) can copy a
      victim's real session id from a prior commit and place `OpenBox-Session: <victim>`
      in the body of a MALICIOUS commit; healing promotes it to the authoritative trailer,
      falsely attributing the malicious change to the victim's session. This is an
      integrity/attribution problem (INV-6-adjacent), NOT an INV-1 secret leak
      (validateSessionID still rejects obx_-shaped and injection-shaped values — I
      confirmed the obx_ body line was NOT promoted) and NOT commit-breaking (INV-3
      holds). It is inherent to the healing design: the write side cannot distinguish a
      forged body line from a legitimately-squashed-in one — that is precisely the
      property that lets a human with no session heal the agent sessions they squashed.
    in_scope_for_write_side: >
      Only partially. The write side cannot authoritatively resolve this without breaking
      squash healing. Gating harvest to git's <source>=="squash"/"merge" would shrink the
      surface (ordinary single commits would stop promoting body lines), but interactive-
      rebase squash does not reliably present that source, which is likely why the builder
      harvests unconditionally. The AUTHORITATIVE mitigation is server-side (SL-6).
    recommendation: >
      PRIMARY CONDITION on SL-6 (the git action): treat the OpenBox-Session trailer as an
      UNTRUSTED CLAIM. SL-6 MUST bind each trailer value to a session that is actually
      OWNED by the authenticated pushing actor/agent and reject or flag any value that does
      not resolve to a session the pusher owns — exactly the discipline SL-3 relies on for
      DID cross-binding (SL3-SEC-5: core verifies claimed identity belongs to the
      authenticated key). Never let a trailer alone assert attribution. SECONDARY (optional
      write-side hardening): consider gating harvest on <source> and/or recording in the
      SL-6 record that trailer values are self-asserted until server-verified. Document the
      forgeability of the raw trailer in doc.go so no downstream consumer trusts it blindly.

  - id: "SL5-SEC-2"
    classification: "filesystem_safety"
    severity: "low"
    target: "hook.go:135-161 (HooksDir honors core.hooksPath) + :109-131 (InstallHook) + adapters/claude-code/cmd/openbox-cc-hook/main.go +99..+128 (maybeInstallGitHook on SessionStart)"
    detail: >
      With ambient install opted in, opening a Claude Code session (SessionStart) in a
      MALICIOUS repo runs InstallHook against HooksDir(), which honors the repo-controlled
      `core.hooksPath`. An absolute or `..`-escaping core.hooksPath resolves (via
      filepath.Join with the toplevel, hook.go:138-145) to a path OUTSIDE the repo;
      InstallHook then MkdirAll(0755)s it and writes a file literally named
      `prepare-commit-msg`. Impact is bounded: the content is OpenBox's own benign exit-0
      hook, it will NOT overwrite an existing foreign file (marker check at hook.go:118-121),
      and a prepare-commit-msg dropped outside a real hooks dir is never executed. So the
      worst case is creation of directories + a benign fixed-name script at an attacker-
      chosen, user-writable path — limited, and only when the (default-OFF) ambient install
      is enabled and the developer opens a hostile repo. There is also a benign TOCTOU
      between the marker read (:118) and the write (:127).
    recommendation: >
      When ambient-installing, prefer <git-common-dir>/hooks and refuse (or warn on) a
      core.hooksPath that is absolute or escapes the repo worktree; at minimum note the
      malicious-repo redirect in the ambient-install docs. Non-blocking (opt-in + benign
      content). The manual/explicit `openbox-git-hook install` path is developer-initiated
      and lower concern.

  - id: "SL5-SEC-3"
    classification: "defense_in_depth"
    severity: "low"
    target: "registry.go:69-86 (WriteSessionRecord validates only sessionID!=\"\") vs trailer.go:196 (validateSessionID at the trailer sink)"
    detail: >
      The registry writer does NOT run validateSessionID before persisting the id — it
      only rejects the empty string. An obx_-shaped or control-char-bearing session id
      handed to the adapter would therefore be written into the 0600 registry JSON (and
      used, via sanitizeForFile, as the filename). INV-1 in GIT HISTORY still holds because
      the trailer sink (validateSessionID) rejects such a value before it can be stamped;
      and in practice ev.SessionID is a Claude Code UUID. But the registry is the SOURCE
      that feeds the trailer sink, so it should share the same gate. Separately,
      sanitizeForFile (registry.go:106-120) maps every non-[A-Za-z0-9-_] rune to '_',
      which correctly neutralizes path traversal (`../` -> `___`, verified) but is
      lossy — two distinct crafted ids can collide onto one record file (real UUIDs will
      not). os.WriteFile on the temp path follows a pre-planted symlink in the 0700 dir,
      but that requires prior local write access to a user-private directory (info-level).
    recommendation: >
      Run validateSessionID in WriteSessionRecord (skip/log an invalid id) so the registry
      never persists a secret-shaped or malformed id — defense-in-depth aligning source and
      sink. Non-blocking.

  - id: "SL5-SEC-4"
    classification: "observation"
    severity: "info"
    target: "hook.go:118-121 (managedMarker foreign-hook detection)"
    detail: >
      Foreign-hook detection is a substring check for managedMarker. A hostile pre-existing
      hook that merely CONTAINS the marker string would be treated as managed and
      overwritten — but that only replaces the attacker's own hook with OpenBox's benign
      exit-0 script, harming the attacker, not the developer. Conversely a user who hand-
      edits the OpenBox hook keeps the marker and is silently overwritten on re-install
      (acceptable/idempotent). Robust enough for the threat model.
    recommendation: "None required. Note only."

  - id: "SL5-SEC-5"
    classification: "observation"
    severity: "info"
    target: "adapters/claude-code/creds.go ResolveInstallGitHook (+ envInstallGitHook) + installer.go Plan disclosure + cli dev-init flag/dry-run"
    detail: >
      Ambient install (a repo-mutating, outward-facing action) is correctly OFF BY DEFAULT
      and enabled only by explicit opt-in: DevConfig.install_git_hook (written by
      `openbox dev init --install-git-hook`) or OPENBOX_INSTALL_GIT_HOOK; a missing/unreadable
      config resolves to false (fail-safe). It is DISCLOSED in the installer Plan
      (installer.go +66..+73), the dev-init --dry-run line (devinit.go +285), and the manual
      config (provider.go). This satisfies the opt-in + disclosure requirement.
    recommendation: "None. Positive confirmation."

positive_confirmations:
  - "INV-1 holds through EVERY id source (env, registry, squash-harvest): validateSessionID rejects empty/over-long(>512)/CRLF-NUL/obx_ before any value reaches git; the obx_ rejection was reproduced empirically against git 2.53.0."
  - "No shell anywhere in the git path — interpret-trailers, notes, config, rev-parse all run via exec.Command argv (trailer.go run(), notes.go, hook.go); key=value trailer args cannot be flag-injected."
  - "INV-2: registry record + trailer are strictly {session_id, cwd, timestamp}; cwd is a blessed SL-1 structural field and is never written into the commit; perms 0600 (record) / 0700 (dir), atomic temp+rename."
  - "INV-3-analog: hook script and binary exit 0 on every path incl. panic (recover+Exit(0)), bad args, git error, unreadable message, missing engine; --in-place is atomic so no half-written message. Registry + ambient install are best-effort and never break a commit or session."
  - "sanitizeForFile neutralizes path traversal (../ -> ___), confirmed; filenames are confined to the registry dir."
  - "Ambient install is OFF by default, opt-in only, fail-safe on config error, and disclosed in Plan/dry-run/manual output."
  - "Full test matrix re-run under -race across all three modules: adapters/common/git + cmd/openbox-git-hook green; adapters/claude-code (+cc-hook) green; cli green. 109 subtests total, 0 failures."

validation:
  ran:
    - command: "cd adapters/common/git && go build ./... && go vet ./... && go test -race -count=1 ./..."
      result: "pass"
      evidence: "build + vet clean; module and cmd/openbox-git-hook packages PASS under -race."
    - command: "cd adapters/claude-code && go build ./... && go test -race -count=1 ./...  ;  cd cli && go build ./... && go test -count=1 ./..."
      result: "pass"
      evidence: "claude-code (incl. cmd/openbox-cc-hook) and all cli packages PASS."
    - command: "empirical forgery/secret repro: real git 2.53.0 repo; StampMessageFile over a message body containing a forged well-formed OpenBox-Session line AND an obx_-shaped line"
      result: "confirmed"
      evidence: >
        the forged well-formed id (11111111-forged-attacker-2222) was promoted into the
        trailing trailer block (grounding SL5-SEC-1); the obx_-shaped body line was NOT
        promoted (grounding the INV-1 PASS). Output inspected directly.
  method: >
    Read all of adapters/common/git/*.go + the full SL5-WIRE-1 diff. Traced INV-1/INV-2/
    INV-3-analog source->sink for the secret shapes, the registry fields+perms, and every
    hook exit path. Re-derived nothing from the builder's cross-repo claims (none were
    needed — SL-5 is greenfield, stdlib-only, consumes no sibling symbol). Rebuilt and
    re-ran the test matrix under -race and reproduced the two adversarial behaviors against
    real git rather than trusting the tests.

G_SEC:
  decision: "approve-with-conditions"
  blockers: []
  conditions:
    - "SL5-SEC-1 (PRIMARY, carry onto SL-6): the OpenBox-Session trailer is an untrusted, forgeable claim (harvesting promotes any column-0 body line on every commit — reproduced). SL-6's server-side resolver MUST bind each trailer value to a session OWNED by the authenticated pushing actor and reject/flag values that do not resolve to a session the pusher owns — mirroring SL-3's DID cross-binding (SL3-SEC-5). Never treat the raw trailer as authoritative attribution. Document the forgeability in doc.go."
    - "SL5-SEC-2: bound ambient install to the repo — prefer <git-common-dir>/hooks and refuse/warn on a core.hooksPath that is absolute or escapes the worktree — so a malicious repo cannot redirect the (opt-in) install to write outside the repo. Non-blocking; fix before promoting ambient install beyond the pilot."
    - "SL5-SEC-3: run validateSessionID in WriteSessionRecord so the 0600 registry never persists a secret-shaped/malformed id — align the source with the trailer sink (defense-in-depth). Non-blocking."
  rationale: >
    The security-critical core is sound. All three named invariants hold on every traced
    and re-run path: INV-1 (validateSessionID gates every id source, no shell, no secret in
    trailer/note/argv/log — obx_ rejection reproduced), INV-2 (strictly structural fields,
    0600/0700), and the INV-3-analog (exit-0 on every hook/binary path incl. panic; best-
    effort registry + ambient install). No finding is an active exploit in the default
    configuration: forged attribution (SL5-SEC-1) is an integrity claim that SL-6 must
    verify server-side (the write side cannot without breaking squash healing) and is
    already the documented division of labor with SL-6; the ambient-install redirect
    (SL5-SEC-2) is gated behind a default-OFF opt-in and writes only benign content; the
    registry-validation gap (SL5-SEC-3) is contained because the trailer sink still rejects
    secrets. Approve to advance from in-review with the three conditions recorded — the only
    must-not-forget item is that SL-6 must not trust the trailer as identity.

route_to_orchestrator:
  - "APPROVE-WITH-CONDITIONS G_SEC for STORY-SL-5 — safe to advance. INV-1 / INV-2 / INV-3-analog all PASS with evidence; no hard blocker."
  - "CARRY SL5-SEC-1 as a REQUIRED condition on SL-6 (git action): the OpenBox-Session trailer is forgeable (empirically confirmed — any column-0 body line is harvested into the authoritative block on every commit). SL-6 MUST verify each trailer value belongs to a session owned by the authenticated pusher and never trust the raw trailer as attribution (analogous to SL3-SEC-5 DID cross-binding). This also relates to the existing SL6-SCAN follow-up."
  - "Fix before promoting ambient install past the pilot (SL5-SEC-2): bound the install to <git-common-dir>/hooks; refuse/warn on an escaping or absolute core.hooksPath so a hostile repo can't redirect the write."
  - "Small hardening (SL5-SEC-3): validate the session id in WriteSessionRecord so the registry never stores a secret-shaped id — defense-in-depth."
  - "Positive: ambient install is OFF by default, opt-in only, fail-safe, and disclosed in Plan/dry-run/manual (SL5-SEC-5). Foreign-hook marker detection is robust enough for the threat model (SL5-SEC-4)."
  - "Untouched by G_SEC: G1_READY (OD-SL5-A module home, OD-SL5-B registry design, OD-SL5-C squash-healing ratification) and G3_REVIEW remain brian's / the correctness auditor's."
