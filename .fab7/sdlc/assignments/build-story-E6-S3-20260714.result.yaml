summary: >
  Built STORY-E6-S3 — the enforce FAILURE POLICY: fail-open default (OD9) + per-org opt-in
  fail-closed + a configurable, clamped hard timeout (the S2 budget made a knob). E6-S1 OBTAINS a
  sidecar.Decision (fail-open primitive; Decision.FailOpen==true marks "the sidecar could not
  deliver a real verdict"); E6-S2 is the verdict-agnostic apply cascade. E6-S3 is a THIN transform
  inserted BETWEEN them — the Go port of the reference SDK's _handle_api_error (client.py:204-208):
  on an evaluation OUTAGE (dec.FailOpen) under fail-closed it SYNTHESIZES a client.VerdictHalt so
  the UNCHANGED, policy-agnostic mapVerdict/applyDecision cascade denies via its normal HALT path;
  in every other case it is a pass-through. So fail-open (default) leaves the outage as
  VerdictUnknown -> proceed (byte-identical to E6-S2 / observe); a REAL allow/constrain/block from a
  reachable sidecar is NEVER overridden under either policy (the failure policy governs the
  evaluation-unavailable case ONLY). The E6-S1 hard timeout became configurable
  (OPENBOX_ENFORCE_TIMEOUT_MS / enforce_timeout_ms), CLAMPED to maxEnforceTimeout (2s) so the whole
  PreToolUse hook stays under Claude Code's 5s hook kill — a correctness bound, since a hook-kill
  lets the tool proceed (a CC-layer fail-OPEN) which would silently defeat a fail-CLOSED org.
  Validation GREEN (adapter/sidecar/cli build/vet/test -race) + live E2E vs the real binary +
  `openbox sidecar serve` across all four quadrants (fail-open|closed x outage|real-verdict).
scope_boundary_confirmed_by_recon: >
  Per the user directive ("always use explore for cross-repo reference"), a read-only Explore of
  openbox-temporal-sdk-python recovered the reference failure policy this story ports. Findings:
  (1) it is a TWO-VALUE switch governance_policy = fail_open (default) | fail_closed, stored as
  GovernanceConfig.on_api_error (config.py:91; constants hook_governance.py:30-31); NO third state,
  NO env var, NOT per-org (a single worker-level string). (2) The decision is CENTRALIZED in one
  helper _handle_api_error (client.py:204-208): on an evaluate failure it returns None (fail-open ->
  the interceptor's `if governance_verdict:` is falsy -> proceed) OR a synthesized Verdict.HALT
  (fail-closed -> the SAME enforce_verdict cascade runs -> block/terminate). (3) enforce_verdict
  (verdict_handler.py:50-103) is POLICY-AGNOSTIC — the fail-closed path reuses the identical
  enforcement code as a real Core verdict. (4) SDK api_timeout=30s (config.py:94) is a REMOTE HTTP
  budget; our decision is LOCAL (S2: sidecar <10ms, ADR-0002 hook bound ~50ms), so E6-S3 keeps the
  ~50ms default and only makes it a knob. The Go port mirrors (2)+(3) exactly: applyFailurePolicy is
  the _handle_api_error analog (synthesize HALT or pass through), and mapVerdict/applyDecision stay
  UNCHANGED (the policy-agnostic cascade). The only intentional divergences (documented, accepted):
  per-org resolution via the dev config/env (consistent with every other shift-left coordinate,
  reuses ResolveEnforce's precedence — no new surface), and the local ~50ms/clamped-2s timeout vs
  the SDK's remote 30s.
key_design_decisions:
  synthesize_halt_reuse_cascade: >
    Rather than special-casing fail-closed inside applyDecision (which would fork the apply path),
    applyFailurePolicy synthesizes a client.VerdictHalt on a fail-open decision under fail-closed and
    lets the UNCHANGED mapVerdict cascade deny it — exactly the SDK's shape (a synthetic HALT travels
    the identical enforcement path as a real Core HALT). mapVerdict/applyDecision signatures are
    untouched, so E6-S2's tests and the tighten-only guarantee are preserved verbatim. This only ever
    converts a would-be PROCEED into a DENY (tighten-only, INV-3b).
  keys_on_failopen_not_verdict: >
    The transform keys on dec.FailOpen (set ONLY by sidecar.Client.allowFailOpen on socket
    absent/dial refused/deadline unset/marshal/write/read fault/malformed reply), NOT on the verdict
    value. A reachable sidecar that returns a real ALLOW/CONSTRAIN sets FailOpen==false, so
    fail-closed passes it through untouched -> proceed. This is the crux correctness clause: a
    fail-closed org blocks on an OUTAGE, never on a real allow. Live-verified (Scenario 3: fail_closed
    ON + live sidecar + benign -> empty stdout / proceed).
  timeout_clamp_is_correctness: >
    ResolveEnforceTimeout clamps a configured budget to maxEnforceTimeout=2s. This is not a nicety:
    Claude Code kills the PreToolUse hook at 5s (plugin/hooks/hooks.json), and a hook-kill lets the
    tool PROCEED — a CC-layer fail-OPEN that would silently defeat a fail-CLOSED org. Clamping the
    whole enforce wait to 2s guarantees a fail-closed deny is actually delivered before CC gives up,
    and keeps INV-3b bounded. <=0 / unparseable -> 0 -> sidecar.DefaultDecisionTimeout (~50ms),
    byte-identical to E6-S1.
  content_free_fail_closed_reason_INV2: >
    failClosedReason surfaces the fail-open fallback's CAUSE (dec.Evaluation.Reason), which on a
    fail-open decision is ALWAYS a static internal diagnostic string from allowFailOpen ("sidecar
    unavailable", "sidecar read failed or timed out", "sidecar response malformed", ...) — never
    anything derived from the tool command/file/output (INV-2). The durable audit records the
    synthetic HALT with fail_open==true — the unambiguous signature of a fail-closed deny (a real
    HALT never carries FailOpen==true), distinguishable from a real-verdict deny without a new field.
  fail_safe_default_OD9: >
    ResolveFailClosed defaults to false and treats a missing/unreadable config as false — an org can
    NEVER become fail-closed by accident, and a config read error never turns enforcement's teeth on.
    Fail-open stays the default (OD9). Fail-closed is meaningful ONLY in enforce mode.
build:
  files_changed:
    - "adapters/claude-code/enforce.go — FailurePolicy type + String; resolveFailurePolicy; applyFailurePolicy (the _handle_api_error analog); failClosedReason; newSidecarClient now threads ResolveEnforceTimeout"
    - "adapters/claude-code/creds.go — envFailClosed/envEnforceTimeout constants; DevConfig.FailClosed/EnforceTimeoutMS; ResolveFailClosed; ResolveEnforceTimeout; maxEnforceTimeout=2s"
    - "adapters/claude-code/hookrun.go — apply the failure policy between obtain (E6-S1) and apply (E6-S2) in the gated PreToolUse enforce branch"
    - "adapters/claude-code/enforce_test.go — TestApplyFailurePolicy (no-op fail-open / synth-HALT fail-closed / real-verdict untouched) + TestRunHook_EnforceFailClosed (E2E: outage->deny, real-allow->proceed, enforce-off byte-identical)"
    - "adapters/claude-code/creds_test.go — TestResolveFailClosed (precedence/default) + TestResolveEnforceTimeout (default 0 / config / env wins / non-positive / unparseable / clamp)"
  no_new_surface: >
    No new sidecar/core/backend surface. The sidecar.Client fail-open primitive is UNCHANGED; the
    per-org policy + timeout are resolved locally from the dev config/env exactly like every other
    shift-left coordinate. mapVerdict/applyDecision semantics unchanged.
validation:
  commands:
    - "cd adapters/claude-code && go build ./... && go vet ./... && go test -race ./...  # GREEN"
    - "cd sidecar && go build ./... && go vet ./... && go test -race ./...  # GREEN"
    - "cd cli && go build ./... && go vet ./... && go test ./...  # GREEN"
  live_e2e: >
    Built the real `openbox` binary + ran `openbox sidecar serve` with the example bundle. Four
    quadrants confirmed: (1) fail_closed ON + NO sidecar -> DENY with a content-free reason "…
    fail-closed (sidecar unavailable)", no command leak; (2) fail_closed OFF + NO sidecar -> EMPTY
    stdout (fail-open proceed, OD9); (3) fail_closed ON + live sidecar + benign -> EMPTY stdout (real
    allow proceeds even under fail-closed); (4) fail_closed ON + live sidecar + `rm -rf /` -> DENY
    citing the REAL policy id (shell.destructive.rm-rf-root), not the fail-closed message. Audit
    coherent + content-free: the fail-closed deny recorded verdict=HALT/would_block=true/
    applied=deny/fail_open=true; 0 command leaks.
reviews:
  g3_review_auditor:
    verdict: "APPROVE"
    evidence: >
      review_auditor (blind-diff + acceptance audit) 2026-07-14 = APPROVE. Independently verified
      every AC against the code + the E6-S1/E6-S2 seams (sidecar/client.go, enforce.go), the CC hook
      contract (hooks.json), and re-ran build/vet/test (green). AC-1 two-state + env-wins + fail-safe
      (FailOpen=iota default; ResolveFailClosed config-then-env, load-error->false; isTruthy rejects
      garbage). AC-2 synth-HALT guard `if !dec.FailOpen || policy != FailClosed { return dec }` fires
      iff outage+fail-closed; mapVerdict/applyDecision byte-unchanged. AC-3 fail-open no-op preserved.
      AC-4 (the crux) verified: allowFailOpen (client.go:78-84) is the SOLE setter of FailOpen=true and
      always emits VerdictUnknown, so no reachable-sidecar allow can carry FailOpen=true -> the
      !dec.FailOpen guard passes it through; NO path denies a real allow. AC-5 clamp: maxEnforceTimeout=2s,
      threaded via newSidecarClient, PreToolUse hot path has exactly one bounded external wait
      (Client.Decide) -> enforce wait <=2s, comfortably under the 5s PreToolUse kill in hooks.json.
      AC-6 content-free reason (static string + fixed allowFailOpen cause, reachable only when
      FailOpen==true) + synthetic HALT records fail_open=true (the fail-closed-deny signature). AC-7
      enforce-only/PreToolUse-only. NO stop condition tripped. Two NON-BLOCKING NITs, both FIXED in-code:
      NIT-1 (ResolveEnforceTimeout doc overstated "unparseable->0"; actual/better = unparseable env
      falls back to config) -> comment tightened; NIT-2 (FailurePolicy.String() unexercised) -> wired
      into logEnforceDecision so a fail-closed deny is legible in the diagnostic + TestLogEnforceDecision_PolicyLegible added.
  g_sec_security_reviewer:
    verdict: "APPROVE"
    evidence: >
      Sam (security_reviewer) 2026-07-14 = APPROVE. All three invariants PASS; build/vet/test -race
      re-run green. INV-1: the two resolvers are config+env reads only (no keychain/osSecretLookup);
      reason + audit secret-free. INV-2: traced failClosedReason's cause to origin — applyFailurePolicy
      reaches the synthesis branch ONLY when dec.FailOpen==true, whose SOLE producer is
      sidecar.allowFailOpen (client.go:78) called with six STATIC literal strings (never request-derived);
      every server-originated Decision is FailOpen=false — so the cause is always a fixed internal
      diagnostic, never command/file/output. enforcementRecord has no reason field; a fail-closed deny
      records HALT+fail_open=true (unambiguous, distinguishable from a real-verdict deny). INV-3b:
      (a) fail-open cannot be reached by accident (load-error keeps enabled=false; only an explicit
      truthy config/env flips it); (b) the timeout clamp holds for ALL integer inputs — Sam empirically
      swept negative/zero/empty/whitespace/500/600000/max-int64/overflow and every result is <=2s (the
      near-max-int64 wrap-to-negative case still fails open fast, erring toward a SHORTER wait); wait can
      never approach CC's 5s PreToolUse kill; (c) the deny is pre-execution + bounded. Adversarial angles
      all clear: cannot deny a real allow (keys on FailOpen not verdict); no untrusted payload into
      reason/timeout; strconv.Atoi safe; synthetic HALT is a local by-value mutation, records content-free.
      THREE INFO findings, none blocking: INFO-2 (near-max-int64 overflow — safe, optional hardening)
      FIXED in-code (clamp ms before the multiply, overflow impossible by construction); INFO-3 (test gap:
      no negative-env case) FIXED (added -1 + max-int64 cases); INFO-1 carried to E6-S7 (see below).
  info_1_carry_forward_to_e6_s7: >
    G_SEC INFO-1 (out of E6-S3 scope; DO NOT fix here — the story's stop-conditions forbid touching the
    sidecar/server surface): fail-closed does NOT engage on a REACHABLE-but-UNBUNDLED sidecar. The
    server returns a structured cold-start/no-bundle reply with Source="fail-open:no-bundle"
    (sidecar/server.go); because the client got a well-formed reply it marks the Decision FailOpen=false
    (client.go:140), so applyFailurePolicy treats it as a REAL verdict and does not deny — a fail-closed
    org is silently UNGOVERNED while the sidecar is up but has no bundle. Given core currently ships no
    real OPA bundle ([EXT-opa-bundle], E6-S5), "up but unbundled" is a plausible LIVE state. ACTION:
    E6-S7 fail-closed conformance MUST cover the "sidecar up but unbundled" quadrant, and a future story
    should reconcile the semantic mismatch (a Source literally named "fail-open:no-bundle" carried on a
    FailOpen==false decision — arguably the server should signal "no real verdict" so the client's
    failure policy can engage). Recorded in E6-backlog.md §E6-S7 and the status ledger.
