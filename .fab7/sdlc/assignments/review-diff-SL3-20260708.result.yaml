summary: >
  Independent blind correctness + acceptance audit of the OpenBox developer-runtime
  data-plane client (STORY-SL-3, client/ Go module). Read all source and tests fresh
  (did not assume the builder's reasoning); re-ran build/vet/test uncached (18 pass);
  and independently re-verified the DATA-PLANE contract against LIVE openbox-core via a
  read-only Explore agent — the AIP verifier, the GovernanceEventPayload/SpanData wire
  tags, the response shape, the semantic-type computation, the accept-list, AND (new)
  core's actual dedupe machinery. The transport core is correct and faithfully mirrored:
  signing matches core's BuildAgentIdentityCanonicalRequest byte-for-byte (order,
  UPPER(method), LF-joined, RFC3339Nano, ±5min, constant-time SHA, StdEncoding sig);
  every GovernanceEventPayload/SpanData JSON tag and pointer type matches core exactly
  (FuncName->"function", start_time/end_time int64-ns not-omitempty, lines_count *int,
  bytes_* *int64, bodies *string); verdict parsing covers all 5 wire strings + legacy
  action + safe unknown; retry is exactly maxRetries+1 attempts with 4xx terminal /
  5xx+429 retried; the SAME body is re-signed (fresh ts/nonce) but never re-marshaled;
  fail-open (INV-3) and content-strip (INV-2) and no-leak (INV-1) hold and are tested
  against a faithful core-mirror. 5 of 7 ACs fully met. TWO ACs are only PARTIAL and
  the build artifact over-claims both: AC7/INV-5 idempotency is not achieved end-to-end
  (F1 — event_id is never transmitted and core has NO dedupe path for dev events, so a
  retry after an ambiguous success double-counts), and the semantic_type mapping does
  not survive core's server-side override (F2). Neither is unsafe in Phase-1 observe
  (verdict ignored; the 7 dev types 400 today until EXT-core), so the recommendation is
  REVISE, not BLOCK. G_SEC (Sam) is still PENDING. No code was modified.

validation:
  ran:
    - command: "cd /run/media/brian/DATA/works/openboxai/openbox-shift-left/client && go build ./... && go vet ./... && go test -count=1 ./..."
      result: "pass"
      evidence: >
        Build clean, vet clean. 18 tests PASS, 0 fail, 0 skip (uncached, -count=1) —
        the builder's "18 tests pass" is accurate this time. Named properties confirmed:
        TestSign_VerifiesAgainstKnownKeypair (signature verifies through a core-mirror
        of agent.go's verifier), TestSign_TamperedBodyFailsVerification,
        TestNewSigner_RejectsBadSeed, TestCanonicalString_Shape (no trailing LF),
        TestEmit_HappyPath_SignedAndParsed (path + Bearer + decoded envelope + span),
        TestEmit_VerdictParsing (all 5 wire verdicts), TestEmit_FailOpen_Unreachable
        (no throw + INV-1 log-safety), TestEmit_RetriesThenSucceeds (3 calls),
        TestEmit_5xxExhausted_FailsOpen (3 calls), TestEmit_4xxNotRetried (1 call),
        TestEmit_EmptyEventID_IsCallerError, TestEmit_RetryReusesSameEventID (byte-
        identical body — but see F1: does NOT prove server dedupe), plus payload
        mapping tests (envelope, tokens/cost->metadata, span transport fields + epoch-ns,
        function/file hook_type, content-strip default + enabled carry-through).
  cross_repo_verification:
    method: "Read-only Explore agent against LIVE /run/media/brian/DATA/works/openboxai/openbox-core (data-plane surface)."
    result: "signing + wire tags + response VERIFIED exact; two runtime mismatches FOUND (F1, F2)."
    detail: >
      VERIFIED CORRECT: (1) BuildAgentIdentityCanonicalRequest (agent.go:93) =
      strings.Join([ToUpper(method), path, timestamp, nonce, bodySHA256], "\n") — no
      trailing newline; the client's canonicalString + signing.go match this exactly.
      ValidateAgentIdentity parses time.RFC3339Nano, ±5min window (default 300s,
      env-overridable), subtle.ConstantTimeCompare on the hex body-sha,
      base64.StdEncoding signature, enforced only when SigningRequired==true. The test's
      verifyLikeCore is a FAITHFUL mirror of this verifier (uses server-computed sha in
      the canonical, StdEncoding, RFC3339Nano). So AC2/AC6 are genuinely proven.
      (2) GovernanceEventPayload (governance.go:186) tags match the client's
      governanceEventPayload field-for-field: source/event_type/workflow_id/run_id/
      timestamp(string) not-omitempty; span_count/spans/metadata omitempty; metadata is
      json.RawMessage. Core requires none of these at ingest except a valid event_type.
      (3) SpanData (governance.go:266) matches the client's spanData exactly:
      span_id/trace_id/name not-omitempty; start_time/end_time int64 NOT-omitempty (ns —
      storage does time.Unix(0, StartTime)); stage/semantic_type/hook_type omitempty;
      file_path/file_operation *string; bytes_read/bytes_written *int64; lines_count
      *int (NOT int64 — client matches); FuncName has json:"function"; request_body/
      response_body *string. int->int64 widening is safe (no overflow).
      (4) Response ToPublicResponse (governance.go:366) — verdict is a plain lowercase
      string {allow|constrain|require_approval|block|halt}; legacy action present;
      governance_event_id/risk_score/fallback_used always present. verdict.go parses all
      of these and returns VerdictUnknown (never a false deny) on anything unmapped.
      (5) isValidGovernanceEventType (governance.go:273) accepts only the 7 Temporal
      types — the 7 dev types return 400 TODAY (post-auth), so a real POST fail-open
      drops (logged); the client correctly treats 400 as terminal (not retried). This is
      the known EXT-core dependency; tests correctly use a core-mirror.
      MISMATCHES FOUND: (F2) ComputeSemanticTypeFromSpan (session.go:204) is applied
      UNCONDITIONALLY on the ingest path (governance_workflow.go:308-310), OVERRIDING
      any client semantic_type, and it consults span.Attributes + FilePath + span Name —
      it does NOT read hook_type or function at all. (F1) core has NO event_id/idempotency
      key on ingest; dedupe exists only for activity events (needs activity_id) and hook
      spans (needs HookTrigger) — dev events have neither, and the spans table has no
      unique constraint, so identical dev-event POSTs are stored twice (double-counted).

acceptance_criteria:
  - id: "AC1: given a normalized SL-1 event, builds GovernanceEventPayload and POSTs to /api/v1/governance/evaluate with Authorization: Bearer <obx_>"
    met: true
    evidence: >
      payload.go buildPayload maps envelope per MAPPING §1 (source=developer-runtime,
      event_type, workflow_id = WorkspaceID||DeveloperDID fallback, run_id=SessionID,
      timestamp passthrough); client.go:186-200 POSTs to the exact evaluatePath const
      "/api/v1/governance/evaluate" with headerAuthorization "Bearer "+apiKey.
      TestEmit_HappyPath asserts path, Bearer, and decoded source/event_type/run_id/
      workflow_id/span against a core-mirror. All wire tags re-verified exact cross-repo.
  - id: "AC2: AIP Ed25519 signing — canonical METHOD\\npath\\ntimestamp\\nnonce\\nbodySHA256 + X-OpenBox-Agent-{DID,Timestamp,Nonce,Signature} + X-OpenBox-Body-SHA256"
    met: true
    evidence: >
      signing.go sign() builds bodySHA=lowercasehex(sha256), timestamp=UTC +00:00 offset
      (the same string signed and sent), nonce=base64url-nopad(24 bytes)=32 chars,
      canonical via canonicalString (UPPER(method) + LF-joined, no trailing LF),
      sig=StdEncoding(ed25519.Sign(seed, utf8(canonical))). newSigner decodes a std-b64
      32-byte seed via ed25519.NewKeyFromSeed. All 5 AIP headers + Authorization + SDK
      version set in client.go:attempt. Verified BYTE-FOR-BYTE against core's
      BuildAgentIdentityCanonicalRequest/ValidateAgentIdentity (agent.go:93/103); the
      known-keypair test verifies through a faithful mirror of that verifier.
  - id: "AC3: timeout (default 30s) + retry (max 2, base 150ms); fail-open for observe — never blocks the caller (INV-3)"
    met: true
    evidence: >
      defaultTimeout 30s, defaultMaxRetries 2, defaultRetryBase 150ms. post() loops
      attempt 0..maxRetries inclusive = exactly 3 attempts; 4xx terminal, 5xx/429
      retried, network err retried; ctx cancellation aborts backoff cleanly. Emit returns
      (VerdictUnknown, nil) on EVERY transport/build error — never errors or blocks the
      decision. TestEmit_FailOpen_Unreachable / 5xxExhausted / 4xxNotRetried / retries-
      then-succeeds prove the attempt counts and no-throw. CAVEAT (F4): the 30s is
      PER-ATTEMPT, so worst-case Emit wall-clock is ~3x30s + backoff (~90.5s) for a
      synchronous caller; no overall deadline. Fail-open decision is honored; the latency
      bound is not — LOW.
  - id: "AC4: metadata-only enforcement — strips content when content-capture disabled (INV-2)"
    met: true
    evidence: >
      Emit strips on the default path (client.go:133-135 -> stripContent) on a COPY
      (caller event never mutated); stripContent nils Content and clears span
      RequestBody/ResponseBody. TestStripContent_Default_RemovesAllContent proves no
      content-shaped bytes ("secret prompt"/"diff"/"file body") reach the wire and the
      caller's event is untouched. Enabled path carries span bodies
      (TestContentGate_Enabled_CarriesSpanBodies). See F3: top-level Content.* is never
      mapped to the payload even when enabled — but that fails SAFE and does not weaken
      the disabled-strip guarantee this AC requires.
  - id: "AC5: parses the verdict (HALT/BLOCK/REQUIRE_APPROVAL/ALLOW) but observe-mode ignores it"
    met: true
    evidence: >
      verdict.go parses core's lowercase verdict (all 5 incl. CONSTRAIN) + legacy action
      fallback -> canonical enum; unknown/empty/malformed -> VerdictUnknown (NEVER a
      false deny — safe). Emit returns it; Phase-1 callers ignore it (observe).
      TestEmit_VerdictParsing covers all 5 wire strings. Response shape re-verified
      cross-repo (verdict lowercase + action legacy).
  - id: "AC6: unit tests incl. a signed request verified against a known Ed25519 keypair + fail-open test (unreachable -> no throw)"
    met: true
    evidence: >
      TestSign_VerifiesAgainstKnownKeypair uses a fixed base64 seed and verifies the
      signature through verifyLikeCore — confirmed a FAITHFUL core-mirror (same canonical
      order/joiner, server-computed sha, StdEncoding, RFC3339Nano). Not a trivial pass.
      TestEmit_FailOpen_Unreachable hits a closed port, asserts no error/block, drop-log
      present, and no secret in logs (INV-1). Both genuinely exercise the claims.
  - id: "AC7: client event id for idempotent ingestion (INV-5)"
    met: partial
    evidence: >
      The EventID is REQUIRED (Emit errors on empty — TestEmit_EmptyEventID) and retries
      reuse the identical marshaled body (body built once in Emit before the retry loop;
      re-signed with fresh ts/nonce but never re-marshaled). BUT idempotency is NOT
      achieved end-to-end (F1): DevEvent.EventID is never transmitted — buildPayload emits
      no event_id field and buildMetadata does not carry it — and core has NO event_id
      dedupe. Core dedupes only activity events (by activity_id, which dev events lack)
      and hook spans (by HookTrigger+span_id, which dev events lack); the spans table has
      no unique constraint. So a retry after an ambiguous success (server committed but
      the 200 was lost, or a 5xx-after-commit) is stored as a SECOND event -> tokens/
      cost/lineage double-counted, exactly the case event.go:15-16 promises never happens.
      The passing TestEmit_RetryReusesSameEventID only asserts the two bodies are
      byte-identical; the mock appends both without deduping, so it does not validate
      idempotent INGESTION. INV-5 is thus a required-but-insufficient precondition only.

findings:
  - id: F1
    severity: medium
    classification: correctness/acceptance
    target: "client/payload.go:59-88 + client/payload.go:145-160 (no event_id on wire) ; client/client_test.go:257-278 (misleading test) ; core: no ingest dedupe for dev events"
    detail: >
      INV-5 / AC7 idempotency is not delivered end-to-end. DevEvent.EventID (json
      "event_id") lives only on the un-marshaled DevEvent; buildPayload writes
      governanceEventPayload (no event_id field) and buildMetadata merges only
      ev.Metadata + tokens + cost — so event_id NEVER reaches core, in body or metadata.
      Independently verified against live core: /evaluate has no idempotency key/header;
      dedupe exists only for activity events (CheckExistingEventActivity requires
      activity_id) and hook spans (requires HookTrigger + a stable span_id), and the
      spans table has no UNIQUE constraint. Dev events carry neither activity_id nor
      HookTrigger, and span_id is client-random. FAILURE SCENARIO: attempt 1 POSTs and
      core commits the event/span, but the 200 is lost (or core returns 5xx after commit);
      the client retries the identical body; core stores a SECOND event -> SessionEnded
      total_tokens / Deploy lineage / cost are double-counted. This contradicts the
      code's own promise ("retries and buffered flushes are never double-counted",
      event.go:15-16) and the build artifact's AC7 "met: true". The green test proves
      only byte-identical bodies (the core-mirror does not dedupe), so it validates a
      necessary-not-sufficient property and is mislabeled as idempotency.
    recommendation: >
      (1) Carry event_id now (e.g. metadata.event_id or a client idempotency header) so a
      dedupe key exists on the wire. (2) Scope the claim: true server-side dedupe for dev
      events needs an EXT-core change (dedupe on event_id, or a spans unique key) — track
      it as an EXT-core dependency and mark AC7 PARTIAL until then. (3) Fix the test name/
      assertion (or add a note) so it does not read as proving ingestion idempotency;
      soften the event.go "never double-counted" comment to the retry-body-identical
      guarantee it actually provides.
  - id: F2
    severity: medium
    classification: correctness/mapping-fidelity
    target: "client/payload.go:100-103 (span Name) + client/payload.go:130-139 (hookTypeFor) ; core session.go:204-272 + governance_workflow.go:308-310"
    detail: >
      The client's semantic_type strategy does not survive core. Verified against live
      core: ComputeSemanticTypeFromSpan is applied UNCONDITIONALLY at ingest
      (governance_workflow.go:308-310), OVERWRITING the client's semantic_type, and it
      reads span.Attributes + FilePath + span Name only — it NEVER consults hook_type or
      function. So the client's entire hookTypeFor() output (file_operation/function_call)
      is dead, and: (a) file spans -> core switches on span Name for file.write/read/
      open/delete, but the client sets Name = tool name (e.g. "Edit","Read"), which
      matches none, so every file op is stored as the default file_read (a file_delete or
      file_write is mislabeled read); (b) mcp/function spans -> with no span.Attributes
      (the client's spanData has no attributes field) and no matching Name, they collapse
      to "internal" instead of mcp_tool_call. MAPPING.md §2/§3's stated mechanism ("also
      set SpanData.hook_type ... to land the intended semantic_type") does not match
      core's actual computation. NON-BLOCKING in Phase-1 observe (semantic_type is
      analytics only, the verdict is ignored, and the 7 dev types 400 today so nothing is
      stored yet), but it is a real fidelity gap the moment EXT-core accept-lists the
      types. Root cause spans SL-1 (MAPPING) + EXT-core, surfaced by this client.
    recommendation: >
      Reconcile with SL-1 / EXT-core: either core honors hook_type or a client-provided
      semantic_type, or the client emits what core's ComputeSemanticTypeFromSpan actually
      keys on (span Name = file.write/file.read/file.open/file.delete for file ops;
      Attributes["mcp.method"]="callTool" for MCP). Add a mapping test that asserts the
      RESULTING stored semantic_type via core's computation, not just the hook_type hint.
  - id: F3
    severity: low
    classification: correctness/completeness
    target: "client/payload.go:59-124 (buildPayload never reads ev.Content)"
    detail: >
      DevEvent.Content (Prompt/Output/FileText) is never mapped into the payload — even
      when content-capture is ENABLED. buildPayload only maps span RequestBody/
      ResponseBody. MAPPING §1 lists content.* as a source for span bodies when enabled;
      that path is unimplemented, so top-level prompt/output content can never be
      transmitted. This FAILS SAFE (never leaks, and the INV-2 disabled-strip path is
      unaffected), and is harmless in Phase-1 metadata-only, but it means the enabled-carry
      behavior is incomplete versus the contract.
    recommendation: >
      Either document that top-level Content is intentionally never egressed in Phase-1
      (safe-by-design), or implement the content.* -> span body mapping for the enabled
      path so the contract's stated behavior holds.
  - id: F4
    severity: low
    classification: performance/reliability
    target: "client/client.go:84-87 (per-attempt 30s) + client/client.go:157-176 (retry loop)"
    detail: >
      The 30s timeout is PER HTTP ATTEMPT (http.Client.Timeout), and each retry gets a
      fresh 30s, so worst-case Emit wall-clock is ~3x30s + (150ms+300ms) ~= 90.5s. There
      is no overall deadline inside the client. A caller that awaits Emit synchronously
      (e.g. a blocking PreToolUse hook) could be stalled ~90s against a hung core, which
      would blow the NFR-3 latency budget even though the fail-open DECISION is still
      correct. The escape hatch is a caller-supplied ctx with a deadline (respected in
      post()), but nothing in the client enforces an aggregate bound and the "30s timeout"
      naming is misleading.
    recommendation: >
      Either derive a bounded overall context in Emit (e.g. cap total time) or clearly
      document that 30s is per-attempt, worst-case ~3x, and that observe callers must emit
      asynchronously / pass a deadline'd ctx.
  - id: F5
    severity: low
    classification: robustness
    target: "client/client.go:126-129 (only EventID validated)"
    detail: >
      Emit enforces only a non-empty EventID. The other contract-required fields
      (openbox_session_id, developer_did, event_type, timestamp, tool.name/kind — all
      minLength/required in dev-event.schema.json) are unchecked; e.g. an empty SessionID
      silently yields run_id="" which core does not validate at ingest, breaking the
      "(workflow_id, run_id) jointly-unique NOT-NULL" intent quietly. Adapters are
      expected to build valid events and the SL-1 conformance harness is the gate, so this
      is minor and fail-open, but a malformed event degrades silently rather than being
      caught.
    recommendation: >
      Add light precondition checks (or a shared validate() reused from the conformance
      harness) for the required identity/session fields, or document that validity is the
      caller/harness responsibility.
  - id: F6
    severity: info
    classification: security/defense-in-depth
    target: "client/payload.go:165-174 (stripContent) + buildMetadata"
    detail: >
      stripContent scrubs Content and span bodies but does not scan ev.Metadata for
      content a caller may have wrongly placed there; the client trusts the caller +
      SL-1 harness (INV-2 says metadata must never carry content). Consistent with the
      contract's division of responsibility; note it so G_SEC is aware the client is not
      a metadata content-scrubber.
    recommendation: "None required; confirm at G_SEC that metadata scrubbing is the harness's job, not the transport's."
  - id: F7
    severity: info
    classification: accuracy/build-claim
    target: ".fab7/sdlc/assignments/build-story-SL3-20260708-1200.result.yaml (AC7 + idempotency finding)"
    detail: >
      The build artifact marks AC7/INV-5 "met: true" with evidence "retries reuse the
      identical body" and cites TestEmit_RetryReusesSameEventID. Per F1 that is a
      necessary-not-sufficient property; the claim over-states delivered idempotency. The
      "18 tests pass" claim is accurate (verified uncached, 0 skip). The Python
      ensure_ascii observation is correct and non-blocking (signed==sent bytes).
    recommendation: "Restate AC7 as PARTIAL pending an event_id dedupe key + EXT-core support."

G3_REVIEW:
  decision: revise
  blocking_findings: [F1, F2]
  gate_dependency: "G_SEC (Sam) still PENDING (signing / key handling); G1_READY (brian) still PENDING (module home + transport defaults + sdk_version tag)."
  rationale: >
    The transport core is genuinely correct and independently re-verified against live
    openbox-core: the AIP canonical string / verifier match byte-for-byte, every
    GovernanceEventPayload and SpanData JSON tag and pointer type matches exactly
    (FuncName->"function", start/end int64-ns not-omitempty, lines_count *int, bytes_*
    *int64, bodies *string), the response verdict/action parsing is complete and can
    never emit a false deny, the retry loop is exactly maxRetries+1 with correct 4xx-
    terminal / 5xx+429-retry classification and clean context cancellation, the same body
    is re-signed (fresh ts/nonce) but never re-marshaled, and fail-open (INV-3) +
    content-strip (INV-2) + no-secret-in-logs (INV-1) hold and are proven by tests that
    exercise a FAITHFUL core-mirror (the known-keypair signature test and the fail-open
    test are real, not trivial). 5 of 7 ACs are fully met. I am NOT approving-to-done
    because two acceptance items are only PARTIAL and the build artifact over-claims both:
    (1) AC7/INV-5 idempotency is not delivered end-to-end (F1) — event_id is never on the
    wire and core has no dedupe path for dev events, so a retry after an ambiguous success
    double-counts, contradicting the code's own "never double-counted" promise, and the
    green test only proves byte-identical bodies; (2) the semantic_type mapping does not
    survive core's unconditional server-side override, which ignores hook_type/function
    (F2), so file/mcp/function spans are mis-stored once EXT-core lands. Neither is a
    safety defect in Phase-1 observe (verdict ignored; the 7 dev types 400 today), so this
    is REVISE, not BLOCK: put event_id on the wire + scope/track the dedupe gap, reconcile
    the semantic_type mechanism with core (SL-1/EXT-core), correct the misleading test/
    claims, then clear G_SEC and G1_READY before marking DONE. No correctness defect was
    found in signing, the payload envelope, retry classification, verdict parsing, the
    fail-open path, or content stripping.
  no_code_modified: true
