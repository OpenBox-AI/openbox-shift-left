overall: >
  RunHook is a faithful lift of the old cmd/openbox-cc-hook body — every step and order preserved; the
  only change is recover() no longer self-exits, which both callers now do. INV-3 holds on the
  multi-command binary: run() dispatches `hook` before any usage()/version path; runHook writes only to
  stderr and always returns exitOK; verified empirically (exit 0 / 0 stdout across unknown provider,
  missing args, bad hook name, empty/garbage stdin, flush). Verdict REVISE for AC4 gaps + a
  comment/behavior mismatch — both addressed in-code.
findings:
  - id: "F1"
    severity: "MEDIUM (acceptance, AC4)"
    class: "CONFIRMED"
    disposition: "FIXED"
    title: "smoke test did not assert AC4's latency budget or content-absence on the delivered payload"
    detail: "TestHookEndToEndSmoke counted /evaluate POSTs but asserted no latency budget and never inspected the delivered body. Fix: the smoke now (a) asserts the 4 hot-path hooks cause ZERO egress and each returns within a coarse wall-clock budget (the NFR-2 async/no-network-on-hot-path guarantee), and (b) plants a content canary in tool_input.command and asserts it is absent from every body delivered to /evaluate (INV-2 on the egress bytes, not just the spool)."
  - id: "F2"
    severity: "LOW/MEDIUM (robustness, comment vs behavior)"
    class: "CONFIRMED"
    disposition: "FIXED"
    title: "placeEngineBinary fatal-on-failure contradicted the 'best-effort / install still succeeds' comment"
    detail: "providers.go implied any placement failure is non-fatal, but a copy failure (path set but unreadable) aborts Install after materializeBundle, before writeConfig — a half-install. Fix: clarified both comments — best-effort applies to path RESOLUTION (os.Executable may fail → EngineBinary empty → skip); once set, a copy failure surfaces loudly (a bundle whose hooks point at a missing engine is a silently broken install). Behavior kept fatal-when-set by design."
  - id: "F4"
    severity: "LOW (coverage, AC3)"
    class: "CONFIRMED"
    disposition: "FIXED"
    title: "no test proved bin/openbox placement through the real `dev init` front door"
    detail: "TestClaudeCodeInstallsForRealExitsZero stat'd only plugin.json. Fix: it now also asserts bin/openbox exists and is executable — proving providers.Lookup → os.Executable() → EngineBinary → placement end-to-end."
  - id: "F3"
    severity: "LOW/INFO"
    class: "CONFIRMED"
    disposition: "FIXED (post-review — brian decided the OD17 fold 2026-07-09)"
    title: "dev init places bin/openbox but not bin/openbox-git-hook"
    detail: "RESOLVED by folding openbox-git-hook into `openbox hook git <sub>` (git.RunHook; standalone binary reduced to a thin alias). The ambient + explicit installs now bake `<engine> hook git prepare-commit-msg`, so bin/openbox (already placed) is the ONLY binary needed — no sibling. Proven end-to-end by cli TestUnifiedBinaryGitHookStampsCommit (install via `openbox hook git install` → real commit → OpenBox-Session trailer stamped). The fold was independently RE-VERIFIED (focused G3 + G_SEC, both APPROVE) — see review-gitfold-SL4-WIRE-2-20260709.result.yaml."
  - id: "GSEC-INFO-1"
    severity: "LOW/INFO"
    class: "CONFIRMED"
    disposition: "FIXED"
    title: "alias/runHook relied solely on RunHook's internal recover (double-panic parity)"
    detail: "Restored belt-and-suspenders: the openbox-cc-hook alias now `defer os.Exit(0)`; runHook uses a named return defaulting to exitOK + deferred recover. A panic can never yield a non-zero (blocking) exit."
