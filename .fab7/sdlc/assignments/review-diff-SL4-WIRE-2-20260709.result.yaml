  - "EngineBinary: 0755 (CreateTemp 0600 → Chmod 0755 → rename), atomic within binDir, idempotent, empty-skip covered; ReInstallIsByteIdentical unaffected."
  - "Thin alias exits 0 / empty stdout / spools correctly."
