cross_repo_reference:
  method: "Two read-only Explore agents (per user directive: always use explore for cross-repo reference) over ../openbox-temporal-sdk-python and ../openbox-core"
  verified:
    - "SDK MAP (openbox-temporal-sdk-python/openbox/errors.py:92-119 _SIGNING_REASON_MESSAGES): exactly six keys — signature_invalid, nonce_replayed, did_agent_mismatch, verifier_not_configured, timestamp_outside_window (core canonical), timestamp_skew (alias). All raise OpenBoxSigningError(message, reason_code)."
    - "SDK PARSE (config.py:231-249 _extract_reason_code): flat JSON object; reads reason_code || code || reason in that order; STRING values only (isinstance(code,str)); non-JSON/empty/non-dict -> None. Extraction gated on signer != None and HTTP 401/403 (config.py:302-313). Unknown code -> generic OpenBoxSigningError carrying (reason_code)."
    - "CORE ENVELOPE (openbox-core pkg/httpx/response.go:13-29 body{code,message,data}; Abort -> {code,message}): every non-2xx /evaluate is {\"code\":N,\"message\":\"...\"}. code is an INT echo of HTTP status, NOT a reason code."
    - "CORE SIGNATURE PATH (internal/api/governance.go:57-62): all identity failures -> 401 \"invalid token or agent identity\" (or 500 \"internal server error\" for verifier/replay-cache unavailable). Reason codes are slog fields in internal/services/agent.go only; never in the body. governance.go:64-65 comment confirms this is intentional (no probing accepted values via 400 vs 401)."
    - "CORE EVENT-TYPE REJECT (governance.go:66-68, isValidGovernanceEventType :273-294): un-accept-listed event_type -> 400 {\"code\":400,\"message\":\"invalid event_type: <value>\"}, only AFTER auth passes. Accept-list now includes the dev types SessionStarted/PromptSubmitted/ToolCall/ToolResult/SessionEnded/CommitCreated/Deploy (EXT-core target)."
    - "RUNBOOK cross-check: §3.2 documents signing_required=false + the local no-KMS-verifier note; troubleshooting table maps /evaluate 401 -> 'signing_required=true with no KMS verifier — set it false (§3.2)'. Guidance strings cite §3.2 accordingly."
acceptance_criteria:
  - id: "AC1 (non-2xx -> mapped actionable diagnostic)"
    status: "met"
    evidence: "diagnose() maps present fields for stock core (401 identity / missing-auth, 400 invalid event_type with the RUNBOOK/EXT-core guidance, 500 transient) and the six SDK codes via the forward-compat probe. describeDrop appends it to Emit's drop log."
  - id: "AC2 (all reason codes mapped; unknown -> raw code + status, no crash/guess)"
    status: "met"
    evidence: "signingReasonGuidance has all six codes; unrecognized reason -> 'reason=<code> (status N): unrecognized reason code — re-confirm the core error envelope (EXT-core)'. TestDiagnose_ForwardCompatReasonCodes + unknown-reason assertion."
  - id: "AC3 (logger/stderr only; no stdout; no secret)"
    status: "met"
    evidence: "Diagnostic is emitted only via c.log.Printf (the injected Logger; stderr on the CLI/hook path). diagnose derives output from static guidance + core's own status/message + a core-supplied reason code — never our key/seed/nonce/signature. TestEmit_MapsRejection_FailOpenAndLogSafe asserts no testAPIKey/testSeedB64 substring."
  - id: "AC4 (Emit unchanged: fail-open + retry classification)"
    status: "met"
    evidence: "Emit still returns (VerdictUnknown, nil) on drop; attempt/post untouched (retry classification 5xx/429 retryable, 4xx terminal unchanged). Existing fail-open/retry tests still green; new integration test re-asserts (VerdictUnknown, nil)."
  - id: "AC5 (bounded body read)"
    status: "met"
    evidence: "Reuses the existing 1 MiB io.LimitReader cap in attempt; per-line maxDiagMsg=200 trim on echoed message. TestDiagnose_BoundedMessage feeds a 10k message and asserts the line stays bounded + truncated."
