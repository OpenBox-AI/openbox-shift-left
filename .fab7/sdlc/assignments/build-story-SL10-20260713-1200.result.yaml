  created_or_updated:
    - "client/signingerr.go (signingReasonGuidance six-code map + coreError envelope + diagnose(status,body) + extractReason forward-compat probe + describeDrop; INV-1/2/3)"
    - "client/signingerr_test.go (forward-compat reason-code table, stock-core status/message mapping, bounded-message, extractReason int/non-object, and full Emit fail-open + one-line + log-safety integration table)"
    - "client/client.go (Emit terminal-drop log now calls describeDrop(err) — one-line hook; httpError already carried status+body from SL-3, so attempt/post unchanged)"
    - ".fab7/sdlc/status.yaml (STORY-SL-10 status_reason -> built + validated; awaiting G3_REVIEW)"
  proposed_only: []
