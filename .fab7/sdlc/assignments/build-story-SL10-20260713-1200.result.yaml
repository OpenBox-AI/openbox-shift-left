assignment_id: "build-story-SL10-20260713-1200"
role: "build_engineer"
story: "STORY-SL-10"
status: "completed"
summary: >
  Built STORY-SL-10 (signing / response error diagnostics — reason-code mapping): the OpenBox
  client now turns a silent fail-open drop on a non-2xx /evaluate into a single actionable
  diagnostic line. Ports the reference SDK's map_signing_error (openbox-temporal-sdk-python/
  openbox/errors.py) six-code map into Go and wires it into Emit's terminal-drop log. STAYS
  fail-open (INV-3): Emit still returns (VerdictUnknown, nil) on every transport/4xx/5xx path;
  no control-flow change, no stdout, no retry-classification change. Metadata/categories only
  (INV-1/INV-2) — secrets are never in scope of the diagnostic. Validation green: client
  go build/vet/test all pass; gofmt clean. One human gate remains: G3_REVIEW (brian).
stop_condition_triggered: true
key_design_decision: >
  The story assumed core returns the machine reason code as a body field (reason/error/code).
  Cross-repo Explore of openbox-core DISPROVED this for stock core: the reason codes
  (signature_invalid, nonce_replayed, did_agent_mismatch, verifier_not_configured,
  timestamp_outside_window/skew) live ONLY as server-side slog fields in
  internal/services/agent.go and NEVER cross the HTTP boundary. The /evaluate handler collapses
  every identity failure into 401 {"code":401,"message":"invalid token or agent identity"} and
  returns 400 {"code":400,"message":"invalid event_type: X"} for un-accept-listed dev types, via
  the uniform envelope pkg/httpx/response.go body{code,message,data} (code is an INTEGER echo of
  the HTTP status, not a reason). Per the story stop condition (do NOT guess a schema), the build:
  (1) maps on the fields that ARE present for stock core — status + message — including the real,
  present, mappable "invalid event_type" 400 (the expected pre-EXT-core state) and the two 401
  variants (identity rejected / missing authorization) and the transient 500; and (2) keeps the
  full SDK six-code map behind a FORWARD-COMPATIBLE body probe (extractReason) that mirrors the
  SDK's config.py _extract_reason_code key order (reason_code -> code -> string only), so the map
  lights up automatically if EXT-core later enriches the envelope, without pretending stock core
  does so today. Note routed to re-confirm the envelope key at EXT-core.
