story: STORY-E7-S1
title: "shift-left MIRROR of the base SDK hook-span contract: shell/mcp/tool HookType + family root fields + AssertHookWireShape (Go)"
epic: E7
built_at: "2026-07-14"
repo: "openbox-shift-left (this repo — client/ module). openbox-sdk-python is a READ-ONLY reference, NOT edited."
status: done  # built + independently reviewed (APPROVE) + brian-directed (mirror + push); committed to shift-left main

summary: >
  Add first-class developer-runtime tool-call hook types (shell / mcp / tool) so a coding-agent
  tool call is a first-class hook span instead of Core's `internal` fallback. Grounded in
  ADR-0004 sub-decision #1 + the S8 spike (E7-S0 GO) + migration doc §2/§3.

pivot:
  decision: "brian 2026-07-14 — do NOT edit openbox-sdk-python; mirror the contract into shift-left only. The openbox-core classifier edit (E7-S2) still proceeds ('only sdk-python is off-limits')."
  what_happened: >
    E7-S1 was first built as an UPSTREAM edit to openbox-sdk-python (openbox_core enum + family fields
    + assert_hook_wire_shape), reviewed (G3 APPROVE + G_SEC PASS-WITH-CONDITIONS, SEC-1 fixed) and
    committed locally as c3aa8c7. Its push was DENIED (session key brianthebox is not a collaborator on
    OpenBox-AI/openbox-sdk-python — see memory sibling-repo-push-access). brian then ruled sdk-python
    off-limits, so c3aa8c7 was REVERTED (git reset --hard origin/main + branch delete; sdk-python fully
    untouched) and the same signed contract SHAPE was re-expressed as a shift-left-owned Go mirror.
    ADR-0004 got an Amendment 2026-07-14 recording this. This is the SDK half moving to B-shiftleft/mirror;
    E7-S2 (Core) unaffected.

deliverable:
  - "client/hookspan.go — Go mirror of the base SDK hook-span wire contract:"
  - "  HookType: file_operation / shell / mcp / tool (the families the dev runtime emits)."
  - "  CommonRootFields (14) + FamilyRootFields (shell=[shell_command,shell_exit_code]; mcp=[mcp_server,mcp_tool,mcp_method]; tool=[tool_name]; file_operation=[file_path,file_mode,file_operation,bytes_read,bytes_written])."
  - "  DefaultKind / KindFor (file/shell/tool->INTERNAL, mcp->CLIENT, unmapped->INTERNAL)."
  - "  AssertHookWireShape(payload map[string]any) error — the Go port of fake_core.assert_hook_wire_shape."
  - "client/hookspan_test.go — mirror-drift guard + conformance over families x stages + JSON round-trip + 15-case rejection table."

reference_fidelity: >
  Kept byte-faithful (by discipline + doc-comment file:line citations + TestFamilyRootFieldsMirror) to
  openbox-sdk-python/openbox_core/contracts/otel_spans.py (HookType, _ROOT_FIELDS_BY_HOOK_TYPE,
  _DEFAULT_KIND_BY_HOOK) and openbox_core/conformance/fake_core.py (_COMMON_ROOT_FIELDS,
  _FAMILY_ROOT_FIELDS, assert_hook_wire_shape). Base http_request/db_query/function_call/llm_call
  families are intentionally NOT mirrored (the developer runtime does not emit them; an unmirrored
  hook_type is simply not family-checked, matching the base SDK's `.get(hook_type, ())` fall-through).

scope_split:
  E7-S1: "contract + conformance assertion (this story)."
  E7-S3: "flat-SpanData BUILDER (16-hex span_id, 32-hex trace_id, parent linkage, started/completed staging) producing payloads that PASS AssertHookWireShape."
  E7-S4: "event->wire mapping; OWNS shell_command content-gating + max_body_size truncation on the content-capture path (prior G_SEC SEC-1 carried here)."
  E7-S2: "openbox-core ComputeSemanticTypeFromSpan classifies shell->shell_command / mcp->mcp_tool_call (sibling edit, still on)."

validation:
  command: "cd client && go build ./... && go vet ./... && go test -race ./..."
  result: "GREEN (client module; new hookspan tests + full existing suite)."

reviews:
  G3_REVIEW:
    contract_shape: "brian sign-off 2026-07-14 on the shell/mcp/tool SHAPE (on the since-reverted sdk-python build) — the shape is unchanged in the Go mirror."
    mirror_code:
      reviewer: "review_auditor (independent, blind)"
      decision: "APPROVE — no must-fix"
      evidence: >
        Faithful re-expression: every assert_hook_wire_shape invariant preserved in the same order
        (bool-true hook_trigger, span_count, no otel/openbox/data/semantic_type, 14 common fields,
        16/32-hex ids, stage enum, family fields, started-null end_time/duration_ns). Family tuples +
        kinds correct. Map checks panic-safe (comma-ok everywhere; present-but-null treated as present,
        verified by the JSON round-trip); toInt covers float64+int. All 15 rejection mutations trip the
        intended check. go build/vet/test -race pass.
      low_observations:
        - "L1: Go gate is weaker than fake_core for NON-mirrored hook types (http/db/function omitted by design) — a future http_request span missing family fields would pass the local gate but not real Core. Intentional/documented (dev runtime emits only the 4 families); tracked under ADR-0004/S8."
        - "L2: TestFamilyRootFieldsMirror guards intra-repo edits, not upstream drift (no import/codegen link to the read-only base SDK) — inherent to a hand-maintained mirror."
        - "L3 (cosmetic): spans must be []any (a []map[string]any would misreport) — emitter+tests use []any; no practical impact."
  G_SEC:
    decision: "n/a for this story's diff"
    rationale: >
      This file DEFINES the contract + a conformance assertion; it emits nothing (no egress/content sink).
      The security-relevant decision — shell_command content-gating + max_body_size truncation on the
      opt-in content-capture path (prior G_SEC SEC-1 from the sdk-python build) — lands in the E7-S4
      emitter and is carried there.

