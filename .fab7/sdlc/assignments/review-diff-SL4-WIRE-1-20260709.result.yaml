overall: >
  Module split is correct and the acceptance criteria hold. The Claude Code adapter genuinely
  implements the shared provider.Installer (Name() returns provider.ClaudeCode, compiler accepts
  claudecode.Installer{} where provider.Installer is required); no import cycle (provider/ imports
  nothing repo-local, composition root sits in cli/internal/providers); go.mod require/replace graph
  resolves with no go.work; no dangling refs to the deleted cli/internal/provider. INV-1 upheld —
  CredentialRef is coordinates-only (the type alias to the shared superset adds only non-secret
  posture fields). All three modules build + test green under -race. The claude-code→codex swaps in
  the CLI tests are legitimate (claude-code's old exit-2 stub behavior was intentionally removed and
  is replaced by the real-install test), not masking a regression.
findings:
  - id: "F1"
    severity: "LOW (robustness)"
    class: "CONFIRMED"
    disposition: "FIXED"
    title: "provider.Stub panics on nil Manual func"
    detail: "Stub is exported; Stub{ProviderName: X}.Plan(ref) with Manual unset would nil-panic on the --dry-run/manual path (not triggered today — registry sets Manual for codex/cursor). Fix: Plan falls back to a generic provider-named message when Manual==nil. Test: TestStubPlanFallsBackWhenManualIsNil."
  - id: "F2"
    severity: "LOW (coverage)"
    class: "CONFIRMED"
    disposition: "FIXED"
    title: "no test exercised claude-code re-init idempotency or --dry-run write-freeness"
    detail: "AC3 claims both; idempotency rested on overwrite semantics and dry-run purity on Plan() doing no I/O (both sound by inspection). Fix: added TestInstaller_ReInstallIsByteIdentical (bundle+config byte-identical across two installs) and TestClaudeCodeDryRunWritesNothing (real installer plan rendered, HOME/OPENBOX_CONFIG redirected, no bundle dir / no config written)."
verified_correct_no_finding:
  - "AC1: provider/ is its own zero-dep module; ADR-0001 records the home with a genuine import-cycle rationale + 4 rejected alternatives."
  - "AC2: registry binds claude-code→real installer (Available()==true), codex/cursor→Stub (false)."
  - "AC3: TestClaudeCodeInstallsForRealExitsZero drives the full CLI run to exit 0 + bundle/config materialized; dry-run routes to Plan() (pure strings.Builder)."
  - "AC4/INV-1: no secret field exists on CredentialRef; secrets sink only to the store; assertNoSecretInTree walks the whole bundle."
  - "INV-7: reg.DID passed verbatim; Name constants unchanged; namespace not forked."
