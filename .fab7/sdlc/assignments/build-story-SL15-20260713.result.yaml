validation:
  commands:
    - "cd actions/openbox-git-action && go build ./... && go vet ./... && go test -race ./...  # green; 36 verifier subtests"
    - "cd client && go build ./... && go vet ./... && go test ./...  # green; baseline unchanged"
  real_binary: "dry-run (flag off) resolves `inferred`, verified_session_ids=[] — byte-identical to pre-SL-15."
  live_e2e:
    when: "2026-07-13, running hybrid stack (backend :3000 + core :8086 + workers + dashboard :3233), org openbox.ai"
    agent: "real registered agent 4444083d-c2ff-4299-91f3-2dc98e969977 / DID did:aip:966d7dd4-... (signing_required=f)"
    owned_case: "commit trailing OWNED run_id 606a02c8-... -> status=attributed, emitted=true; stored Deploy metadata verified_session_ids=['606a02c8-...'], sessions[0].verified=true source=trailer."
    forged_case: "commit trailing dash-demo-788d69c4-... (a real session owned by a DIFFERENT agent) -> status=inferred, emitted=true; verified_session_ids=[], verified=false reason='unverified claim (not bound to the authenticated pusher)'. SL5-SEC-1 discharged for real."
    inv4_bind: "python uuid5(aipNamespace, '4444083d-...') == did:aip:966d7dd4-... (the DB DID) — DIDForAgent verified byte-for-byte vs the real registered agent."
    observability: "both Deploy events in core governance_events + the openbox.ai governance-feed (agent_name openbox-dev-claude-code-brian@brian-ubuntu, verdict 0). A Deploy creates NO sessions row (single event, not a session lifecycle) -> observe in the dashboard GOVERNANCE FEED, not the agent session list."
  live_caught_fix:
    finding: "The backend wraps every 2xx in a global {status, data:<payload>} envelope around SessionListResponseDto {data:[...]}, so session rows are at data.data[], NOT top-level data[] (the discovery Explore described the DTO, not the wire envelope)."
    impact: "The first build parsed top-level data[] -> would have found zero rows -> never attributed even an owned session. The mock tests had encoded the same wrong assumption, so unit tests passed falsely; only the live run exposed it."
    fix: "verifier.go parses env.Data.Data ([].run_id/agent_id); mock bodies corrected to the real wire shape; TestAPIVerifier_ParsesRealBackendEnvelope pins a verbatim captured response; README/doc.go updated. Rebuilt: build/vet/test -race green."
