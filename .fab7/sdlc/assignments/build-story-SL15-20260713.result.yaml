assignment_id: "build-story-SL15-20260713"
role: "build_engineer"
story: "STORY-SL-15"
status: "completed"
summary: >
  Built STORY-SL-15 — the real OwnershipVerifier that promotes a commit-trailer session
  claim to a proven deploy attribution (SL5-SEC-1 discharged for real). apiVerifier
  (actions/openbox-git-action/verifier.go) reads openbox-backend's EXISTING, org-scoped
  endpoint GET /agent/<agentID>/sessions?search=<sessionID> with an org X-API-Key and
  promotes a claim to `attributed` ONLY when a returned session's run_id equals the trailer
  value AND the row's agent_id equals the queried agent. Every fault (transport error,
  non-2xx incl. 401/403/404/5xx, malformed/wrong-shape body, timeout, no matching row,
  redirect) fails CLOSED — the claim is never promoted, so the worst case is honest
  under-attribution (`inferred`), never a silent wrong `attributed` (INV-6). OFF by default
  (NoopVerifier); OPENBOX_OWNERSHIP_VERIFY=1 opts in. The deploy agent's UUID is supplied
  directly (OPENBOX_AGENT_ID) and bound to OPENBOX_DID via a from-scratch, reference-vector-
  tested uuidv5 at startup, so the read can only ever see the deploy principal's own sessions
  (INV-4). No resolver change — owned ids simply become Verified. Validation green: git-action
  build/vet/test -race all pass (36 verifier subtests); client module UNCHANGED from baseline;
  gofmt clean. Both independent reviews passed (G3 APPROVE; G_SEC APPROVE-WITH-CONDITIONS,
  the one LOW condition C1 addressed in-code). One human gate remains: brian's G3_REVIEW sign-off.
stop_condition_triggered: false
key_design_decision: >
  TWO human decisions reshaped this story mid-build; both surfaced to brian (never inferred),
  both cross-repo-verified via Explore per the user directive.
  (1) OD-OWNER-API — WHICH ENDPOINT. The story assumed an AIP-signed, DID-keyed FR-7 read and
  said to "reuse the SL-3 signer." Cross-repo Explore found FR-7 does not exist; the closest
  real endpoint (openbox-backend GET /agent/:agentId/sessions) is keyed by the agent UUID and
  authed by an org X-API-Key/JWT — which a CI deploy agent (runtime obx_ key + Ed25519 seed
  only) cannot present. I first built the assumed AIP-signed shape flag-off (reviewed: G3
  approve, G_SEC approve-with-conditions), then surfaced the conflict. brian chose "target the
  real endpoint," so the verifier was rebuilt for X-API-Key and the earlier client/ SignedGet
  addition was FULLY REVERTED (control-plane read needs no AIP signing; client/ diff is now
  empty — verifier is self-contained in the git-action write scope, stdlib-only).
  (2) DID->agentId RESOLUTION. Explore found there is NO DID->agentId lookup: an agent's DID is
  did:aip:uuidv5(agentId, namespace), a one-way hash, so the only reversal is enumerate-all-
  agents + recompute (needs read:agent + O(N) + couples to backend DID internals). Surfaced;
  brian chose "provide OPENBOX_AGENT_ID" (the agent's own UUID, known at create time). The
  verifier therefore skips resolution and instead BINDS the supplied agentId to the deploy DID
  by recomputing did:aip:uuidv5(agentId, aipNamespace)==OPENBOX_DID at construction — a
  mismatch (a wrong/foreign agentId) is rejected -> degrades to NoopVerifier. This is the
  INV-4 anchor: the read can only ever be for the same principal the deploy is attributed to.
  The uuidv5 is a from-scratch RFC-4122 v5 (SHA-1) impl pinned by a reference vector
  (v5(NS_DNS,"python.org")==886313e1-...-9e5d); G_SEC INDEPENDENTLY ran Python uuid5 against the
  real AIP namespace and confirmed DIDForAgent matches the backend byte-for-byte.
security_review:
  gate: "G_SEC"
  decision: "approve-with-conditions"
  reviewer: "Sam (security_reviewer)"
  decided_at: "2026-07-13"
  summary: >
    No BLOCKER/HIGH. Fail-closed complete across every fault path (INV-6/SL5-SEC-1); INV-4
    uuidv5 bind correct and cross-repo-verified byte-for-byte + non-bypassable; org key only in
    the X-API-Key header (never URL/log/error); untrusted trailer value url.QueryEscape'd;
    agentId UUID-validated path-safe; plaintext guard on the base URL; org-key privilege surface
    documented and scoped to the narrowest real permission (read:agent_session, not list-all);
    flag-off byte-identical. CONDITION C1 (LOW, ADDRESSED IN-CODE): the default http.Client
    followed cross-host redirects and forwarded the custom X-API-Key (Go only strips
    Authorization/Cookie) — a 302->http://evil could leak the org key past checkOwnershipBaseURL.
    FIXED: CheckRedirect=http.ErrUseLastResponse (redirect -> non-2xx -> fail-closed) +
    regression test TestAPIVerifier_DoesNotForwardKeyOnCrossHostRedirect (foreign host never
    contacted). INFORMATIONAL (empty agent_id row accepted) also tightened: per-row agent_id
    check is now unconditional.
correctness_review:
  gate: "G3_REVIEW"
  decision: "approve"
  reviewer: "review_auditor (blind)"
  decided_at: "2026-07-13"
  summary: >
    APPROVE, no must-fix. Every AC proven by tests the reviewer ran (not asserted): owned->
    attributed, forged->inferred with verified_session_ids empty, lookup error->inferred, all
    through the REAL resolver over real git against the mock backend. run_id-not-id matching,
    per-row agent_id check, uuidv5 (version/variant bits pinned by the reference vector),
    construction guards, selectVerifier (all 4 paths with the new env vars), and the
    error-not-cached per-session cache all correct; -race clean; client baseline intact. Nits
    P3-a (agent_id=="" tolerance) and P3-b (base-URL path prefix) both ADDRESSED in-code +
    tests; P3-c extra edge tests (matching-row-not-first, broadened-substring) ADDED. P2
    (namespace asserted) retired by G_SEC's byte-for-byte confirmation; remains a documented
    G1_READY enable-time live-verify note.
