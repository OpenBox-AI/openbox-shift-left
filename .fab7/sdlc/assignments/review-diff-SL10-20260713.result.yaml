verification_matrix:
  fail_open_INV3:
    verdict: PASS
    note: >
      Only change in client.go is the drop-log format string (%v->%s + describeDrop(err)).
      Control flow unchanged: Emit still returns (VerdictUnknown, nil) on every marshal/
      signing/network/non-2xx/exhausted path. Retry classification in attempt() unchanged
      (retryable = 5xx || 429; 4xx terminal). describeDrop/diagnose are pure (no I/O).
      No stdout write on any path — diagnostics go only to c.log.Printf.
  log_safety_INV1_INV2:
    verdict: PASS
    note: >
      describeDrop echoes httpError.Error() (raw body truncated to 256) + diagnose() output.
      diagnose derives solely from HTTP status, core's own response message, static guidance,
      and a core-supplied reason code. The obx_ key lives only in the Authorization header
      (never request/response body); the Ed25519 seed is never transmitted; nonce/signature/
      timestamp ride in request headers, not the response body — so none can appear in the
      echoed body. Content was already stripped pre-egress (INV-2), so core has no content to
      echo back. Test asserts testAPIKey and testSeedB64 absent from the emitted line.
  bounded_body:
    verdict: PASS
    note: >
      attempt() reads io.LimitReader(resp.Body, 1<<20) = 1 MiB cap; httpError.body bounded to
      that. httpError.Error() truncates to 256; diagnose truncates core message to maxDiagMsg=200.
      Resulting drop line is bounded (~<600 chars) regardless of a hostile/huge body. No OOM,
      no unbounded log line. TestDiagnose_BoundedMessage confirms (10k 'A' -> trimmed w/ ellipsis).
  one_diagnostic_per_drop:
    verdict: PASS
    note: >
      post() performs all retries internally and returns only the terminal error; no logging
      inside attempt()/post(). describeDrop is invoked exactly once in Emit. TestEmit asserts
      nLines == 1 (no per-retry spam).
  reason_map_correctness:
    verdict: PASS
    note: >
      All 6 SDK keys present and mapped (5 codes + timestamp_skew alias) — exact set from
      errors.py _SIGNING_REASON_MESSAGES. Unrecognized reason -> "reason=<code> (status N):
      unrecognized reason code" (raw code + status, no crash, no guess). extractReason probes
      reason_code->code->reason (matches config.py:248 actual order) and accepts STRING values
      only, so stock core's integer `code` is not misread (TestExtractReason confirms).
  stop_condition:
    verdict: PASS
    note: >
      Cross-repo facts spot-checked against ../openbox-core and confirmed: identity/signature
      failures collapse to 401 {"code":401,"message":"invalid token or agent identity"}
      (governance.go:61); un-accept-listed dev types -> 400 "invalid event_type: <type>"
      (governance.go:67); envelope is httpx body{code,message,data} (pkg/httpx/response.go:14-16),
      `code` is an int status echo with no machine reason field. diagnose() correctly (a) maps on
      status+message for stock core (message substrings verified verbatim) and (b) keeps the SDK
      reason map behind the forward-compat extractReason probe rather than guessing a schema.

