findings:
  blockers: []
  must_fix: []
  should_fix:
    - id: SL10-SHOULD-1
      title: "extractReason diverges from the SDK's or-chain short-circuit on a truthy non-string `code`"
      severity: should-fix
      where: client/signingerr.go:104-120 (extractReason) vs config.py:248
      detail: >
        The SDK is `data.get("reason_code") or data.get("code") or data.get("reason")` then
        isinstance-str. Python `or` returns the FIRST truthy operand: given a body
        {"code": <int>, "reason": "<string>"} it stops at the truthy int `code`, then the
        isinstance(str) check yields None — the SDK does NOT fall through to `reason`. The Go
        loop instead continues past the non-string `code` and returns the `reason` string. So
        for that (hypothetical, combined) body Go extracts a reason the SDK would not.
      failure_scenario: >
        A future EXT-core that emits {"code":401,"reason":"signature_invalid"} would produce a
        mapped guidance line in shift-left but a generic error in the Python SDK — divergent
        parity, only for a schema stock core does not emit today.
      impact: >
        Low. Go's behavior is arguably the more useful of the two, and the primary requirement
        (respect key order; accept strings only; never misread stock core's integer code) is met
        — extractReason returns "" for every real stock-core body. Recommend either matching the
        SDK short-circuit exactly or adding a one-line comment that the divergence is intentional,
        so the "mirrors config.py" claim in the file header is precise.
  nits:
    - id: SL10-NIT-1
      title: "coreError.Code parsed but unused in diagnose"
      where: client/signingerr.go:39-42, 69-70
      detail: >
        diagnose only reads ce.Message; ce.Code is never consulted (status is passed in
        separately). Harmless; the field documents the envelope. Could drop it or add a comment.
    - id: SL10-NIT-2
      title: "Drop line carries both raw body and interpreted diagnosis"
      where: client/signingerr.go:131 (describeDrop)
      detail: >
        describeDrop = httpError.Error() (raw body truncated 256) + " — " + diagnose(...). The
        raw core body and the mapped guidance both appear. Bounded and arguably useful for
        debugging; noted only as slight redundancy, not a defect.

human_gate:
  G3_REVIEW:
    question: "Is the reason map correct and the fail-open contract preserved?"
    recommendation: approve
    rationale: >
      All five acceptance criteria met; INV-1/2/3 preserved (verified against source, not the
      builder's narrative); build+vet+test green (re-run by reviewer); cross-repo stop-condition
      facts independently confirmed against openbox-core. Remaining findings are a should-fix
      parity nuance on a forward-compat probe for a schema stock core does not yet emit, plus two
      cosmetic nits — none block. Human owner (brian) still records the G3 decision.

