  sidecar: "go build/test -race ./... — GREEN"
  cli: "go build/vet/test ./... — GREEN"
  live_e2e: >
    Built the real `openbox` binary + ran `openbox sidecar serve` (bundle: shell rm-rf→block,
    mcp→require_approval) over a Unix socket, drove the unified `openbox hook claude-code PreToolUse`:
    (1) github MCP (enforce ON) → ask with content-free reason "OpenBox governance: external
    repository mutation requires approval (policy: mcp-approval-1)" [approval_id absent — local bundle
    mints none, omitempty verified]; (2) rm -rf (enforce ON) → deny (unchanged); (3) echo hi (enforce
    ON) → nothing to stdout (proceed); (4) github MCP (enforce OFF) → nothing to stdout
    (byte-identical to observe). enforcements.jsonl content-free (no MCP title 'secret-project-x', no
    'rm -rf', no 'echo hi'); ask line records verdict=REQUIRE_APPROVAL/applied_decision=ask/policy_id.
reviews:
  G3_review_auditor:
    verdict: "APPROVE"
    notes: >
      Cascade byte-for-byte unchanged + `ask` literal preserved; approvalReason correct (fallback +
      no dangling fragment); tighten-only + fail-open intact; audit approval_id wired + omitempty;
      tests non-vacuous; no stop-condition violated. OBS-1 (cosmetic): TestApprovalReason has no
      in-function negative-content assertion — but approvalReason takes only client.Evaluation
      (structurally cannot see tool content) and the negative is proven where content exists
      (TestRecordEnforcement_ApprovalID + TestRunHook_EnforceApply_Approval). No fix required.
  G_SEC_security_reviewer:
    verdict: "APPROVE"
    notes: >
      INV-2: approval_id is a server correlation id parsed off the wire approval_id field only
      (verdict.go:148/202), same content-free class as policy_id — cannot carry tool content; audit
      records it id-only omitempty; tests assert tool input never appears. INV-1: no secret on the
      path (approval id is a public correlation id, not a credential). INV-3b: synchronous /
      pre-execution / bounded / tighten-only preserved; no poll/wait/unbounded path; fail-open intact.
      Stop conditions clear (no poll_approval/pending_approval/expiry ported; no new egress). No
      prompt-JSON injection — reason is JSON-encoded by applyDecision's json.Marshal, ids/reason
      cannot break out of permissionDecisionReason or inject sibling keys. INFO-1 (pre-existing, not
      widened): server-authored reason text is shown verbatim — identical trust posture to E6-S2's
      govReason; a compromised core is already the governance authority. No blocker.
