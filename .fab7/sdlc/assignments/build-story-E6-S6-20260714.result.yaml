summary: >
  Built STORY-E6-S6 — REQUIRE_APPROVAL → CC `ask` (interactive local HITL prompt). The
  REQUIRE_APPROVAL→ask MAPPING already shipped in E6-S2; E6-S6 is the faithful HITL reason+audit
  refinement layered on it (NOT new control flow), because Claude Code's `ask` permissionDecision IS
  the interactive local prompt — the developer resolves allow/deny synchronously on this machine, so
  the entire reference-SDK poll/expiry/retry apparatus collapses into CC's native `ask` UI and the
  hook's ONLY lever is the reason string. Two surgical changes: (1) a dedicated approvalReason(e)
  (replacing the generic govReason fallback on the REQUIRE_APPROVAL branch of mapVerdict) that
  surfaces the full CONTENT-FREE approval context — the policy-authored reason (generic fallback when
  absent), policy_id, and approval_id (the one approval-specific field on the evaluate response, SDK
  types.py:142) — so an approver/auditor can tie the prompt to the governance approval record; (2)
  approval_id added to the durable enforcements.jsonl audit (enforcementRecord.ApprovalID, omitempty).
  The rest of the SDK cascade (HALT/BLOCK/guardrail-fail→deny; CONSTRAIN/ALLOW/UNKNOWN→proceed) is
  BYTE-FOR-BYTE unchanged; the emitted permissionDecision for ask is still exactly "ask"; tighten-only
  and fail-open preserved. NO server-side /approval polling (OD-HITL), NO new config/env, NO
  sidecar/core/backend surface (approval_id already arrives on the parsed client.Evaluation).
scope_boundary_confirmed_by_recon: >
  Per the user directive ("always use explore for cross-repo reference"), a read-only Explore of
  openbox-temporal-sdk-python recovered the reference HITL/approval path this story maps onto CC.
  Findings: (1) verdict_handler.enforce_verdict RETURNS VerdictEnforcementResult(requires_hitl=True)
  for REQUIRE_APPROVAL (verdict_handler.py:92-94) — it does not raise; the caller
  (activity_interceptor.py:414-420) sets buffer.pending_approval=True and raises a RETRYABLE
  ApplicationError(type="ApprovalPending") (hitl.py:114-125). (2) The OUTCOME is obtained by POLLING
  POST /api/v1/governance/approval on each Temporal retry (client.poll_approval, client.py:150-198);
  handle_approval_response (hitl.py:46-111) maps it to approved (Verdict.ALLOW→True) / rejected
  (should_stop()→ApprovalRejected) / expired (approval_expiration_time→ApprovalExpired) /
  still-pending (retry). Timeout is server-driven. (3) The reference flow is fundamentally ASYNC +
  SERVER-SIDE — OD-HITL DELIBERATELY REJECTS it for the dev hot path ("too heavy"); CC's `ask`
  resolves synchronously, so E6-S6 ports NONE of the poll/expiry/retry apparatus. (4) The ONLY
  approval-specific field the SDK reads off the EVALUATE response is approval_id
  (GovernanceVerdictResponse.approval_id, types.py:142, parsed :186) — a server correlation id (same
  class as policy_id / governance_event_id), NOT content. openbox-shift-left/client/verdict.go
  already parses it into Evaluation.ApprovalID but the adapter DROPPED it — E6-S6 surfaces it. There
  is NO approver/approval_url/approvers/expiry field on the verdict response; the SDK never consumes
  one, so E6-S6 surfaces exactly what exists. approval_id is server-minted (core registers the
  approval record); a LOCAL rule bundle mints none, so E6-S6 surfaces it OPPORTUNISTICALLY (omitempty)
  — the local-sidecar path omits it, the field is meaningful when a decision carries one.
