  - "adapters/claude-code/enforce_test.go — TestMapVerdict new REQUIRE_APPROVAL-surfaces-approval-id case; TestApprovalReason (surfaces reason/policy_id/approval_id; generic fallback; no dangling (approval: ) fragment); TestRecordEnforcement_ApprovalID (injected ApprovalID → ask reason + audit carry it, content-free); TestRunHook_EnforceApply_Approval (live sidecar: MCP→ask content-free reason, audit records ask, enforce-off byte-identical)."
  - ".fab7/sdlc/stories/STORY-E6-S6.md — worker-ready story contract."
