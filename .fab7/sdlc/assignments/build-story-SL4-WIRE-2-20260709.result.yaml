assignment_id: "build-story-SL4-WIRE-2-20260709"
role: "build_engineer"
story: "STORY-SL4-WIRE-2"
status: "review"
summary: "Folded the Claude Code hook engine into the unified `openbox hook claude-code <event>` subcommand; retired cmd/openbox-cc-hook to a thin alias; plugin + installer reference bin/openbox; observe-only contract re-verified on the multi-command binary."
overall: >
  One engine, two entrypoints. The observe-only path moved into claudecode.RunHook (writes nothing to
  stdout, swallows every failure incl. panics). The CLI gained `openbox hook <provider> <event>`
  (runHook returns exitOK unconditionally and routes before any stdout write). cmd/openbox-cc-hook is
  now a thin alias over RunHook (backward-compat). hooks.json invokes ${CLAUDE_PLUGIN_ROOT}/bin/openbox
  hook claude-code <event>; the installer copies the running engine into bin/openbox (EngineBinary,
  atomic). INV-3 re-verified on the REAL built binary.
acceptance_criteria:
  - id: "AC1 openbox hook <provider> <event> runs the observe/flush path; cmd retired-to-alias"
    met: true
    evidence: "cli runHook → claudecode.RunHook; cmd/openbox-cc-hook is a thin alias; both share one engine."
  - id: "AC2 observe-only contract survives on the multi-command binary (exit 0, empty stdout)"
    met: true
    evidence: "TestUnifiedBinaryHookObserveOnlyContract (real binary) + TestHookIsObserveOnlyInProcess + TestHookMisuseIsSafe; real-binary manual re-confirm."
  - id: "AC3 hooks.json + installer reference bin/openbox; dev init places that binary"
    met: true
    evidence: "hooks.json → `${CLAUDE_PLUGIN_ROOT}/bin/openbox hook claude-code <event>`; Installer.EngineBinary copy (TestInstaller_PlacesEngineBinary / _SkipsEngineBinaryWhenUnset); providers.Lookup sets os.Executable()."
  - id: "AC4 end-to-end smoke (register→install→5 hooks→flush→mock /evaluate)"
    met: partial
    evidence: "TestHookEndToEndSmoke drives all 5 hooks via the subcommand → SessionEnd flush → mock /evaluate received + spool drained. Register+install legs covered by SL-2/WIRE-1 tests; not re-driven in one monolithic test."
findings: []
