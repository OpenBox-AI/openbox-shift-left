    - command: "cd cli && go vet ./... && go test -race ./..."
      result: "pass"
      evidence: "all packages green incl. hook observe-only + end-to-end smoke; gofmt clean"
    - command: "built openbox; printf <PreToolUse payload> | openbox hook claude-code PreToolUse"
      result: "pass"
      evidence: "exit 0, 0 stdout bytes, 1 spool file, no tool_input content leaked"
    - command: "openbox dev init --provider claude-code --dry-run"
      result: "pass"
      evidence: "plan advertises `bin/openbox hook claude-code <event>` + engine placement into bin/openbox"
  not_run:
