summary: >
  Built STORY-E6-S7 — the enforcement CONFORMANCE suite (executable INV-3b evidence) + the
  reconciliation of the E6-S3 G_SEC INFO-1 "sidecar up but UNBUNDLED" quadrant. Two parts.
  PART A (conformance): a new adapter test TestEnforcementConformance drives the REAL RunHook
  PreToolUse path end-to-end against a REAL sidecar.Server (or an absent socket) across eight
  quadrants C1-C8 and asserts the exact Claude Code stdout contract per quadrant — enforced BLOCK
  denies pre-execution (C1); fail-open + outage/unbundled/slow-timeout proceeds within the bound
  (C2/C3/C8, OD9); fail-closed + outage denies (C4); fail-closed never denies a REAL allow (C5, the
  crux); observe mode never blocks even for a BLOCK-worthy tool (C7, INV-3 verbatim); and the
  INFO-1 quadrant fail-closed + unbundled denies (C6). This is the durable evidence ADR-0002 /
  INV-3b holds — a regression breaks HERE.
  PART B (INFO-1 reconciliation): previously a reachable-but-UNBUNDLED daemon returned a well-formed
  Source="fail-open:no-bundle" reply that the client marked Decision.FailOpen=false, so
  applyFailurePolicy treated it as a real verdict and a fail-closed org was SILENTLY UNGOVERNED
  while the daemon was up but unbundled (a plausible LIVE state — core ships no real OPA bundle yet,
  [EXT-opa-bundle]). The fix makes Decision.FailOpen mean exactly what its doc always claimed ("no
  real daemon verdict"): (1) the server returns client.VerdictUnknown (honest: "not evaluated"), not
  VerdictAllow, on every no-real-verdict path (cold start / eval==nil, bad protocol, missing
  session); (2) the client sets FailOpen = !isRealVerdictSource(resp.Source), where the ONLY
  real-verdict source is sourceLocalBundle (the server tags EVERY resident-evaluator decision —
  rule bundle today, embedded-OPA later per ADR-0003 — sourceLocalBundle). So a fail-closed org now
  denies whenever OpenBox obtained NO real verdict, however that happened; the fail-OPEN default is
  behaviorally unchanged (it ignores the flag). The verdict cascade
  (mapVerdict/applyDecision/applyFailurePolicy LOGIC) is UNTOUCHED — the reconciliation is entirely
  upstream, in how FailOpen is set. Also folded in the E6-S4 G_SEC INFO-2 cheap hardening (a
  size-guard on the jsonEqual double-parse) since it lives in the same file.
  Validation GREEN (adapter/sidecar/cli build/vet/test -race) + live E2E vs the real openbox binary
  + `openbox sidecar serve` across all four live quadrants + a load-bearing check (C6 fails without
  the client FailOpen mapping).

scope_boundary_confirmed_by_recon: >
  Per the user directive ("always use explore for cross-repo reference"), a read-only Explore of
  openbox-temporal-sdk-python answered the load-bearing design question: how does the reference
  treat a REACHABLE-but-no-authoritative-verdict evaluation (as opposed to an API error)? Finding
  (decisive): the reference has NO such state. evaluate has exactly three outcomes (client.py:110-148)
  — a parsed verdict, None (fail-open/proceed), or a synthesized Verdict.HALT. _handle_api_error
  (client.py:204-208) synthesizes the fail-closed HALT ONLY on a raised exception or HTTP>=400
  (call sites client.py:118-121, 145-148). A successful-but-empty 200 -> ALLOW (types.py:39-54
  from_string defaults everything to ALLOW; there is NO VerdictUnknown in the SDK). An unparseable
  200 body -> None -> PROCEEDS even under fail-closed (client.py:140-143). So the reference would
  LET AN UNBUNDLED-BUT-REACHABLE EVALUATION PROCEED. E6-S7 DELIBERATELY DEVIATES, for two grounded
  reasons: (1) the SDK's evaluation endpoint (core) always has policy resident (rego in Postgres) —
  "reachable-but-unbundled" cannot occur there; the shift-left LOCAL sidecar genuinely can be
  up-but-unbundled ([EXT-opa-bundle]), a state with no reference analog. (2) E6-S3 ALREADY shipped
  the deviation on the adjacent axis: a malformed/unusable reply already yields FailOpen=true -> a
  fail-closed org denies (allowFailOpen("sidecar response malformed"), more conservative than the
  SDK's proceed-on-unparseable-200). The unbundled case is the SAME class ("reachable, no usable
  verdict") and was missed only because the server returns a WELL-FORMED no-bundle reply. Closing it
  makes E6-S3's fail-closed posture internally consistent — "block whenever no real verdict was
  obtained, however that happened" — which is the coherent meaning of a fail-closed opt-in ("block
  when you cannot govern"). The deviation is documented in code (sidecar/client.go Decision.FailOpen
  doc + enforce.go applyFailurePolicy note) and surfaced for brian's G3.

what_changed:
  - "sidecar/server.go — Server.decide returns client.VerdictUnknown (not VerdictAllow) on the
    three no-real-verdict paths (unsupported protocol, missing session id, cold-start eval==nil);
    Source unchanged (sourceFailOpenNoBundle). Refreshed the cold-start comment to explain the
    block decision belongs to the client-side failure policy, not this fail-open primitive. The
    handleConn malformed-request path already returns the zero-value Evaluation (VerdictUnknown='')
    so it was already honest."
  - "sidecar/client.go — new isRealVerdictSource(source) (true ONLY for sourceLocalBundle, the tag
    the server sets for ANY resident evaluator); Decide's success-parse branch now sets
    Decision.FailOpen = !isRealVerdictSource(resp.Source) so a well-formed no-verdict reply
    (sourceFailOpenNoBundle) — or an unknown/empty source from a stale/foreign peer — is FailOpen
    (the safe direction). Expanded the Decision.FailOpen doc to state both no-verdict causes
    (client-unreachable AND server-degrade) and the deliberate SDK deviation. allowFailOpen (the
    client's own fault path) is unchanged."
  - "adapters/claude-code/enforce_conformance_test.go — NEW. TestEnforcementConformance runs C1-C8
    against a real sidecar.Server (blockRuleBundle / nil-unbundled / allow-default) or an absent
    socket, plus a slowEvaluator + serveSidecarEval helper for the timeout case. Each case asserts
    the exact stdout (deny+reason / empty) and a wall-clock bound where relevant; assertNoLeak
    guards INV-2 on every deny path."
  - "sidecar/server_client_test.go — TestColdStart_FailOpenNoBundle updated to the new honest
    semantics (FailOpen=true, Source=sourceFailOpenNoBundle, Verdict=Unknown, !WouldBlock) with an
    explaining comment; new TestIsRealVerdictSource table (only sourceLocalBundle is a real verdict;
    empty/unknown -> false)."
  - "adapters/claude-code/enforce.go — jsonEqual size-guard (maxJSONCompareBytes = 256 KiB; oversized
    -> not-equal -> apply the redaction, the safe direction; E6-S4 G_SEC INFO-2) + a code note on
    the applyFailurePolicy doc that the 'no real verdict' set now includes the reachable-unbundled
    case and that this transform is UNCHANGED (the reconciliation is upstream)."

deviations_and_deferrals:
  - "DEVIATION (documented, for brian G3): fail-closed denies on a reachable-but-unbundled daemon,
    where the reference SDK would proceed. Rationale above (no reference analog + consistency with
    E6-S3's malformed-reply behavior). Security-favorable; only affects fail-closed opt-in orgs;
    fail-open default is unchanged."
  - "DEFERRED (E6-S4 G_SEC INFO-1) — constrain updatedInput to content-only fields so a compromised
    redaction engine cannot rewrite structural locators (file_path/command). Needs a redaction
    ENGINE to exist first ([EXT-guardrail-redaction] — the Phase-1 bundleEvaluator produces no
    RedactedInput). Re-flagged for the redaction-engine story; no live surface today."
  - "DEFERRED (E6-S4 G_SEC INFO-3) — fileText() under-captures MultiEdit's nested edits[].new_string
    (the INV-2-safe under-capture direction). A capture-completeness nit on a path that is inert
    until a redaction engine lands. Re-flagged for the redaction-engine story."
  - "NOT TOUCHED: mapVerdict/applyDecision/applyFailurePolicy LOGIC; any config/env/flag; the real
    signed OPA-bundle distribution ([EXT-opa-bundle]); the redaction engine ([EXT-guardrail-redaction])."

