    Built the real openbox binary; ran `openbox sidecar serve` unbundled (bundle path absent) then
    bundled (examples/policy-bundle.example.json), driving the real `openbox hook claude-code
    PreToolUse`:
    Q1 unbundled + enforce + fail_closed=1 -> DENY, reason "request denied — no governance decision
       could be obtained and this session is fail-closed" (content-free; INFO-1 CLOSED).
    Q2 unbundled + enforce + fail_closed=0 -> EMPTY stdout (fail-open unchanged).
    Q3 bundled + fail_closed=1 + `echo hi`  -> EMPTY stdout (a REAL allow PROCEEDS under fail-closed
       — the crux clause).
    Q4 bundled + fail_closed=1 + `rm -rf`   -> DENY with the REAL policy reason "recursive delete of
       a root path is blocked by policy (policy: shell.destructive.rm-rf-root)" (a real BLOCK, NOT
       the fail-closed reason — confirming fail-closed engages on no-verdict ONLY).
    Enforcement audit content-free (0 command leaks); records cleanly distinguish the quadrants:
    Q1 {verdict:HALT, would_block:true, applied:deny, source:fail-open:no-bundle, fail_open:true};
    Q2 {verdict:"", would_block:false, source:fail-open:no-bundle, fail_open:true} (now honestly a
    degrade, not a masqueraded allow); Q3 {verdict:ALLOW, source:local-bundle, fail_open:false};
    Q4 {verdict:BLOCK, applied:deny, source:local-bundle, fail_open:false, policy_id:...}.

