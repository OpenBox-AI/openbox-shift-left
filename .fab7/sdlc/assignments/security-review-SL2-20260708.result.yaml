status: "completed"
scope: "review-only (no cli/ code modified)"
summary: >
  G_SEC security review of the `openbox` CLI credential-handling paths
  (STORY-SL-2 — high risk; mints/handles agent identity credentials). Traced
  both secret values (the once-shown obx_ API key and the base64 raw 32-byte
  Ed25519 seed) end to end: backend response -> backend.Registration ->
  d.Store.Set(...) -> OS secret-store backend. The two secrets reach exactly
  three sinks (the three Store.Set calls in devinit.Run) and NO other. They are
  never printed, logged, placed on argv, written to a config file, or embedded
  in any error message. The control-plane token is read from the environment
  only (OPENBOX_CONTROL_TOKEN), never a flag, so it cannot leak via argv/ps or
  shell history. Detect() HALTs (ErrNoStore) rather than falling back to
  plaintext, including Windows. Dry-run is fully offline (no token read, no
  store detect, no network). INV-1/INV-4/INV-7 hold. Build/vet/test green
  (23 test funcs pass), including the INV-1 no-print assertion. One residual
  item — the macOS `security -w` argv exposure the builder flagged — is honest,
  transient, and local-only; ruled ACCEPT for Phase 1 with a tracked follow-up
  before macOS GA. No must-fix blocker. Decision: APPROVE (with conditions).
inv1_secret_flow_trace:
  api_key:
    source: "backend/client.go:145 (out.Data.Token) -> Registration.APIKey"
    sink: "devinit/devinit.go:206 d.Store.Set(service, apiKeyAcct, reg.APIKey)"
    other_references: "presence-only checks (devinit.go:196, :289-291) and reuse presence-check (devinit.go:142); never printed"
  private_key:
    source: "backend/client.go:146 (out.Data.Identity.privateKey) -> Registration.PrivateKey"
    sink: "devinit/devinit.go:209 d.Store.Set(service, privKeyAcct, reg.PrivateKey)"
    other_references: "presence-only checks (devinit.go:196, :289); never printed"
  control_token:
    source: "cmd/openbox/main.go:103 os.Getenv(\"OPENBOX_CONTROL_TOKEN\") — env only, guarded (main.go:104-107)"
    sink: "backend.New -> Client.authValue (in-memory header only, client.go:74-78,215); never logged"
  verified_no_leak_in:
    - "all fmt.Print/Fprint sinks enumerated (grep): none interpolate APIKey/PrivateKey/token — only DID/agent id/name/tier/account-refs"
    - "error paths: resumeErr (devinit.go:281-285), missing-creds (devinit.go:196-201), HALT-on-4xx (devinit.go:187-190) — all use agent id/DID/step, never the secret"
    - "dry-run planDryRun (devinit.go:245-260): prints account NAMES + plan only; token never read on this path (main.go:96-100)"
findings:
  - id: "SL2-SEC-1"
    classification: "accepted_risk"
    severity: "medium"
    target: "internal/secret/backends.go:82-90 (keychainStore.Set, macOS)"
    detail: >
      `security add-generic-password -U -s <svc> -a <acct> -w <value>` passes the
      secret value on argv, so it is transiently visible via `ps` to other
      processes on the same host during the exec window — unlike the Linux
      secret-tool path (SL2-SEC-OK-1), which passes the value on stdin. The
      builder's assessment is HONEST and ACCURATE: there is no no-cgo/no-argv
      path through the `security` binary, the exposure is transient (only during
      the call) and local-only (same-host observers), and the persistent INV-1
      guarantee (nothing at rest in repo/logs/config) is unaffected. Practical
      risk is low on a single-user dev laptop; it is a real local info-leak
      window on shared/multi-user macOS or CI runners. Build/CI host is Linux, so
      this path is unexercised today.
    recommendation: >
      APPROVE option (a) accept-and-document for Phase 1 (opt-in pilot). CONDITION
      the mac GA / any enforcement phase on option (b): store via the native
      Security.framework Keychain API (cgo) or a tiny helper that reads the value
      on stdin, eliminating the argv window. Track as a follow-up story. Also
      recommend the CLI print a one-line notice on darwin that a transient
      keychain-write window exists. Not a G_SEC blocker.
  - id: "SL2-SEC-2"
    classification: "hardening"
    severity: "low"
    target: "internal/secret/backends.go:29-31,41,55 + internal/devinit/devinit.go:79-86 (accounts)"
    detail: >
      The secret-store account/label attributes are built from `--org` /
      OPENBOX_ORG (free-form, unvalidated) plus the fixed provider/field. These
      flow as separate argv tokens to `secret-tool` (and into `--label=`).
      exec.Command is used (no shell) so there is NO shell injection, and the
      secret VALUE is on stdin, so no secret can leak this way. However, an org
      value beginning with `-`/`--` could be misparsed by secret-tool's GLib
      option parser (e.g. as `--label=`), causing a mangled label or a store
      failure — a robustness/DoS-of-self issue, not a confidentiality one. On
      macOS `security`, `-a <value>` consumes exactly one following token, so no
      option injection there.
    recommendation: >
      Defense-in-depth: validate `--org` (and the derived agent-name components)
      to a conservative charset (e.g. [A-Za-z0-9._-], reject leading '-'), or pass
      `--` before positional attributes to secret-tool. Non-blocking.
  - id: "SL2-SEC-3"
    classification: "observation"
    severity: "low"
    target: "internal/backend/client.go:120-128 + internal/devinit/devinit.go (Registration lifetime)"
    detail: >
      The obx_ key and Ed25519 seed live as Go strings (immutable, not zeroable)
      in Registration and in the reuse presence-check local (devinit.go:142); they
      persist on the heap until GC. This is the standard, widely-accepted Go
      limitation and materially harder to exploit than any at-rest leak (which is
      fully prevented). No action required for Phase 1.
    recommendation: >
      Note only. If a future hardening pass wants zeroization, switch the
      credential carriers to []byte and wipe after Store.Set. Non-blocking.
  - id: "SL2-SEC-4"
    classification: "observation"
    severity: "info"
    target: "internal/secret/backends.go:35,89 + internal/devinit/devinit.go:281-285 (resumeErr wraps err)"
    detail: >
      Store.Set errors wrap the underlying tool's STDERR into a user-facing
      message, and resumeErr wraps that via %w. This is SAFE today: on Linux the
      value is on stdin (never echoed to secret-tool stderr) and on macOS the
      `security` binary does not echo the -w password in its error text. Flagged
      only so the invariant is explicit and preserved if a future backend is
      added.
    recommendation: "Keep 'never wrap a channel that could carry the secret value' as a documented backend rule. Non-blocking."
  - id: "SL2-SEC-5"
    classification: "observation"
    severity: "info"
    target: "internal/devinit/devinit.go:203-214,281-285 (partial-failure / half-state)"
    detail: >
      Partial-failure handling reviewed and SOUND. If Set(api_key) succeeds but
      Set(private_key) fails, the api_key is left in the secret store (the safe
      location, not plaintext) and resumeErr reports the registered agent id +
      DID and instructs 'rotate the key and re-run' — safe (no secret in the
      message) and actionable (names the agent). On re-run the idempotency check
      requires BOTH api_key AND private_key present (devinit.go:142-143), so a
      half-state is not mistaken for a completed init; it falls through to
      remote-duplicate detection which refuses to silently duplicate. No
      credential is silently dropped. The orphaned api_key is unusable (its seed
      is unrecoverable) and is overwritten on a subsequent --force run under the
      same org/provider account namespace. Acceptable.
    recommendation: "Optional: a future `openbox dev rotate` (POST :agentId/rotate-api-key) to recover an existing agent cleanly. Non-blocking."
  - id: "SL2-SEC-6"
    classification: "observation"
    severity: "low"
    target: "internal/devinit/devinit.go:79-86 (accounts) vs server-derived org"
    detail: >
      INV-4/INV-7 upheld: organization_id and the did:aip DID are derived
      SERVER-SIDE (CreateAgentRequest carries no organization_id; org comes from
      the caller credential per the backend JwtAuthGuard). The CLI invents NO
      parallel identity store — `--org` is used ONLY as a LOCAL secret-store
      account-namespace label. Residual: a mismatch between `--org` and the token's
      real org would file creds under a misleading local label (and could miss the
      local idempotency key), but this is a UX/labeling issue, not an identity or
      confidentiality breach.
    recommendation: "Optional: after registration, prefer the server-returned organization_id for the local account namespace to keep the label truthful. Non-blocking."
positive_confirmations:
  - "INV-1 (env-only control token): cmd/openbox/main.go:102-107 — token from env only, explicit guard + rationale; never a flag."
  - "INV-1 (Linux stdin): backends.go:27-38 — secret value on cmd.Stdin, not argv. Clean."
  - "INV-1 (HALT on no store): secret.go:48-60 + main.go:112-117 — ErrNoStore -> HALT, explicit refusal to write plaintext."
  - "INV-1 (Windows): secret.go Detect has no windows case -> ErrNoStore -> HALT. No plaintext fallback anywhere."
  - "INV-1 (no-print): devinit no Fprintf interpolates the secret; TestHappyPathStoresCredsNeverPrintsThem asserts the values are absent from output (devinit_test.go:108-141)."
  - "Dry-run offline: main.go:96-100 returns before reading the token / detecting a store / building the backend client; planDryRun performs zero writes (TestDryRunMakesNoWrites)."
  - "INV-4/INV-7: org + DID server-derived; request body carries no organization_id; DID from shared did:aip namespace; no parallel identity store."
  - "managed_enable inert (NFR-5/OD10): devinit.go:177-180,220-222 — recorded into agent config as substrate only (default false); nothing in the CLI acts on it to enforce. Phase-1 opt-in preserved."
  - "No shell injection: all OS calls use exec.Command with separate argv (no sh -c); provider is whitelisted via provider.Lookup."
  - "TOCTOU: idempotency-check -> FindByName -> Create races resolve safely (backend enforces unique (org,name); a loser gets a 4xx -> HALT). No security impact."
validation:
  ran:
    - command: "cd cli && go build ./... && go vet ./... && go test ./..."
      result: "pass"
      evidence: "all packages build, vet clean, all tests pass (incl. INV-1 no-print, dry-run no-writes, partial-failure resume, HALT-on-4xx, missing-key-before-store)."
  method: "Read all Go source in cli/; enumerated every secret reference and every print/log sink via grep; traced both secret values source->sink; reviewed error/dry-run/partial-failure/idempotency branches. Cross-repo backend shapes accepted as builder-verified (Explore); not a G_SEC dependency."
G_SEC:
  decision: "approve"
  conditions:
    - "Track a follow-up story to replace the macOS `security -w` argv path (SL2-SEC-1) with a native Security.framework Keychain API or stdin-reading helper BEFORE macOS reaches GA or any enforcement phase; Phase-1 pilot accepts option (a) as documented."
    - "Recommended (non-blocking) before wider rollout: validate `--org`/agent-name to a safe charset (SL2-SEC-2)."
  rationale: >
    The core credential-handling design is sound and the story's security
    invariant (INV-1) is upheld on every path examined: both minted secrets reach
    only the OS secret store (three Store.Set sinks) and never touch argv, logs,
    stdout/stderr, config files, or shell history; the control token is env-only;
    the CLI HALTs rather than write plaintext when no store exists (Linux/macOS
    only, Windows HALTs); dry-run is fully offline; and INV-4/INV-7 hold with org
    and DID derived server-side and no parallel identity store. The single
    non-trivial residual — the macOS argv window — is transient, local-only,
    honestly disclosed, does not break the persistent at-rest guarantee, and is
    on the unexercised (non-CI) platform; it is acceptable for a Phase-1 opt-in
    pilot with a tracked follow-up. No finding rises to a must-fix blocker.
