verdict_mapping:
  HALT: "deny (strongest CC signal; no CC session-terminate primitive — documented gap)"
  BLOCK: "deny (+ policy-authored reason + policy id)"
  guardrail_validation_failed: "deny (category types only; checked before approval, independent of verdict)"
  REQUIRE_APPROVAL: "ask (OD-HITL; E6-S6 refines the interactive prompt UX)"
  CONSTRAIN: "proceed — nothing to stdout (recorded in the audit; redaction/updatedInput is E6-S4)"
  ALLOW: "proceed — nothing to stdout"
  UNKNOWN_fail_open: "proceed — nothing to stdout (degrade to observe, OD9)"
