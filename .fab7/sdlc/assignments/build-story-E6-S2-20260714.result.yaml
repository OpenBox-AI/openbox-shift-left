summary: >
  Built STORY-E6-S2 — the `apply(verdict)` leg: the enforce path's teeth. E6-S1 OBTAINS a
  sidecar.Decision synchronously before the tool runs; E6-S2 APPLIES it — mapping the governance
  verdict onto a Claude Code PreToolUse `permissionDecision` written to stdout, the moment
  WouldBlock() becomes a real block. It ports the reference SDK's enforce_verdict cascade
  (openbox-temporal-sdk-python verdict_handler.py:50-103) in the SAME priority order
  (HALT>BLOCK>guardrails>REQUIRE_APPROVAL>CONSTRAIN>ALLOW, OD-ENF-SCOPE) onto CC's hook contract:
  HALT/BLOCK -> deny; a failed guardrail validation -> deny (checked AFTER HALT/BLOCK, BEFORE
  approval, independent of the verdict value — verdict_handler.py:84-90); REQUIRE_APPROVAL -> ask
  (OD-HITL; E6-S6 refines the interactive UX on top); CONSTRAIN/ALLOW/UNKNOWN(fail-open) -> nothing
  written (proceed). THE ONE DESIGN RULE — governance only TIGHTENS: only deny/ask ever reach
  stdout, so a non-blocking verdict and enforce-off are byte-identical (empty) and CC's own
  permission flow is untouched. Fail-open preserved end-to-end: nil stdout / marshal / write fault
  all degrade to "proceed" (OD9) — the apply can never wedge or hard-fail a call. Also lands the
  DURABLE enforcement-decision audit E6-S1 deferred here (enforcements.jsonl), strictly content-free.
  Validation GREEN: adapter/sidecar/cli build/vet/test -race all pass; live E2E vs the real binary +
  `openbox sidecar serve` confirmed deny/ask/proceed/enforce-off + a content-free audit with no
  command leak. Both independent reviews ran: G3 (review_auditor) APPROVE-WITH-MINOR, G_SEC (Sam)
  APPROVE — the single shared LOW finding FIXED in-code. Remaining: brian G3 sign-off.
scope_boundary_confirmed_by_recon: >
  Per the user directive ("always use explore for cross-repo reference"), a read-only Explore of
  openbox-temporal-sdk-python recovered the EXACT enforce_verdict cascade this story ports:
  verdict_handler.py:50-103 — HALT->GovernanceHaltError (terminate); BLOCK->GovernanceBlockedError
  (non-retryable); guardrails_result.validation_passed==false -> GuardrailsValidationError, checked
  BEFORE approval so a guardrail failure is never swallowed by an approval flow (:84-90) and
  independent of the verdict value; REQUIRE_APPROVAL -> requires_hitl (caller raises RETRYABLE
  ApprovalPending — polling, not an inline blocking loop; hitl.py); CONSTRAIN -> logged allow, no
  data mutation; ALLOW -> proceed. The ONLY data mutation is guardrail redaction, applied by the
  CALLER after enforce_verdict via _apply_input_redaction (activity_interceptor.py:441-478) — that
  maps to CC's `updatedInput` and is DEFERRED to E6-S4 (gated on content posture). So E6-S2 = the
  verdict->permissionDecision mapping ONLY; it applies no input mutation (no updatedInput field on
  the output struct). HALT has no CC session-terminate primitive, so it maps to `deny` (strongest
  CC signal) — the one documented, accepted fidelity gap.
key_design_decisions:
  tighten_only: >
    Governance can only ADD a restriction, never remove one of Claude Code's built-in prompts. The
    apply emits ONLY deny/ask; mapVerdict has no path yielding "allow", and applyDecision writes
    nothing when the decision is "". An unrecognized/malicious core verdict resolves to
    VerdictUnknown -> nothing written -> CC's normal flow. This makes a fail-open/ALLOW/CONSTRAIN
    byte-identical to observe mode on stdout, and makes it structurally impossible for core to
    induce an `allow` that suppresses CC's own permission gate.
  content_free_surfaces_INV2: >
    Two NEW surfaces were audited to the content boundary. (1) stdout permissionDecisionReason:
    surfaces the POLICY-authored Evaluation.Reason + policy id (local-only — stdout -> Claude Code
    on the same machine, NOT egress), never the tool command/file/output; a guardrail-failure
    reason uses the CATEGORY types only ([pii,...]), never the guardrail free text. Live-verified:
    `rm -rf` never appears on stdout (the reason is the bundle's authored text). (2) the durable
    enforcements.jsonl audit: STRICTLY category-only — verdict/ids/flags + guardrail CATEGORY types
    (reasonTypeCategories), never the guardrail reason free text or field name (this is the LOW-1
    fix, deliberately STRICTER than SL-9's advisoryRecord which serializes the full guardrail
    struct; projecting SL-9 too is a noted fast-follow, out of scope). Being category-only keeps
    the audit safe even if a later story egresses it (e.g. to the dashboard).
  fail_open_apply: >
    applyDecision NEVER wedges a call: a nil stdout, a json.Marshal fault, and a write fault are
    three distinct fail-open returns (proceed). recordEnforcement runs AFTER the stdout decision is
    already written, best-effort, any error logged+swallowed (INV-3). RunHook's defer-recover +
    the caller returning exitOK close the loop. Enforce mode cannot hard-fail a tool call.
