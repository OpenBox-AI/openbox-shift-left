  live_e2e: >
    Built the real `openbox` binary and ran `openbox sidecar serve --bundle <local bundle blocking
    a shell command containing 'rm -rf'>` on a self-owned 0700 socket dir. With OPENBOX_ENFORCE=1
    and a configured DID, piping a PreToolUse payload to `openbox hook claude-code PreToolUse`:
    (a) `rm -rf /tmp/x` -> stderr "enforce decision: tool=Bash verdict=BLOCK would_block=true
    source=local-bundle fail_open=false", exit 0, EMPTY stdout; (b) `echo hi` -> verdict=ALLOW
    would_block=false source=local-bundle; (c) sidecar ABSENT (bogus socket) -> verdict=UNKNOWN
    would_block=false source=fail-open:client fail_open=true, exit 0, empty stdout. Confirms the
    synchronous pre-execution gate obtains the verdict locally, fails open when the daemon is
    absent, and never emits a blocking signal (INV-3) in E6-S1.
invariants_upheld:
  INV-3b: "decision synchronous + pre-execution + bounded by sidecar.Client's hard ~50ms timeout + fail-open default (OD9); NO network on the decision path — only the local per-user Unix socket dial (verified: EnforceDecision -> Client.Decide -> unix dial only)."
  INV-3: "verbatim for E6-S1 — exit 0, NOTHING to stdout in any mode; enforce off -> sidecar never dialed -> observe/advisory path byte-identical (test: 0 dials + no diagnostic)."
  INV-1: "no secret on the PreToolUse hot path (DID only, as Phase-1); the stderr diagnostic carries tool/verdict/source/flags only — no secret."
  INV-2: "shell command carried on the DecisionRequest is LOCAL-ONLY (local socket, on-machine eval, never egressed, never logged as content); Mapper egress path unchanged and still never decodes the command; DecisionRequest.Content left nil."
reviews_run:
  G3_review_auditor:
    reviewer: "review_auditor (Reva)"
    date: "2026-07-14"
    verdict: "approve-with-minor-revisions"
    summary: >
      Verified every G3 clause in code (not from builder narrative): synchronous pre-execution obtain,
      50ms-bounded fail-open, INV-3b network-free (unix dial only), INV-3 verbatim (grep: no
      stdout/Print/Exit in the new code; double recover; caller returns exitOK — no path can deny),
      AC-4 observe byte-identical (&& short-circuit; 0 dials tested), AC-6 PreToolUse-only (0 dials for
      PostToolUse tested), INV-2 command local-only (Mapper egress unchanged). -race GREEN.
  G_SEC_security_reviewer:
    reviewer: "security_reviewer (Sam)"
    date: "2026-07-14"
    verdict: "approve"
    summary: >
      All three invariants hold. Decision path network-free (dial 'unix' only, hard bound, fail-open on
      SetDeadline error); hot path secret-free (Identity=DID; diagnostic prints verdict/flags only);
      command/file LOCAL-ONLY (command() reaches only the local-socket request; Mapper unchanged;
      diagnostic prints neither command/file_path/reason). Enforce-off never dials. Untrusted input
      robust (json.Marshal escaping blocks socket-protocol injection; no panic/hang). No CRIT/HIGH/MED.
review_findings_addressed:
  G_SEC_LOW1: "command bound was by RUNES but the server read-limit is by BYTES -> an adversarial multibyte/control-heavy command could push the marshaled DecisionRequest over the 64KiB byte LimitReader (harmless in E6-S1 — fails safe to allow — but ambiguous once E6-S3 fail-closed inherits it). FIXED IN-CODE: maxCommandLen is now an 8 KiB BYTE budget; capCommand truncates at a UTF-8 rune boundary (utf8.RuneStart) so a rune is never split; comment corrected. Test TestCapCommand_ByteBoundedRuneSafe added. adapter -race GREEN + e2e 25/25 re-run clean."
  G_SEC_INFO1: "client-side socket trust in the non-XDG $TMPDIR/openbox-<uid> fallback (the hook dials whatever DefaultSocketPath returns; the ownership guard is server-side in the E6-S5 module). ACKNOWLEDGED as an E6-S5-boundary/E6-S2 hardening follow-up: non-exploitable in E6-S1 (verdict not applied; XDG_RUNTIME_DIR is the default, 0700 by systemd; only same-user-adjacent metadata exposure under the fallback). Flagged to confirm coverage in the E6-S5 G_SEC record and to add client-side socket ownership verification BEFORE E6-S2 applies attacker-influenceable verdicts."
  G_SEC_INFO2: "no durable content sink in E6-S1 — noted by Sam as security-FAVORABLE (no extra command/file leak surface). Aligns with the G3 F1 resolution (durable record deferred to E6-S2)."
  G3_F1_MEDIUM: "AC-5 mandated a durable enforcement-decision record while the write scope marked it optional — a self-contradiction. RESOLVED by amending STORY-E6-S1.md AC-5: E6-S1's record IS the stderr diagnostic; the DURABLE record is deferred to E6-S2 (where the decision is applied), avoiding conflation with SL-9's Advisory-on-flush sink and adding no content-egress surface. Surfaced for brian's G3 adjudication."
  G3_F2_LOW: "dev config file read up to 3x per PreToolUse in enforce mode (ResolveIdentity + ResolveEnforce + ResolveSidecarSocket each loadDevConfig). DEFERRED to E6-S2 per the reviewer — within AC-4's sanctioned 'one cheap ResolveEnforce gate' cost and far under the 50ms budget; thread the loaded DevConfig through when the path grows teeth."
  G3_F3_LOW: "TestResolveEnforce uses os.Unsetenv (not restored by t.Cleanup). ACCEPTED as-is — identical to the existing TestResolveInstallGitHook convention (creds_test.go); harmless (CI does not set OPENBOX_ENFORCE; later t.Setenv re-establishes tracking)."
