summary: >
  Built STORY-E6-S1 — the enforce-mode SYNCHRONOUS pre-execution gate. In ENFORCE mode
  (ResolveEnforce; default OFF = observe) the Claude Code `PreToolUse` hook now obtains a
  governance decision from the LOCAL sidecar (E6-S5's sidecar.Client) BEFORE the tool runs —
  the INV-3b carve-out: an enforce path MAY block, but only pre-execution, only within a hard
  ~50ms timeout, fail-open by default (OD9). It builds a sidecar.DecisionRequest from the hook
  payload by REUSING the Mapper's classifyTool/filePath (so the gate and the observe event
  classify a tool identically), calls sidecar.Client.Decide, and surfaces the resulting
  client.Evaluation (via sidecar.Decision) through a seam E6-S2's apply consumes. It reads NO
  secret on the hot path (DID only) and takes NO network I/O (only the local per-user socket).
  Fail-open is inherited from the sidecar.Client primitive: socket absent / dial refused /
  timeout / malformed reply -> VerdictUnknown allow, tool proceeds. The Phase-1 observe/advisory
  path is byte-identical when enforce is off — the sidecar is never dialed (a test asserts 0
  dials). Validation green: adapter/sidecar/cli build/vet/test -race all pass; live-verified
  against the real `openbox` + `openbox sidecar serve` binary. Remaining: brian G3 + Sam G_SEC.
scope_boundary_confirmed_by_recon: >
  The user directive ("always use explore for cross-repo reference") drove a read-only Explore
  of the sibling openbox-temporal-sdk-python to fix the E6-S1/E6-S2 boundary faithfully. Finding:
  the SDK's pre-execution gate (activity_interceptor.py execute_activity, ~199-274) AWAITS
  GovernanceClient.evaluate_event (POST /evaluate) on ActivityStarted, THEN runs enforce_verdict
  BEFORE the activity executes. There are TWO halves: (1) OBTAIN the verdict synchronously; (2)
  the enforce_verdict cascade (verdict_handler.py:50-103 — HALT>BLOCK>guardrails>REQUIRE_APPROVAL
  >CONSTRAIN>ALLOW, ordered early-returns/raises) that turns it into an action. **E6-S1 is half
  (1) only** — obtain + record. Half (2) -> Claude Code permissionDecision (deny/ask/allow +
  updatedInput) is **E6-S2's apply**. So E6-S1 deliberately writes NOTHING to stdout and never
  blocks: INV-3 (exit 0, no stdout) holds verbatim, and there is zero risk of a wrong deny while
  the sync path + latency bound + fail-open are landed and validated. Cross-repo recon also
  confirmed OD9 fidelity: the SDK's fail-open/closed knob is `on_api_error` (default "fail_open";
  client.py:204-213 -> None verdict -> proceed), exactly the sidecar.Client's fail-open ALLOW.
key_design_decision: >
  INV-2 AND THE SHELL COMMAND. For a meaningful local decision (the canonical "block rm -rf"
  rule) the DecisionRequest must carry the axis a policy matches on — the shell command. This is
  faithful and MORE private than the SDK, which sends the full activity_input (args) to a REMOTE
  core over the network. Our DecisionRequest goes ONLY over the local Unix socket to the resident
  daemon and is evaluated ON-MACHINE (no decision-mirror Emit exists; verified). The sidecar
  protocol already classifies `command`/`file_path` as matchable METADATA AXES (protocol.go /
  socketpath.go:62), not gated Content. So a dedicated LOCAL-ONLY HookEvent.command() feeds the
  request's Attributes; it is never egressed and never logged as content, and the Mapper's
  observe/telemetry EGRESS path is byte-unchanged and still never decodes the command. Content
  (prompt/output/file_text) stays nil — E6-S4 populates it, gated on content posture, for local
  redaction only. The command is rune-bounded (16 KiB) at the untrusted boundary; truncation can
  only ever cause a policy MISS (-> allow), never a wrong block (consistent with OD9 fail-open).
