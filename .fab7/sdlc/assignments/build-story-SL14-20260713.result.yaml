cross_repo_reference:
  method: "Read-only Explore agent (per user directive: always use explore for cross-repo reference) over ../openbox-core"
  verified:
    - "HEADER HANDLING: /api/v1/governance/evaluate (internal/api/main.go:123) has no request-header allow-list. The only middleware is Logger/Recover + CORS (main.go:82-114); Echo CORS AllowHeaders only populates the preflight response header, never rejects a real POST's headers. Handler EvaluateGovernanceEvent (governance.go:28-203) reads headers only by name. => Idempotency-Key is inert (ignored, non-fatal)."
    - "SIGNATURE SCOPE: BuildAgentIdentityCanonicalRequest (internal/services/agent.go:93-101) = UPPER(METHOD)\\nPATH\\nTIMESTAMP\\nNONCE\\nBODY_SHA256; verifier reads exactly the 5 AIP headers (identity.go:36-59). No full-header-set hashing => adding Idempotency-Key does not change the signed string. Body integrity via X-OpenBox-Body-SHA256 (agent.go:167), so the key must ride in a header (it does), not the body."
    - "NO DEDUPE ON event_id/Idempotency-Key today: no Idempotency-Key handling in non-test core source; GovernanceEventPayload (internal/content/governance.go) has no inbound event_id field. Existing suppression keys on the tuple (agent_id, workflow_id, run_id, activity_id, event_type) + span_id for hook events (governance_workflow.go:193-233, validation.go:75-96) — dev events don't populate activity_id, so they are not deduped. Confirms the EXT-core completing half (SL3-IDEMPOTENCY)."
