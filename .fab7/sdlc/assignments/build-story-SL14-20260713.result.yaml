  - id: "AC2 (explicit Idempotency-Key header == event_id)"
    status: "met"
    evidence: "client.attempt sets Idempotency-Key = EventID. TestEmit_IdempotencyKeyHeader asserts header == EventID == metadata.event_id in the signed body. Documented as EXT-core completing piece (signing.go const + READMEs). Not part of canonical string (verified) => signature-safe; existing signature tests green."
  - id: "AC3 (delivery-guarantee test matrix)"
    status: "met"
    evidence: "lost-200 retry re-sends same id: TestEmit_IdempotencyKeyStableAcrossRetries (+ existing TestEmit_RetryReusesSameEventID). crash-then-recovery never re-sends acked: TestEventID_RecoveryNeverReSendsAcked. distinct never reuses: TestDeriveID_DistinctEventsNeverCollide. stable across spool→rotate→flush→recovery: TestEventID_StableAcrossSpoolLifecycle."
  - id: "AC4 (INV-3 preserved — no hot-path / fail-open / retry change)"
    status: "met"
    evidence: "Emit still returns (VerdictUnknown, nil) on any error; post/attempt retry classification (5xx/429 retryable, 4xx terminal) unchanged apart from setting one header. deriveID is one SHA-256 over a short string — no I/O, no secret, allocation-cheap. All prior fail-open/retry tests green."
  - id: "AC5 (honest docs — server dedupe is the completing half)"
    status: "met"
    evidence: "client/README.md Idempotency section + INV-5 table row; adapters/claude-code/README.md deriveID note; deriveID + headerIdempotencyKey doc comments all state server-side dedupe on the id (EXT-core / SL3-IDEMPOTENCY) is the completing half."
