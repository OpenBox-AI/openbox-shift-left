invariants_enforced:
  - "INV-5: stable+unique client id per event; retries/recovery never double-count on shift-left's side (client at-most-once; server dedupe = EXT-core)."
  - "INV-3: fail-open + hot-path budget unchanged; deriveID pure/allocation-cheap; header add guarded and non-blocking."
  - "INV-1: id derives only from non-secret structural fields; the obx_ key and Ed25519 seed never reach the Mapper and are never hashed."
  - "INV-2: only structural locators (file_path/function) feed the id; no prompt/command/output content is hashed (TestDeriveID_NoContentInID)."
