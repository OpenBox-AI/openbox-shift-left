story: "STORY-SL-14"
status: "completed"
summary: >
  Built STORY-SL-14 (idempotency hardening — deterministic event_id + delivery-guarantee
  matrix). The Claude Code adapter's event_id is now DERIVED deterministically from the
  event's own structural fields (adapters/claude-code deriveID: "cc-" + sha256 over
  session_id, event_type, tool.name, RFC3339Nano timestamp, and the span file_path/function
  locator, 0x1f-delimited) instead of "cc-"+hex(random). Same logical event → same id (robust
  if ever recomputed from the spooled record); two distinct events never collide (sub-second
  timestamp is the per-event distinguisher). The client now also sends a standard
  Idempotency-Key request header (== EventID == metadata.event_id), constant across retries,
  NOT part of the AIP canonical string (signature-safe) and inert until EXT-core consumes it.
  Delivery-guarantee test matrix added (the real deliverable): determinism + collision-freedom
  (property), id stability across spool→rotate→flush→recovery, recovery-drain never re-sends an
  acked event, and lost-200 retry re-sends the SAME key. STAYS fail-open (INV-3): no change to
  Emit's return, retry classification, or the Pre/PostToolUse hot path; deriveID is one pure
  allocation-cheap SHA-256, no I/O, no secret. Validation green: adapter + client
  build/vet/test -race all pass; gofmt clean. One human gate remains: G3_REVIEW (brian).
stop_condition_triggered: false
key_design_decision: >
  Two design cruxes, both resolved without triggering the story's stop conditions.
  (1) DETERMINISM SOURCE. The CC hook payload carries NO timestamp and no per-event
  distinguisher for repeated event types (prompt text / command strings are content, INV-2, so
  they cannot feed the id). Rather than fall back to random ids for those types (stop condition
  #1), the id derives from the event's own high-resolution timestamp — exactly the distinguisher
  the story suggested ("tool + high-resolution timestamp"). To make "robust if ever regenerated"
  literally true, the event Timestamp was widened from RFC3339 to RFC3339Nano and the id derives
  purely from the PERSISTED event fields — so re-deriving from the spooled record reproduces the
  id byte-for-byte. RFC3339Nano is byte-identical to RFC3339 for a whole-second instant (Go omits
  an all-zero fraction) and core parses it with RFC3339Nano (payload.go rfc3339Nanos), so nothing
  downstream changes and all existing whole-second-clock tests stay green. (2) HEADER SAFETY. A
  read-only cross-repo Explore of openbox-core (per user directive) confirmed the Idempotency-Key
  header is inert (no header allow-list on /evaluate; unknown headers ignored) and NOT covered by
  the AIP canonical string (METHOD\nPATH\nTIMESTAMP\nNONCE\nBODY_SHA256 only — services/agent.go
  BuildAgentIdentityCanonicalRequest), so adding it cannot break signature verification. Stop
  condition #2 (drop header if core rejects) therefore NOT triggered. The git-action deploy id
  (deploy-<env>-<full-sha>) is already deterministic and was left untouched (out of write scope).
