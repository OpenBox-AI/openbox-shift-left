  Built the real binary and drove every enumerated hook path (valid events, unknown provider, missing
  args, bad hook name, empty/garbage stdin, flush, empty event) capturing stdout/stderr/exit
  separately: EVERY hook invocation exited 0 with exactly 0 stdout bytes. Control paths (version → 17
  stdout bytes; no-args → exit 1) confirm the multi-command binary DOES write to stdout elsewhere and
  the hook path is fully walled off. Structurally: run() matches `hook` before any version/usage/errorf
  path; runHook logs to a.stderr only and returns exitOK unconditionally; the flag package is never
  engaged on the hook path; no os.Stdout/fmt.Print* anywhere in the hook+flush reach.
