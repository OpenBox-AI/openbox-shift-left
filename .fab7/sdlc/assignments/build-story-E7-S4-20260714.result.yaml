known_limitations:
  activity_id_collision: >
    Two IDENTICAL sequential tool calls (same tool + same file/function locator in one session)
    derive the same activity_id/span_id. Acceptable: Claude Code sequences Pre->Post per call and
    Core pairs the open started span. Documented in code; a per-invocation tool_use_id (if a future
    HookEvent field surfaces it) would make pairing exact.
  completed_duration_zero: >
    In the real CC flow a PostToolUse (ToolResult) sets only EndedAt (StartedAt is on the separate
    PreToolUse process), so start==end -> duration_ns=0 on the completed span. Wire-shape-valid;
    a precise duration would require the enforce/spool to stash the started time. Pre-existing.

