summary: >
  The event->wire MAPPING promised by the E7-S1/S3 scope split: buildPayload now serializes a
  ToolCall/ToolResult onto the base SDK's flat hook wire shape via the E7-S3 builder
  (BuildHookSpan/BuildHookEvent) + the E7-S1 hook types. A ToolCall becomes an ActivityStarted
  hook (stage=started); a ToolResult becomes the SAME ActivityStarted hook envelope with a
  stage=completed span. The started+completed pair share a deterministic activity_id + span_id +
  session trace_id so Core (and the shared dashboard) pair them onto one timeline row. The
  enforce path is structurally untouched (INV-3) and INV-2 content-gating is preserved.

key_reference_correction:
  finding: >
    MIGRATION DOC (§2 row 6) IS WRONG and was NOT followed. It said ToolResult -> ActivityCompleted.
    Cross-repo Explore of the READ-ONLY base SDK (openbox-sdk-python) established the ground truth:
    a completed tool call emits event_type="ActivityStarted" + hook_trigger=true + a stage="completed"
    span. ActivityCompleted is a hook-LESS lifecycle event that must NOT carry hook spans.
  evidence:
    - "contracts/events.py wire_event_type(): a hook_trigger event is ALWAYS ActivityStarted on the wire regardless of what the envelope stores."
    - "contracts/events.py module docstring L8-14: 'Hook evaluations serialize as ActivityStarted + hook_trigger=true + non-empty spans; ActivityCompleted must not carry non-empty hook spans.'"
    - "hooks/wrappers.py: the SAME span object is passed to preflight (stage=STARTED) and completed (stage=COMPLETED) — shared span_id/trace_id, differing only in stage/end_time/duration_ns. Pairing is the shared bound-context activity_id, NOT parent_span_id linkage (confirms the E7-S3 reference-correction note)."
    - "conformance/fake_core.assert_hook_wire_shape asserts event_type=='ActivityStarted' UNCONDITIONALLY and accepts span stage in {started, completed}; test_required_cases.test_started_and_completed_wire_shape runs it over BOTH started and completed payloads."
  why_it_is_self_consistent: >
    This is exactly what E7-S1's AssertHookWireShape (hardcodes ActivityStarted, accepts both stages)
    and E7-S3's BuildHookEvent (hardcodes event_type=ActivityStarted) were built for. Emitting
    ActivityCompleted would have FAILED our own E7-S1 conformance gate. The migration doc's §3
    parent-linkage claim was already corrected by E7-S3; this is the second correction (event_type).
  recommend: "E7-S6 must fix migration-doc §2 row 6 + §3 to match the base SDK (ToolResult = ActivityStarted, stage=completed, shared span_id/activity_id)."

scope:
  in_scope: "ToolCall/ToolResult (file/mcp/shell) -> flat ActivityStarted hook wire shape; started/completed pairing; INV-2 gate on the new shape; enforce regression."
  deferred:
    E7-S5: "SessionStarted/Ended -> Workflow*; PromptSubmitted/CommitCreated/Deploy -> SignalReceived. These keep the LEGACY envelope path (buildLegacyPayload) untouched for now."
    E7-S6: "contract/MAPPING.md + dev-event schema update to the unified shape; base conformance parity matrix; full live dashboard E2E (the timeline pairing fix is proven at the wire level here; the dashboard render is E7-S6)."

write_scope_deviation:
  planned: "client/payload.go, adapters/claude-code/mapper.go, *_test.go."
  actual: "client/payload.go (+ client/payload_hook_test.go NEW, client/payload_test.go + client/client_test.go updated). adapters/claude-code/mapper.go NOT changed."
  why: >
    The event->wire mapping is provider-agnostic and belongs in client/payload.go, the shared wire
    layer every adapter (SL-7 Codex, SL-8 Cursor) uses — matching the CLAUDE.md core/adapter split
    (adding a provider = a thin adapter, zero core change). The DevEvent contract (client/event.go)
    is frozen out of scope and already carries everything the mapping needs (Tool.Kind: shell|file|mcp
    -> HookType 1:1; Span.SemanticType/FilePath/FileOp/MCPServer/Function -> family fields + Core
    classifier hints). So the CC Mapper (CC-hook -> DevEvent) needed no functional change; touching it
    would push CC-specific knowledge into the adapter that the contract already encodes. mapper_test
    asserts DevEvent-level shape (unchanged) and stays green.

deliverable:
  client_payload_go:
    - "buildPayload now DISPATCHES: EventToolCall/EventToolResult -> buildHookPayload; everything else -> buildLegacyPayload (the pre-E7-S4 envelope, retained verbatim for E7-S5's lifecycle/signal events)."
    - "buildHookPayload: BuildHookEvent(activity_id, activity_type=tool name, span) + merged session-attach fields (source, workflow_id, run_id, timestamp) + metadata (json.RawMessage nested object -> event_id/tool_name/tokens/cost preserved)."
    - "buildHookSpan: derives stage (ToolResult=completed, else started; adapter Span.Stage wins), builds the flat span via the E7-S3 BuildHookSpan with a deterministic shared span_id and the session trace via TraceContextFrom(sessionTraceID)."
    - "hookTypeFor: ToolFile->file_operation, ToolMCP->mcp, ToolShell->shell (1:1 SL-1 kind -> E7-S1 hook type); generic 'tool' reserved for future kinds."
    - "hookSpanShape: file -> name file.read/write/... + root file_path/file_operation/byte counts (Core's file classifier gate); mcp -> attributes[mcp.method]=callTool (+ mcp.server/mcp.tool) + mcp_* family roots (kind=CLIENT); shell -> hook_type only, shell_command stays present-but-null (INV-2 — command is read only for the LOCAL enforce decision, never egress)."
    - "Deterministic id derivation (no cross-process/spool state threading): sessionTraceID(session_id)->32-hex stable trace; activityPairKey(session_id, tool.Name, file/function locator) with NO stage/timestamp -> hookActivityID (pairing key) + hookSpanID (16-hex, shared by the started+completed pair, base SDK shared-span model)."
  tests:
    - "client/payload_hook_test.go (NEW): wire-shape conformance over file/mcp/shell x started/completed via AssertHookWireShape (the Go analog of test_started_and_completed_wire_shape); envelope; file+mcp+shell classification fields; started/completed pairing (shared trace/span/activity ids, started nulls end_time/duration_ns, completed fills them); trace/activity scoping; INV-2 content gate (stripped leaks nothing; authorized carries request_body at span root only, attributes carry no content)."
    - "client/payload_test.go: MCP test updated (function-family 'function' -> attributes['mcp.tool'], the flat-hook mcp identifier). Legacy/lifecycle tests (envelope, tokens/cost, event_id, ActivityType, stripContent) unchanged + green."
    - "client/client_test.go: TestEmit_HappyPath updated to assert the ActivityStarted hook envelope (event_type=ActivityStarted not 'ToolCall'; span stage=started, name=file.write, no SDK-sent semantic_type)."

