    verdict: "CONCERNS -> RESOLVED (1 must-fix fixed)"
    findings:
      SEC-1: "MEDIUM (must-fix before content-body egress) — request_body/response_body were egressed uncapped on the content-capture path; the base SDK always truncates to PrivacyConfig.max_body_size (65536 chars, before signing), and E7-S1's G_SEC deferred this truncation to the E7-S4 emitter; comments falsely claimed it was done. RESOLVED: added capBody (Go mirror of serialization.truncate_string — 65536, rune-counted, no marker) applied to request_body/response_body in BOTH the hook path (hookSpanShape) and the legacy path (buildSpan) before marshal=before signing; comments corrected; added TestHookPayload_ContentBodyTruncated (a >cap body is capped on the wire). Latent today (no shipping caller populates these fields), now closed for future adapters."
