  INV-3_INV-3b: "Enforce path UNTOUCHED. enforce.go builds its own sidecar DecisionRequest (buildDecisionRequest) and never calls buildPayload/spanData; this is an async-egress-shape change only. E6 enforce conformance C1-C9 all PASS."

