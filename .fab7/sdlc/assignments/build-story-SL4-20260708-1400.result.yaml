summary: >
  Built the OpenBox Claude Code adapter (STORY-SL-4) — the first realization of the generic
  Provider Adapter Contract (architecture §1b). Maps Claude Code's 5 hooks
  (SessionStart/UserPromptSubmit/PreToolUse/PostToolUse/SessionEnd) → normalized SL-1 DevEvents →
  emits via the SL-3 client. Observe-only, metadata-only, fail-open: nothing it does can block,
  deny, delay (beyond local I/O), or fail a tool call. New Go module adapters/claude-code/
  (stdlib-only, OD17) with a hook-entrypoint binary + a native CC plugin bundle + an installer
  that replaces the SL-2 claude-code stub. Delivered off a local spool (hot path = local I/O only,
  meets NFR-2 <50ms; flush at SessionEnd / via `flush`). 54 tests green under -race, incl. every
  emitted event validated against the real SL-1 conformance schema + a real-binary end-to-end
  observe-only assertion. Independently reviewed (correctness + G_SEC); all must-fix findings FIXED
  and re-validated. Human gates remain: G1_READY + G3_REVIEW (brian sign-off).
