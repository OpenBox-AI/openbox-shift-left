reviews:
  correctness_audit:
    reviewer: "review_auditor (Reva)"
    decision: "REVISE → all must-fix FIXED + re-validated"
    findings:
      - "F1 (MEDIUM, blocking): ctx-cancel drainFile deleted the undelivered remainder while the doc claimed it was kept → FIXED (drainRotated persists the undelivered tail to a recovery file; delivered lines never re-sent; doc corrected). Regression: TestSpoolCtxCancelPersistsRemainder."
      - "F2 (LOW-MED): orphaned .flushing.<id> files never re-drained → FIXED (FlushAll re-claims + drains orphans). Regression: TestSpoolAdoptsOrphan."
      - "F3 (LOW): 1 MiB stdin cap dropped whole event for large writes → FIXED (32 MiB bound + streaming decode; structural fields only). "
      - "F4 (LOW): cwd-derived workflow_id could fragment a session → FIXED (WorkspaceID empty → client uses DID; stable per session). Regression: TestMap_WorkflowIDIsDIDNotCwd."
      - "F5 (LOW): malformed mcp__ name → kind=mcp/empty server (non-conformant) → FIXED (fall back to shell/internal). Regression: TestClassifyTool_MalformedMCPFallsBack."
      - "F6 (INFO): <50ms unmeasured — follow-up (add a hot-path benchmark)."
      - "F7 (INFO): content-capture env/config precedence → FIXED (env-overrides-config both ways)."
  security_review:
    reviewer: "security_reviewer (Sam)"
    decision: "approve-with-conditions"
    gate: "G_SEC"
    evidence: >
      SL3-SEC-3 SATISFIED: no raw prompt/command/file/output content can reach OpenBox via metadata,
      tool.name, tool.mcp_server, or span.* — content-bearing fields have NO struct field (discarded at
      unmarshal); tool_input read only for a structural file_path; Bash command never read. Confirmed the
      client's stripContent does NOT touch metadata/tool.name, and the adapter correctly does not rely on
      it. INV-1/INV-2/INV-3 PASS; injection surfaces (sanitizeSessionID, splitMCPName, exec.Command argv,
      1MiB caps) safe. Conditions (all LOW, ADDRESSED in-code): cap identifier/path fields (maxIdentLen=512),
      enum-validate lifecycle fields (source/reason/permission_mode drop-unknown), reject leading-dash
      secret-store coordinates. Artifact-of-record for G_SEC.
