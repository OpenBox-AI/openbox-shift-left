cross_repo_reference:
  method: "Three read-only Explore/guide agents (per user directive: always use explore for cross-repo reference) over ../openbox-core, ../openbox-temporal-sdk-python, and the Claude Code hook docs."
  verified:
    - "CORE semantic_type is RECOMPUTED server-side (governance_workflow.go:307-310 → ComputeSemanticTypeFromSpan, session.go:172-272) from span name + attributes; hook_type/file_operation/function IGNORED. Client's classificationHints already sets what core reads → adapter just sets Span.SemanticType + FilePath."
    - "CORE accept-list (api/governance.go:273) still rejects the 7 dev lifecycle types → live POST 400s → fail-open drop until EXT-core's 3 additive edits. Tests run vs the client's mock (matches SL-3)."
    - "CORE verdict response = GovernanceVerdictPublicResponse (lowercase verdict strings) — parsed by the SL-3 client; adapter ignores it (observe)."
    - "SDK (worker.py/interceptors) maps everything onto the 7 Temporal types + sends spans via hook_trigger re-sends; shift-left DELIBERATELY chose distinct dev types (MAPPING §2 rejects overloading WorkflowStarted: OPA-bypass + guardrail-skip). Adapter emits SL-1 types via the client — the intended design."
    - "SDK/core have NO first-class token/cost field → client carries them in metadata; but Claude Code hooks do not expose tokens/cost at all → adapter emits none (honest limitation, capabilities telemetry.tokens=false)."
    - "CLAUDE CODE hooks: common fields session_id/cwd/hook_event_name/permission_mode; SessionStart source; SessionEnd reason; Pre/PostToolUse tool_name/tool_input; MCP tools named mcp__<server>__<tool>. Exit 0 + empty stdout = safe no-op; stdout on SessionStart/UserPromptSubmit is INJECTED into context (→ binary writes nothing to stdout). Plugin: .claude-plugin/plugin.json + hooks/hooks.json, ${CLAUDE_PLUGIN_ROOT}."
