    result: "Core claims VERIFIED; one behavior change FOUND (F1); one cosmetic residue confirmed (F2)."
    detail: >
      (VERIFIED) `git commit -v -m`, `git commit -v` with commit.verbose=true, and a diff
      containing a column-0-looking `OpenBox-Session:` line: the trailer stamps correctly and
