story: STORY-E6-S9
title: "Tier-1 local secret/entropy detection + redact-and-continue"
epic: E6
status: review        # built + both independent reviews + findings fixed + re-validated + live E2E; PENDING brian G3 + Sam G_SEC
built_at: "2026-07-15"
builder: build-engineer

summary: >
  Makes the E6-S4 `updatedInput` seam LIVE with the first real, LOCAL redaction
  source: a deterministic secret/entropy detector in the sidecar. On the enforce
  PreToolUse proceed path, a Write/Edit body is scanned locally; detected secrets
  are replaced by ${OPENBOX_REDACTED_<CATEGORY>} env-var refs, and the CC hook
  RECONSTRUCTS the tool_input replacing ONLY the content field. On by default,
  decoupled from the egress content-capture opt-in (OD-SYNC-10). Closes the
  E6-S4/S7 carry-forward (constrain updatedInput to content-only fields).

design_cruxes:
  - "Content-field RECONSTRUCTION, not full-object replacement: the adapter sources every structural locator (file_path/…) from the ORIGINAL tool_input and swaps only the content field the scanner read (fileText precedence). Content-only becomes a STRUCTURAL guarantee — a buggy/compromised sidecar can change a content VALUE, never a structural field."
  - "On-by-default + egress-DECOUPLED: the body reaches ONLY the local Unix socket; RedactedContent/RedactionCategories ride sidecar.Decision, never client.Evaluation. INV-2 is egress-only, so local scanning honors it without the OD4 opt-in. The observe Mapper egress path is unchanged."
  - "env-var-ref placeholder (design §7) over the guardrails-api typed-placeholder/*×len precedent — the right nudge for a SECRET (externalize it), confirmed net-new by recon."

cross_repo_recon:
  - "Secret detection is genuinely NET-NEW — no openbox repo carries an owned regex/entropy detector to mirror (only a separate MIT toolkit shelling out to Yelp detect-secrets)."
  - "Reference SDK _apply_input_redaction is a per-arg PARTIAL PATCH (dataclass field-merge / value-replace; non-dict → warn-and-skip), validating content-field reconstruction over a blind full-object blob."
  - "OpenBox redaction precedent: PII → typed placeholder <ENTITY_TYPE>; ban-list → *×len; NO env-var-ref anywhere."

detector:
  file: sidecar/secrets.go
  named_patterns: [aws_key, github_token, slack_token, google_api_key, stripe_key, ai_api_key, jwt, private_key(PEM block), secret_assignment(value-only KEY=VALUE)]
  entropy_fallback: ">=24 chars, >=4.5 bits/char, ASSIGNMENT-GATED (value after =/:); excludes hex/UUID/git-SHA (4.0-bit ceiling < 4.5) and free-floating blobs (data: URIs, PEM cert lines, minified bundles)"
  properties: [deterministic, stateless, concurrency-safe (RE2, compiled once), no-network, no-logging-of-content-or-secret]

reviews:
  G3_review_auditor:
    decision: REVISE
    findings_fixed:
      - "Finding 1 (MEDIUM): redactToolInput picked first PRESENT content key vs fileText's first NON-EMPTY → degenerate {content:'',new_string:secret} left the secret in new_string + corrupted the call. FIXED: aligned key selection with fileText (skip a content key that is not a non-empty string). Test: TestApplyInputRedaction_NonEmptyFieldSelection + live E2E T2."
      - "Finding 2 (MINOR): on-by-default entropy could corrupt legitimate base64 blobs. FIXED: entropy gated on assignment context; '=' dropped from token charset so KEY=<base64> exposes the value. Test: TestRedact_EntropyBlobsNotCorrupted + live E2E T3."
    verified_correct: [structural-guarantee, no-loosening, INV-2 confinement, fail-open/verdict-independence, RE2-no-backtracking, concurrency, placeholder-not-re-redacted, carrier-rename-clean]
  G_SEC_security_reviewer:
    decision: APPROVE
    findings_fixed:
      - "LOW-1 (= G3 Finding 1): FIXED."
      - "INFO-2: audit redacted:true could over-report → FIXED (recordEnforcement keys `redacted` on the actual redactToolInput result)."
    findings_noted:
      - "INFO-1: a large expandable body can exceed the 1MiB response cap → fail-open miss (documented follow-up; no leak/wedge)."
    invariants_confirmed: [INV-2-egress-only, INV-1-no-secret-logged, structural-integrity-airtight, INV-3b-fail-open-bounded, no-ReDoS]

validation:
  build_vet_test: "sidecar + adapters/claude-code (-race) + cli GREEN; conformance C1-C11 GREEN"
  live_e2e:
    - "Write with AWS+GitHub secrets → updatedInput content redacted (${OPENBOX_REDACTED_AWS_KEY}/${OPENBOX_REDACTED_GITHUB_TOKEN}), file_path preserved, NO permissionDecision; audit {redacted:true,redaction_categories:[aws_key,github_token]}; secret never egressed/persisted."
    - "OPENBOX_SECRET_DETECTION=0 → empty stdout (E6-S3 identical)."
    - "Finding-1 degenerate content:''+new_string secret → redacted in new_string (secret gone)."
    - "Finding-2 PEM CERTIFICATE blob → not rewritten (proceed)."

follow_ups:
  - "MultiEdit edits[].new_string[] under-capture (fileText single-field; INV-2-safe — nothing extra to redact)."
  - "Larger-body scanning past maxRedactBody(512KiB)/1MiB request cap (fail-open miss today)."
  - "[EXT-guardrail-redaction]: a redaction-capable guardrail evaluator is the OTHER RedactedContent producer (server-side Guardrail API), still deferred."

