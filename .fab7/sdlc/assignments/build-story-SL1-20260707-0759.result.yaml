        5 test groups PASS. TestValidSamples: one well-formed sample of EACH of the 7
        lifecycle types validates (AC). TestInvalidSamplesRejected + TestUnknownTypeRejected:
        malformed/unknown type rejected (AC a). TestContentGate: content rejected when
        content-capture disabled, accepted when enabled (AC b, INV-2). TestSchemaEnumMatchesContract:
