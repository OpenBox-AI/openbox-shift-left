story: STORY-E6-S11
title: "Tier-3 findings loop (surface async guardrail/drift findings into the session)"
epic: E6
status: done          # built + validations + live E2E; BOTH reviews ran (G3 APPROVE, G_SEC APPROVE-WITH-CONDITIONS) + all folded-in findings re-validated; brian G3 sign-off 2026-07-15; committed to main (no push, no signature per convention)
built_at: "2026-07-15"
builder: build-engineer

summary: >
  Closes the Tier-3 "findings-back-to-dev" gap (design §7 T3): async governance
  findings (guardrail categories, goal-drift, risk, would-block, constraints) that
  land only in the dashboard today are surfaced back INTO the developer's session as
  a CONTENT-FREE summary. Built as a pure CONSUMER (the "reuse, don't rebuild"
  principle): NO new sink/producer/endpoint — it tails the existing SL-9
  advisories.jsonl (which already records every notable Evaluation content-free on
  the flush path) from a byte-offset CURSOR and, on UserPromptSubmit + PostToolUse,
  emits ONE hook JSON object carrying hookSpecificOutput.additionalContext (-> the
  model) + systemMessage (-> the user). New default-OFF opt-in OPENBOX_FINDINGS ->
  byte-identical to Phase-1 when off. Orthogonal to enforce (advisory feedback in
  both observe and enforce sessions). NO core/backend surface.

design_cruxes:
  - "Reuse, don't rebuild: E6-S11 is a CONSUMER of the existing advisories.jsonl (SL-9). No new sink/table/endpoint (which would need an ADR per CLAUDE.md); the producer (Advisory.Record) is unchanged except an additive content-free drift field. The whole story is adapter + client-parse only."
  - "CC-mechanics recon overrides the design's named surface: CC DISCARDS SessionEnd hook output (additionalContext/systemMessage/decision all ignored; stdout->debug log). So the design's 'SessionEnd summary' is undeliverable. Delivered instead at the NEXT turn: UserPromptSubmit (turn-start, the summary's home) + PostToolUse (near-real-time). SessionStart deliberately avoided — E6-S8 staleness already owns the single SessionStart stdout JSON, and a command hook may emit only ONE object."
  - "Async = async DELIVERY, not async computation: /evaluate findings are FULLY SYNCHRONOUS in core (OPA + Guardrails + AGE inline; no separate findings endpoint). Findings materialize only when the spool is flushed (SessionEnd), so the loop is inherently deferred-by-one-flush; the cursor makes that at-most-once."
  - "Content-free by construction (INV-2): the summary is built ONLY from advisoryRecord category/count/verdict-label/numeric fields + reasonTypeCategories (the guardrail TYPE, never Field/Reason free text). Drift free text is dropped at PARSE time — ageWire/DriftResult structurally omit reason/final_trust_score/span_results, so the decoder never binds them. The surface is LOCAL stdout to the dev's own CC session (not a network sink), and the cursor holds a byte offset only (0600)."
  - "Never blocks (INV-3): writeFindingsOutput emits ONLY additionalContext + systemMessage — never a decision/permissionDecision/blocking field. Every fault (missing/corrupt file, unwritable cursor, oversized file, malformed record, panic) is swallowed; the hook exits 0. With findings OFF the path is inert."
  - "Drift is a content-free client enrichment: core NEVER populates the top-level behavioral_violations/trust_tier/alignment_score the reference SDK models (recon) — drift lives under age_result, which client/verdict.go did not parse. Added DriftResult{GoalDrifted, GoalAlignmentChecked, ViolationsCount} + Detected() (requires the classifier actually ran) + Evaluation.Drift + IsAdvisory drift clause + advisoryRecord.DriftDetected/DriftViolations. Forward-compat (absent age_result -> nil -> byte-identical parse)."

cross_repo_recon:
  - repo: "../openbox-temporal-sdk-python (Explore)"
    findings:
      - "NO findings loop exists: behavioral_violations/alignment_score/risk_score/constraints are parsed into GovernanceVerdictResponse (types.py:126-143) but NEVER surfaced, logged, or delivered — only enforce_verdict (verdict + guardrail validation_passed) and input/output redaction consume the response. => E6-S11 is a genuine shift-left ADDITION (like E6-S9 secret detection), not a port."
      - "Guardrail reason shape = {type, field, reason} (types.py:117-119); behavioral_violations is free-text List[str] (drift) => a content-safe surface must project to COUNTS/CATEGORIES, never the free text."
  - repo: "../openbox-core + ../openbox-backend (Explore)"
    findings:
      - "/evaluate findings are FULLY SYNCHRONOUS: OPA + Guardrails + AGE (goal-drift/alignment via LlamaFirewall) run inline as concurrent activities and return in the same response (governance_workflow.go:421-651). NO separate findings/drift report endpoint (only /governance/approval, an approval-status poll with no findings). => reuse the already-parsed Evaluation from the flush path."
      - "WIRE-SHAPE CORRECTION (load-bearing): core NEVER populates top-level behavioral_violations/trust_tier/alignment_score (grep found no assignment). Drift lives under age_result (AGEResult{goal_drifted, violations_count, goal_alignment_checked}, content/governance.go:523-535); trust_tier is in metadata. => drift needs the age_result parse; guardrail/verdict/risk need zero client change."
      - "Backend re-surfaces the SAME findings in the dashboard from Postgres (guardrails_evaluations / age_evaluations tables via /agent/:id/guardrails/violation-logs, /violations, /logs/drift) — so the summary correctly points the dev to the dashboard for detail."

new_surface:
  file_new: adapters/claude-code/findings.go
  symbols:
    - "surfaceFindings(hook, stdout, logger): gated caller reads the cursor, stat-guards advisories.jsonl (size<=offset -> return; size<offset -> reset to 0), reads the delta, consumes COMPLETE lines only (complete=data[:lastNL+1]; fragment re-read next time), summarizes, writes the hook JSON, advances the cursor. Best-effort; swallows every error; nil stdout no-op; top-level recover."
    - "summarizeFindings(delta) / findingsSummary.render(): aggregate counts/sets across the delta -> one content-free line (N finding(s); would-block [verdicts] | verdicts [..]; guardrails [cats]; goal-drift on N (M violation(s)); K constraint(s); max risk R). Sorted sets for determinism; ALLOW excluded from the verdict set."
    - "sanitizeCategory / joinCapped + maxCategoryLen=40, maxCategoriesShown=12 (G_SEC LOW-1/INFO-1): strip control chars + cap length/cardinality of the remote-sourced guardrail category BEFORE it is injected into the model context."
    - "writeFindingsOutput(stdout, hook, summary): emits {hookSpecificOutput:{hookEventName, additionalContext}, systemMessage} — no blocking field (INV-3)."
    - "readCursor / advanceCursor (atomic temp+rename) / readFrom (seek + LimitReader maxFindingsDelta=4MiB)."
  file_changed:
    - "client/verdict.go: DriftResult + Detected() + ageWire + Evaluation.Drift + parseEvaluation age_result branch + IsAdvisory drift clause (all additive/forward-compat, content-free)."
    - "adapters/claude-code/advisory.go: advisoryRecord.DriftDetected/DriftViolations (content-free) + populate in Record + drift in the stderr summary."
    - "adapters/claude-code/creds.go: ResolveFindings (default OFF) + ResolveFindingsCursor + DevConfig.Findings (*bool) + OPENBOX_FINDINGS / OPENBOX_FINDINGS_CURSOR."
    - "adapters/claude-code/hookrun.go: surfaceFindings wired on PostToolUse + UserPromptSubmit, gated ResolveFindings() (2 call sites, one guarded block)."

reviews:
  G3_review_auditor:
    reviewer: Reva
    verdict: APPROVE
    notes: >
      All ACs AC-1..AC-7 traced to implementing lines; 2 decisive probes passed
      (partial-trailing-line cursor advance never skips/re-surfaces; flag guard is
      load-bearing -> OFF = zero bytes). Byte-offset math correct. Scope clean (no
      core/backend, no new sink). obs-3 (constraint count not surfaced) FOLDED IN;
      obs-1 (theoretical partial-write) + obs-2 (counts every parseable record)
      negligible / no practical effect.
  G_SEC_security_reviewer:
    reviewer: Sam
    verdict: APPROVE-WITH-CONDITIONS
    notes: >
      No Critical/High/Medium. INV-1/INV-2/INV-3 + NFR-2 all hold (full field-by-field
      INV-2 trace of stdout + cursor). LOW-1 (guardrail type is remote-sourced text,
      first injected into model context here) + INFO-1 (unbounded cardinality) FOLDED
      IN via sanitizeCategory + joinCapped + length/cardinality caps. INFO-2 (env-path
      symlink/TOCTOU on the dev's own machine, no privilege boundary) + INFO-3
      (documented no-lock at-most-once race) accepted, no change.
    carry_forward:
      - "G_SEC LOW-1 follow-up: consider a server-side/local ALLOW-LIST of guardrail categories before any model-context injection (now length/cardinality-bounded + control-char-stripped, but not allow-listed). Out of scope for E6-S11."

validation:
  commands:
    - "adapters/claude-code: go build ./... && go vet ./... && go test -race ./...  => GREEN"
    - "client: go build ./... && go vet ./... && go test -race ./...  => GREEN"
    - "sidecar: go build ./... && go vet ./... && go test -race ./...  => GREEN"
    - "cli: go build ./... && go vet ./... && go test -race ./...  => GREEN"
    - "gofmt -l (all changed files) => clean"
  live_e2e:
    binary: "real openbox (built from cli/cmd/openbox)"
    cases:
      - "findings ON, PostToolUse: content-free single-JSON summary (would-block [BLOCK]; guardrails [secret]; goal-drift on 1 (2 violation(s)); max risk 0.91); seeded fake secret AKIAsecretVALUE123 + reason free-text ABSENT; no decision/permissionDecision; cursor advanced to EOF."
      - "at-most-once: second call with no new records -> empty stdout."
      - "new record appended -> only the delta surfaces (verdicts [REQUIRE_APPROVAL])."
      - "findings OFF (fresh cursor, pending records) -> empty stdout (byte-identical)."
      - "control-char/over-long guardrail category -> sanitized to 'pii', length-bounded; constraint count '2 constraint(s)' surfaced; content-free."

invariants:
  INV-1: "no secret I/O on the surface path; ResolveFindings/ResolveFindingsCursor are config+env reads; no secret in any log line."
  INV-2: "categories/counts/verdict-labels/numeric only reach stdout; drift free-text structurally undecodable (ageWire/DriftResult); cursor = byte offset (0600). Surface is LOCAL stdout (not egress)."
  INV-3: "emits only additionalContext/systemMessage, never a blocking field; every fault swallowed; inert when findings OFF."
  NFR-2: "PostToolUse stat-guarded — no advisory-body read when size<=offset."

open_decisions_for_brian:
  - "OD-FINDINGS-1: surface to model (additionalContext) AND user (systemMessage), or user-only? RECOMMEND both. Confirm."
  - "OD-FINDINGS-2: drift folded into IsAdvisory changes the always-on SL-9 sink to record drift-only-ALLOWs (content-free count), independent of the findings flag. RECOMMEND accept (drift IS advisory-worthy). Confirm or scope behind the flag."
  - "OD-FINDINGS-3: v1 is a GLOBAL 'recent findings' summary (advisory record has no cwd). Per-project scoping needs cwd on the record. RECOMMEND defer. Confirm."

