summary: >
  Built STORY-E6-S4 — the guardrail redaction-apply leg. Ports the reference SDK's
  _apply_input_redaction (openbox-temporal-sdk-python activity_interceptor.py:441-478) to Claude
  Code's hookSpecificOutput.updatedInput. On the enforce PreToolUse gate, on the PROCEED path (after
  mapVerdict yields no deny/ask — exactly as the SDK applies redaction only after enforce_verdict
  returns without raising), when content capture is ON (OD4 opt-in, DECIDED 2026-07-07) AND the
  obtained sidecar.Decision carries a RedactedInput that is a NON-EMPTY JSON object DIFFERING from the
  original tool_input, applyDecision emits updatedInput (full tool_input replacement) ALONE — no
  permissionDecision — so Claude Code's own permission flow still applies. buildDecisionRequest
  populates DecisionRequest.Content (file body, via HookEvent.fileText()) ONLY when content capture is
  on, LOCAL-socket-only. Double-gated + inert-by-default: with content capture OFF (the OD4 default)
  both legs are no-ops -> byte-identical to E6-S3. Validation GREEN (adapter/sidecar/cli
  build/vet/test -race) + live E2E vs the real openbox binary + a fake redaction sidecar.
scope_boundary_confirmed_by_recon: >
  Per the user directive ("always use explore for cross-repo reference"), a read-only Explore of
  openbox-temporal-sdk-python recovered the reference redaction this story ports. Findings:
  (1) _apply_input_redaction (activity_interceptor.py:441-478) reads verdict.guardrails_result.redacted_input,
  GATED on guardrails_result.input_type == "activity_input"; a dict is normalized to a one-element
  list; a non-dict/non-list value is WARNED + SKIPPED (original returned unchanged); it replaces each
  positional arg and re-serializes. (2) It is applied STRICTLY AFTER enforce_verdict returns without
  raising (activity_interceptor.py:258-262) — the ALLOW/CONSTRAIN proceed path, immediately before the
  activity runs; NOT on a HALT/BLOCK/guardrail-fail/HITL-pending path. (3) The carrier is redacted_input
  (Any, JSON-decoded) on GuardrailsCheckResult (types.py:104-123); disambiguated by input_type; there is
  NO severity field on the guardrail type. (4) It is NOT gated on any content_capture flag in the SDK
  (the SDK always sends the full activity_input to its gate) — in shift-left, tool content reaches the
  sidecar ONLY under the OD4 content-capture opt-in, so redaction is naturally gated on it here.
  (5) CC contract (code.claude.com/docs/en/hooks.md, confirmed via claude-code-guide): updatedInput sits
  under hookSpecificOutput alongside permissionDecision; it is a FULL replacement of tool_input (not a
  merge); may be emitted with or without permissionDecision; requires exit 0. The Go port mirrors
  (1)-(2) exactly (proceed-path only; skip non-object/null/empty/equal), maps redacted_input -> the CC
  updatedInput object, and adds the shift-left content-capture gate (4).
key_design_decisions:
  local_carrier_not_evaluation_INV2: >
    THE INV-2 crux. The redacted tool_input is carried on the LOCAL sidecar.DecisionResponse.RedactedInput
    -> sidecar.Decision.RedactedInput (json.RawMessage), NOT on client.Evaluation. client.Evaluation flows
    into the advisory sink (SL-9), the enforcement audit (E6-S2, enforcements.jsonl), and core /evaluate
    egress — putting redacted content there would risk leaking it into all three. On the sidecar Decision
    it stays confined to the local Unix socket <-> hook <-> CC stdout channel (same machine, never
    egressed/logged, never in either JSONL sink). client.GuardrailResult is UNCHANGED (still drops
    redacted_input, preserving SL-9's INV-2 decision byte-for-byte). G_SEC traced this end-to-end and
    confirmed the leak is structurally impossible, not merely untested.
  proceed_path_only_faithful: >
    applyInputRedaction is invoked only when mapVerdict returns "" (proceed). On deny the tool never
    runs; on ask the SDK raises pending BEFORE redaction, so neither rewrites (ask-path redaction is a
    deferred consideration). This mirrors the SDK, which applies redaction only after enforce_verdict
    returns without raising. Emitted ALONE (no permissionDecision) so CC's own permission flow applies.
  content_capture_gate_inert_by_default: >
    Both legs (request Content + applied updatedInput) are gated on ResolveContentCapture() (config
    content_capture then OPENBOX_CONTENT_CAPTURE env, env wins, fail-safe default false). With it OFF
    (the OD4 default) Content stays nil and applyInputRedaction returns nil -> applyDecision writes
    nothing on a proceed verdict -> byte-identical to E6-S3. This is the load-bearing safety property.
  skip_null_empty_nonobject_equal: >
    applyInputRedaction returns nil (no rewrite) unless RedactedInput is a NON-EMPTY JSON object
    differing from the original: `json.Unmarshal(red,&obj); err != nil || len(obj) == 0` rejects an
    array/scalar/garbage AND a JSON null (unmarshals to a nil map with no error) AND an empty {} — either
    of which would rewrite tool_input to null/empty and corrupt the call (the story stop condition + the
    SDK's warn-and-skip). jsonEqual (canonical re-marshal, key-order/whitespace-insensitive) suppresses
    an equal rewrite. Tighten-only: permissionDecision:allow is structurally unreachable (mapVerdict
    never returns allow); updatedInput only ever strips content.
  ext_guardrail_redaction_flag: >
    [EXT-guardrail-redaction] (honest, like [EXT-opa-bundle] from E6-S5). The Phase-1 metadata-only
    bundleEvaluator produces NO redacted_input (S4 §4: reuse the SERVER-side Guardrail API — PII/NSFW/
    regex/Qwen — do NOT build a new model; but the enforce decision is LOCAL per spike S2, and the local
    bundle has no guardrail engine). So the apply is a faithful, fully-tested SEAM that is INERT in the
    field until a redaction-capable evaluator (embed the Guardrail API, or a content-on /evaluate mirror
    returning redacted_input) lands — out of adapter scope. The protocol-shape reconciliation
    (DecisionRequest.Content{Prompt,Output,FileText} vs a redacted tool_input OBJECT) belongs with that
    engine work.
