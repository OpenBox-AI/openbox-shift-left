reviews:
  g3_review_auditor:
    verdict: "APPROVE-WITH-MINOR"
    evidence: >
      review_auditor (blind-diff + acceptance audit) 2026-07-14 = APPROVE-WITH-MINOR. Verified AC-1..AC-7
      against code + tests + the E6-S1/E6-S2 seams: AC-1 proceed-path-only apply faithful (redaction
      reachable only in the decision=="" branch); AC-2 content-capture gate airtight on both legs
      (capture-off byte-identical to E6-S3); AC-3 never on deny/ask, allow structurally unreachable;
      AC-4 carrier LOCAL-only (recordEnforcement copies neither RedactedInput nor ToolInput — leak
      structurally impossible); AC-5 request Content sidecar-only; AC-7 [EXT-guardrail-redaction]
      honestly flagged, no AC contradicted by the inert-in-field state. jsonEqual/canonicalJSON correct;
      tighten-only preserved (omitempty on PermissionDecision safe). SHOULD-FIX 1 (AC-6 gap): a JSON
      `null` RedactedInput unmarshals into a nil map with NO error -> slipped the "is a JSON object" gate
      -> would emit updatedInput:null, corrupting the tool call (SDK-faithfulness deviation + trips the
      story stop condition). FIXED IN-CODE: applyInputRedaction now guards `err != nil || len(obj) == 0`
      (covers both null and empty {}); null/{} cases added to TestApplyInputRedaction (previously vacuous).
      NITs (empty-object folded into the fix; optional advisory/evaluate unit assertion; silent-skip vs
      warn correct for the hot path) — no further action. Re-validated -race GREEN + happy-path E2E clean.
  g_sec_security_reviewer:
    verdict: "APPROVE"
    evidence: >
      Sam (security_reviewer) 2026-07-14 = APPROVE. All five load-bearing invariants hold under trace.
      INV-2 no-egress: buildDecisionRequest is the only writer of req.Content (consumed only by Decide ->
      Unix socket; the observe Mapper reads only filePath, never fileText); recordEnforcement marshals a
      field-enumerated enforcementRecord (never dec.RedactedInput/ToolInput; guardrail data reduced to
      reasonTypeCategories); logEnforceDecision is a fixed Printf; client.Evaluation/GuardrailResult
      untouched; the sidecar server never logs req.Content. Content-capture gate airtight (&&
      short-circuit + early nil return; ResolveContentCapture precedence fails safe; capture-off
      byte-identical to E6-S3). No-corruption/no-loosen: rejects array/scalar/invalid/null/empty/equal;
      permissionDecision:allow structurally unreachable; updatedInput json.Marshal-encoded (no injection).
      INV-3b: no new I/O, fail-open preserved. INV-1: no secret I/O. [EXT-guardrail-redaction] is a
      transparent, honestly-flagged trust posture (same as [EXT-opa-bundle]); carrying the gated file body
      to the local 0600 per-user socket is more conservative than the always-on command axis.
  info_carry_forward_to_engine_story: >
    Three G_SEC INFO findings, none blocking, all belonging to the future redaction-engine story
    ([EXT-guardrail-redaction] / E6-S7 conformance) — DO NOT fix in E6-S4 (adapter-only, and the source
    is inert): INFO-1 — the adapter applies updatedInput verbatim, validating shape (non-empty object,
    differs) but not that the rewrite only STRIPS content; a compromised/buggy engine could rewrite
    structural locators (file_path/command), a redirect not merely a leak. Acceptable now (same trust
    boundary as the sidecar's existing deny/allow authority), but the engine work should constrain
    updatedInput to content fields (diff redacted-vs-original keys; reject changed structural locators).
    INFO-2 — the file body + RedactedInput are uncapped and canonicalized twice per proceed+capture-on
    call (local CPU only; the server's io.LimitReader bounds the request); add a size guard with the
    engine. INFO-3 — fileText() under-captures MultiEdit's nested edits[].new_string (the INV-2-safe
    direction; a completeness item for the engine).
