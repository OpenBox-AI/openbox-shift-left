revision_2026-07-09-pm: >
  Post-build, brian flagged that the session-discovery design (env-var only) could not handle a
  developer running MULTIPLE CONCURRENT sessions, and asked to (1) redesign and (2) do the wiring.
  Verified via the Claude Code hooks docs (claude-code-guide agent) that CC exposes NO session-id
  env var and NO pid to the git subprocess, and process ancestry is undocumented — so neither env
  inheritance nor pid-walking is a sound basis. REDESIGN: a worktree-scoped per-session LIVENESS
  REGISTRY. The adapter writes {session_id, cwd, updated_at} (structural-only, INV-2) on each hook;
  the prepare-commit-msg resolver attributes the commit to the most-recently-updated session whose
  cwd is within the commit's git worktree. Parallel-safe: distinct worktrees never collide (exact);
  same-worktree resolves by recency (the committing session refreshed on its PreToolUse ms before
  the commit); stale/crashed records TTL-expire (OPENBOX_SESSION_TTL, default 8h); OPENBOX_SESSION
  env stays as an explicit override. WIRING (SL5-WIRE-1, adapter side): cmd/openbox-cc-hook now
  writes/refreshes/removes the registry and offers OPT-IN ambient prepare-commit-msg install
  (OPENBOX_INSTALL_GIT_HOOK, OFF by default — it modifies .git/hooks; idempotent, foreign-safe).
  Proven end-to-end incl. a two-repo parallel case. 109 subtests green under -race across both
  modules (was 44 in the git module alone). Remaining: OD17 binary unification (= SL4-WIRE-2) + a
  dev-init flag + pilot rollout posture (OD-SL5-D).
summary: >
  Built the provider-INDEPENDENT commit-trailer write side (STORY-SL-5): a prepare-commit-msg
  path that binds a git commit to its OpenBox session(s) via an `OpenBox-Session:` commit-message
  trailer, exactly as spike S3 (R1-R6) prescribes. Trailer is the single authoritative carrier
  (copied by rebase/cherry-pick/amend, aggregated by squash, honored like Co-Authored-By by GitHub);
  git notes are an optional non-authoritative local mirror (refs/notes/openbox). Stamping uses
  `git interpret-trailers --if-exists=addIfDifferent --if-missing=add` so it is idempotent under
  re-fire/`--amend` (no duplicate) and additive for distinct sessions (multi-session fan-in = multiple
  lines, S3 R3). New stdlib-only Go module adapters/common/git/ (OD17-consistent) + a
  cmd/openbox-git-hook entrypoint + an idempotent hook installer that refuses to clobber a foreign
  hook. 44 subtests green under -race, including the full S3 rewrite matrix driven against REAL git
  (commit/amend/plain-rebase/squash/fixup) and a real compiled-binary fail-open assertion. The
  durable, authoritative binding is deliberately NOT created here — it is resolved server-side at the
  real pushed SHA by SL-6 (S3 R7); this write side is best-effort because git hooks are local and
  never travel (S3 §1). Human gates remain: G1_READY + G3_REVIEW (brian).
finding_of_note: >
  SQUASH HEALING (a correctness gap beyond S3, empirically confirmed with git 2.53.0). S3 R7 resolves
  sessions via `%(trailers)`, which parses ONLY the trailing trailer block. A squash concatenates each
  source message, so an earlier commit's `OpenBox-Session:` line lands MID-BODY, where `%(trailers)`
  (and `interpret-trailers --parse`) DO NOT see it — naive stamping would silently drop squashed-in
  sessions, breaking the very multi-session fan-in the story requires. Fix: before stamping,
  StampMessageFile HARVESTS every `OpenBox-Session:` line from the whole message and re-asserts each
  into the trailing block (addIfDifferent → no duplication). Fan-in is then resolvable via `%(trailers)`
  regardless of who ran the squash — even a human with no session of their own heals the agent sessions
  they squashed together. Proven by TestStamp_HealsSquashConcatenation (unit, shows the pre-heal parser
  sees only the last block) + TestE2E_SquashFansInAllSessions (real rebase -i squash with NO session in
  scope → both sessions resolve). Consequence for SL-6: the healed trailing block makes S3 R7's
  `%(trailers)` resolve correct as written; SL-6 may additionally full-body-scan as belt-and-suspenders
  for commits made before the hook was installed (flag SL6-SCAN).
