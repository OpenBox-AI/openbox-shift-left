    reviewer: fab7-sdlc-review-auditor (blind diff)
    verdict: "CORRECT — no must-fix, no should-fix; 3 nits"
    nits_resolved:
      - "stale doc ref classificationHints -> hookSpanShape (payload.go buildMetadata comment + client/README.md)"
      - "added TestLifecycle_RequiredFieldsOnWire: raw-JSON assertion that
         workflow_id/run_id/workflow_type (+ signal_name for signals) are
         physically on the wire (stronger than the decoded-struct check)"
    nits_accepted:
      - "lifecycleWireType default branch untested — defensive/unreachable given the current EventType set; documented."
  security: "No G_SEC gate on E7-S5 (ledger). Observe/egress-shape change, no new
             content sink; INV-2/INV-1 confirmed by the correctness review."

gates:
