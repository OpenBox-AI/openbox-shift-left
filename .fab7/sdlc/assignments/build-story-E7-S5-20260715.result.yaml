story: STORY-E7-S5
title: "shift-left: lifecycle -> Workflow* / SignalReceived (session=workflow; PromptSubmitted/CommitCreated/Deploy -> Signal with lineage in metadata)"
command: build-story
date: "2026-07-15"
epic: E7
status: built-reviewed-pending-g3
repo: openbox-shift-left  # not a sibling; shift-left-owned client/ module

summary: >
  Re-expressed the developer-runtime client's NON-tool events onto the base
  OpenBox SDK lifecycle wire model (ADR-0004 option B-core: session=workflow;
  commit/deploy=signal). SessionStarted->WorkflowStarted,
  SessionEnded->WorkflowCompleted, and PromptSubmitted/CommitCreated/Deploy->
  SignalReceived(signal_name). Completes the E7 event->wire migration begun by
  E7-S3 (builder) + E7-S4 (tool hook path); every dev event now maps to a stock
  accept-listed base wire type, so the SL-13 EXT-core accept-list is retired
  (INV-8) once E7-S2's classifier + accept-list retirement land upstream.

cross_repo_reference:
  - "openbox-sdk-python (READ-ONLY): confirmed the exact lifecycle/signal wire
     shape via Explore. contracts/events.py to_payload_dict + factories
     (workflow_started/workflow_completed/signal_received); validation/
     event_rules.go _REQUIRED_WORKFLOW_FIELDS=(workflow_id,run_id,workflow_type)
     for BOTH workflow AND signal events, plus a signal-only signal_name check
     (ENVELOPE_MISSING_FIELDS). Base source is 'workflow-telemetry' (free-form;
     shift-left keeps 'developer-runtime')."
  - "openbox-core (READ-ONLY): workflow_type + signal_name are read into
     DEDICATED columns (storage_event.go buildGovernanceEventSetter /
     setOptionalPayloadFields). WorkflowStarted creates the session row
     (SessionStatusPending), WorkflowCompleted closes it
     (storage_session.go handleSessionCreate/handleSessionTerminal);
     SignalReceived falls to handleSessionLookup (backfill-safe). NO commit_sha/
     deploy_id columns exist -> lineage is pass-through metadata only."

deliverable:
  write_scope_planned:
    - client/payload.go
    - "adapters/claude-code/mapper.go ; adapters/common/git (lineage keys into Signal metadata)"
    - "*_test.go + live E2E"
  write_scope_actual:
    - "client/payload.go  # MODIFIED: lifecycle event->wire mapping"
    - "client/payload_lifecycle_test.go  # NEW: E7-S5 wire-shape + lineage suite (8 tests)"
    - "client/README.md  # nit: stale classificationHints doc ref -> hookSpanShape"
  write_scope_refinement: >
    adapters/claude-code/mapper.go and adapters/common/git were NOT changed
    (same finding as E7-S4). The event->wire mapping is provider-agnostic and
    lives in the shared client/ layer (CLAUDE.md core/adapter split). No code in
    the repo emits CommitCreated/Deploy DevEvents today (SL-6 commit attribution
    is server-side via git trailers/notes, not client DevEvents), and
    buildMetadata already passes ev.Metadata through, so commit/deploy lineage
    (commit_sha/deploy_id/deploy_did/repo/branch/environment) survives into the
    Signal metadata with no adapter change. The client now MAPS these types
    correctly for whenever a producer emits them.

  changes:
    - "governanceEventPayload gains WorkflowType (json:workflow_type,omitempty)
       and SignalName (json:signal_name,omitempty). Both omitempty; neither is
       set on the ActivityStarted hook path (which builds its own map), so hook
       payloads stay byte-identical to E7-S4."
    - "buildPayload dispatch unchanged for ToolCall/ToolResult (->buildHookPayload);
       the non-tool path now calls buildLifecyclePayload (was buildLegacyPayload)."
    - "buildLifecyclePayload: sets event_type via lifecycleWireType, always sets
       WorkflowType=workflowType (const 'developer-session'), sets SignalName for
       signals, and is SPAN-LESS (base contract rejects span-bearing non-hook
       lifecycle events; no lifecycle DevEvent sets ev.Span)."
    - "lifecycleWireType(EventType)->(wireType, signalName): the 5-case mapping +
       a defensive default (raw type, no signal) for a hypothetical future type."
    - "workflowType const = 'developer-session' (NOT the provider name — that
       rides in metadata) so a session's WorkflowStarted, its SignalReceived
       events, and WorkflowCompleted share one (workflow_id,run_id,workflow_type)
       identity and Core resolves them to one session row."
    - "Dead-code removal: buildSpan, classificationHints, randomID, strPtr,
       int64Ptr (the legacy single-span builder the lifecycle path used) + the
       now-unused crypto/rand import. fileSpanName KEPT (used by hookSpanShape).
       spanData struct KEPT as the decode-side view tests read payloads back
       through. Net -115/+83 lines in payload.go."

invariants:
  INV-8: "session=workflow uses stock Core lifecycle; all 5 non-tool events map
          to accept-listed base wire types (Workflow*/SignalReceived) -> no
          dev-type accept-list needed. Additive struct fields, no wire break."
  INV-2: "lifecycle path is span-less and routes only through buildMetadata,
          which carries no content/bodies; lineage keys are identifier-class
          (commit_sha/deploy_id/repo/...), never prompt/output/file content."
  INV-1: "no secrets on this path (obx_ key / Ed25519 seed never reach payload)."
  INV-3: "enforce path (enforce.go/sidecar) UNTOUCHED — observe/egress-shape only."

validation:
  - "cd client && go build ./... && go vet ./... && gofmt -l  -> GREEN/clean"
  - "cd client && go test -race ./...  -> ok (8 new lifecycle tests + all prior)"
  - "cd adapters/claude-code && go build ./... && go test -race ./...  -> GREEN
     (incl. cmd/openbox-cc-hook + E6 enforce conformance C1-C9)"
  - "adapters/common/git (+ cmd/openbox-git-hook) go test  -> GREEN"
  live_e2e_deferred: >
    Live stock-core E2E (WorkflowStarted creates / WorkflowCompleted closes a
    session row; commit/deploy Signal carries lineage) is deferred to E7-S6
    (which also needs E7-S2's classifier live), matching E7-S4's deferral. The
    E7-S0 spike already confirmed WorkflowStarted/WorkflowCompleted/
    SignalReceived are accepted HTTP 200 by stock core and that SignalReceived
    carries commit/deploy lineage keys usably.

review:
