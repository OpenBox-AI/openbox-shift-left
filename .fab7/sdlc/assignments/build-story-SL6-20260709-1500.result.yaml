summary: >
  Built the server-side, push-time DEPLOY-LINEAGE resolver (STORY-SL-6): the read/resolve
  counterpart to SL-5's write side. At push it reads the `OpenBox-Session:` trailers SL-5 stamped,
  resolves them SERVER-SIDE against the REAL pushed SHA (never a pre-push SHA — S3 §1/INV-6), dedups
  to a session SET, binds each id to the authenticated pusher (SL5-SEC-1), and emits a `Deploy`
  governance event through the shared SL-3 client with the resolved set carried in `metadata` (the
  S6 §4 metadata-JSONB stopgap). New stdlib-only Go module actions/openbox-git-action/ importing
  client (SL-3) + adapters/common/git (SL-5) via replace directives; 30 tests green under -race + go
  vet clean, plus real-binary dry-run proof.
write_scope: ["actions/openbox-git-action/"]
files:
  - "doc.go — package contract: resolution model, scope walking, SL6-SCAN, SL5-SEC-1, EXT-core reality"
  - "git.go — argv-only, size-bounded (runLimited/1MiB, -n rev-list) server-side git reader; --end-of-options on every rev"
  - "resolve.go — Resolver: verifyCommit(real pushed SHA) + scope(single|range|merge-reachable-originals) + 3-pass gatherClaims(trailer→body-scan→per-commit note) + verify(SL5-SEC-1) + classify(attributed|inferred|unattributed + reason); MaxCommits/MaxSessions caps disclosed"
  - "ownership.go — OwnershipVerifier interface + NoopVerifier (Phase-1 default) + verifierFunc; fail-closed-on-error contract"
  - "deploy.go — BuildDeployEvent: Resolution→client.DevEvent; run_id=stable deploy_id, workflow_id=repo, deploy_did=did:aip:deploy-<short>-<unix> (metadata), verified-only session_ids"
  - "action.go — Action.Run: fail-open (INV-3) orchestration; Emitter interface (client satisfies); resolve-error surfaced as precondition"
  - "cmd/openbox-git-action/main.go — CI entrypoint: --sha/--base/--repo/--environment/--dir/--dry-run + GITHUB_*/OPENBOX_* env; exit 0 fail-open / 2 precondition"
  - "README.md, *_test.go (harness/resolve/ownership/deploy/action/cmd)"
acceptance_criteria:
  - "Reads OpenBox-Session trailers server-side at the real pushed SHA, dedups to a session set — MET (verifyCommit + trailerBlockSessions via %(trailers); TestResolve_PlainTrailerCommit, _SquashFanInFromTrailerBlock, _ForcePushResolvesRealPushedSHA)."
  - "Emits a Deploy event via SL-3 carrying DID=git hash+timestamp + the session set in metadata — MET (BuildDeployEvent; deploy_did=did:aip:deploy-<short>-<unix>; TestDeployDID_MatchesContractSample, TestAction_EmitsResolvedDeploy)."
  - "No trailer → explicit unattributed/inferred marker with reason; merge attributes reachable originals; never silent wrong attribution (INV-6) — MET (classify + scope; TestResolve_HumanCommitUnattributed[no-trailer], _FixupDropIsUnattributedNotWrong, _TrailerStrippedRecoveredFromNoteMirror, _MergeAttributesReachableOriginals)."
  - "Validation: CI-simulated push incl. squash/fixup/force-push resolves the correct set or a reasoned marker — MET (30 tests, real git 2.53.0)."
sl5_sec_1_discharge: >
  The mandatory SL5-SEC-1 carry is discharged AS DESIGNED (structural, not by faith): every trailer
  value is a CLAIM (SessionClaim{Verified:false}) until an OwnershipVerifier confirms it belongs to a
  session owned by the AUTHENTICATED PUSHER — mirroring SL-3's DID cross-binding. Only then does the
  deploy become `attributed`; unverified/forged ids stay `inferred`, flagged verified=false, and are
  EXCLUDED from the flat verified_session_ids list. Fail-closed: a verifier lookup error never
  over-attributes. Phase-1 default NoopVerifier verifies nothing (ownership read API deferred —
  EXT-lineage/FR-7), so a well-formed deploy honestly resolves `inferred`. Wiring a real verifier
  promotes owned sessions with zero change to this package. Proven: TestOwnership_* incl. a forged
  co-resolved victim id staying verified=false while a genuinely-owned sibling attributes the deploy.
cross_repo_explore:
