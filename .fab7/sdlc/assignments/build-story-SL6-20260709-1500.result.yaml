  - "No deploy-DID primitive in core/backend (DID = did:aip:<uuidv5> per agent only) ⇒ deploy_did is a synthetic metadata label; the client SIGNING DID stays the agent's real did:aip:<uuid>."
  - "metadata is JSONB, arbitrary keys stored verbatim (core storage_event.go mergeMetadataJSON); avoided core's reserved metadata key names."
