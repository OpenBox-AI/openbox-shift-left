summary: >
  Built STORY-E6-S5 — the local enforcement decision sidecar, the resident daemon the
  enforce-mode PreToolUse hook (E6-S1) will call. New top-level Go module `sidecar/`
  (ADR-0003 home; own go.mod, replace -> ../client), wired into the ONE `openbox` binary as
  `openbox sidecar serve` (WIRE-2 preserved; no second artifact). It answers a DecisionRequest
  over a per-user Unix socket from an in-memory policy bundle with NO network I/O on the
  decision path (INV-3b) and returns the SAME client.Evaluation the Advisory tier records and
  E6-S2's apply will act on. The hook-side Client fails OPEN on every fault (socket absent,
  dial refused, timeout, hung server, malformed reply) within a hard ~50ms budget (OD9) — an
  infra failure never blocks the dev loop. Out-of-band bundle sync (mtime-gated FileBundleSource)
  refreshes policy off the hot path; sync failure keeps the current bundle; cold-start (no
  bundle) serves fail-open allow, never deny. The Phase-1 observe/advisory path
  (adapters/claude-code, `openbox hook`) is byte-untouched (INV-3 verbatim for them).
  Validation green: sidecar go build/vet/test -race all pass; cli build/vet/test green;
  live-verified against the real binary (BLOCK/ALLOW/malformed-survives/graceful-shutdown,
  socket 0600 + dir 0700). Both independent reviews ran: G3 APPROVE-with-minor-revisions,
  G_SEC REVISE (F1 medium + F2 low) — ALL review findings addressed in-code and re-validated.
  Remaining: brian G3_REVIEW sign-off + Sam G_SEC re-confirm.
stop_condition_triggered: true
stop_condition_detail: >
  STORY-E6-S5 stop-condition "If core exposes NO real OPA bundle/distributable policy the
  sidecar can load -> build the evaluator against a documented local policy representation
  seam (pluggable), ship the daemon + socket + fail-open contract, and record the
  bundle-format decision as a follow-up (mirror SL-15)." — TRIGGERED, as designed, on the
  cross-repo recon finding (below). This is the planned graceful path, not a failure.
key_design_decision: >
  WHAT THE LOCAL DECISION IS MADE FROM. The story/ADR-0003 call for a "local OPA-bundle
  evaluator" reusing "the existing OPA bundle distribution" (arch R3). Cross-repo Explore of
  openbox-core (read-only, per the user directive) found that claim is ASPIRATIONAL, not
  literal: (a) core does NOT embed OPA — it is an HTTP client to an EXTERNAL OPA server
  (OPA_URL, default localhost:8181; internal/services/opa.go:317,184-192); (b) there is NO
  bundle build/serve/sync anywhere in core — per-agent rego lives in Postgres as
  content.Policy.RegoCode and is loaded into the OPA server by an out-of-repo management
  plane (internal/content/governance.go:543-553); (c) the final verdict is OPA + an external
  Guardrails service + AGE (goal-alignment) aggregated max-severity — a local OPA-only
  evaluator can faithfully reproduce the per-agent POLICY decision (query
  data.org.<org>.policy_<id>, read result.result.decision+reason) but NOT Guardrails/AGE/risk.
  So there is no real bundle to pull and no test oracle to validate an embedded-OPA evaluator
  against. Per the E6-S5 stop-condition I built the pluggable SEAM instead: an Evaluator
  interface (evaluator.go) + BuildOPAInput shaped to core's buildOPAInput (opa.go:458-477) so
  a future embedded-OPA evaluator drops in unchanged, with a faithful LOCAL rule-bundle as the
  Phase-1 default whose DECISION CONTRACT matches core exactly — decision strings map to
  verdicts via core's own mapping (opa.go:257-270) and aggregate by core's HighestPriorityVerdict
  priority (governance.go:117-131). The real OPA-bundle distribution is flagged as the external
  follow-up [EXT-opa-bundle], exactly as SL-15 built the OwnershipVerifier seam and flagged
  EXT-lineage/FR-7. The SDK enforce cascade (verdict_handler.enforce_verdict, HALT>BLOCK>
  guardrails>REQUIRE_APPROVAL>CONSTRAIN>ALLOW) that acts on this verdict is E6-S2's job, not
  this story's — the sidecar PRODUCES the verdict the cascade consumes.
what_was_built:
  module: "sidecar/ (new top-level go.mod; github.com/openbox-ai/openbox-shift-left/sidecar)"
  files:
    - "doc.go — package overview + the one structural invariant (no network on the decision path)"
    - "protocol.go — DecisionRequest/DecisionResponse (local IPC contract, kept out of client/ per ADR-0001/0003), ProtocolVersion, decisionSource constants"
    - "input.go — BuildOPAInput: the core-faithful rego input document (the seam for a real OPA evaluator)"
    - "bundle.go — local rule Bundle + Load/Parse/validate (deny-by-default REJECTED; unknown decision rejected) + decisionToVerdict (core opa.go:257-270 mapping)"
    - "evaluator.go — Evaluator interface (seam) + bundleEvaluator: max-severity match aggregation (core HighestPriorityVerdict); RuleMatch predicate (tool/kind/mcp/attribute contains|equals), metadata-only"
    - "server.go — Unix-socket decision daemon: RWMutex hot-swap policy, bounded read (64KiB) + read deadline + panic-isolated per conn, bounded in-flight (128), cold-start fail-open, staleness flag; decide() is pure/no-I/O"
    - "client.go — the fail-open primitive E6-S1 imports: hard timeout (default 50ms), allow-on-every-fault, bounded reply read"
    - "socketpath.go — per-user DefaultSocketPath ($XDG_RUNTIME_DIR/openbox), prepareSocketDir (create+lock 0700 only where WE create; verifyOwnedAndPrivate refuses non-owned/loose dirs; stale-socket removal; non-socket collision refusal)"
    - "sync.go — out-of-band syncLoop (prime + interval) off the hot path; BundleSource seam; FileBundleSource with mtime change-detection; keeps current bundle on error"
    - "serve.go — Serve(ctx, Config): bind before first sync, chmod 0600 socket, graceful shutdown, socket cleanup; DefaultBundlePath"
    - "examples/policy-bundle.example.json — reference bundle (block rm-rf-root / shadow, constrain .env, require_approval github MCP)"
  cli_wiring:
    - "cli/cmd/openbox/main.go — runSidecar: `openbox sidecar serve [--socket|--bundle|--sync-interval|--freshness]`; SIGINT/SIGTERM->graceful; --help exits 0; usage updated"
    - "cli/go.mod — require + replace ../sidecar"
  not_touched:
    - "adapters/claude-code/ and the `openbox hook` path — observe/advisory (INV-3) byte-unchanged (AC #7); the enforce hook that DIALS the sidecar is E6-S1"
    - "client/ — imported (Evaluation/verdict types), not modified"
review_findings_addressed:
  G_SEC_F1_MEDIUM: "temp-dir socket fallback ($TMPDIR/openbox-<uid>) not ownership-verified -> local-user hijack (INV-1/INV-2). FIXED: verifyOwnedAndPrivate() refuses any socket dir not owned by this uid or granting group/other bits; applied on both the create and pre-existing branch. Live-verified: a 0775 dir is refused. Tests: RefusesGroupOrOtherAccessibleDir / AcceptsPrivateOwnedDir."
  G_SEC_F2_LOW: "SetDeadline error swallowed — the INV-3b bound depends on it. FIXED: on SetDeadline error the Client fails open immediately (client.go) instead of proceeding with an unbounded read."
  G_SEC_F3_LOW: "no concurrency cap on accept loop (same-user DoS). FIXED: bounded in-flight semaphore (default 128) in Serve."
  G_SEC_F4_INFO: "bundle load unsigned (FS trust). ACKNOWLEDGED: signed fetch is [EXT-opa-bundle] follow-up; off the decision path; noted in bundle.go."
  G_SEC_F5_INFO: "all-wildcard block rule = functional deny-by-default. NOTED for E6-S3 (an authored enforce policy, not a bundle-safety bug)."
  G3_F2_LOW: "bundle.go comment said 'FIRST match wins' but code is max-severity. FIXED: comment corrected to describe max-severity aggregation."
  G3_F3_LOW: "max-severity test didn't distinguish from last-match-wins. FIXED: added MaxSeverityWhenHighComesFirst (BLOCK rule first, CONSTRAIN second, asserts BLOCK)."
  G3_F5_INFO: "`sidecar serve --help` exited non-zero. FIXED: flag.ErrHelp -> exit 0 (live-verified)."
  G3_F6_INFO: "readBounded string-compared EOF. FIXED: errors.Is(err, io.EOF)."
  G3_F4_INFO: "local mapping is a documented superset/approximation of core's OPA switch (constrain; omitted workflow_type/task_queue/timestamp). No action — explicitly disclosed as a bounded approximation in bundle.go/input.go."
