  live_e2e: >
    Ran the real `openbox` binary as `openbox sidecar serve` on a 0700 per-user runtime dir
    with the example bundle: a `rm -rf /` ToolCall -> BLOCK (reason+policy_id, source=local-bundle);
    `ls` -> ALLOW; a malformed request -> fail-open diagnostic and the daemon SURVIVES (next
    request still decided); SIGTERM -> graceful exit 0 with the socket removed; socket perms 0600,
    dir 0700; unchanged bundle across ~12 sync ticks -> ONE load log (mtime gate works); an
    attacker-shaped 0775 socket dir -> REFUSED with an INV-1 error (F1 closed); daemon absent ->
    the hook-side Client fails open (allow).
