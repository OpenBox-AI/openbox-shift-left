summary: >
  Independent blind correctness + acceptance audit of the `openbox` CLI +
  `dev init --provider <tool>` (STORY-SL-2). Read all source and tests fresh
  (did not assume builder reasoning); re-ran build/vet/test; drove the real
  binary for dry-run and error paths; and re-verified the cross-repo backend
  contract (path, required icon, aivss_config, response shape, dual-auth, org
  derivation, AND the exact 14 AIVSS DTO min/max bounds) against LIVE
  openbox-backend source via a read-only Explore agent. Core is correct: the
  contract matches, INV-1 holds on the primary Linux path, dry-run is provably
  write-free (collaborators are not even constructed), and the AIVSS default +
  Validate() bounds are exactly right. 6 of 7 ACs fully met; AC5 (idempotency)
  is PARTIAL due to a swallowed list-error that bypasses the remote-duplicate
  guard. Two medium findings and a still-pending mandatory G_SEC gate lead to a
  REVISE recommendation. No code was modified.

validation:
  ran:
    - command: "cd /run/media/brian/DATA/works/openboxai/openbox-shift-left/cli && go build ./... && go vet ./... && go test ./..."
      result: "pass"
      evidence: >
        Build clean, vet clean, all packages ok. 23 top-level test funcs
        (grep '^func Test' = 23). Verbose run: 22 PASS + 1 SKIP —
        TestSecretToolContract SKIPS on this headless host (no reachable
        keyring), it does not pass. So the builder's "23 tests pass" is more
        precisely 22 pass + 1 skip. Key properties confirmed by name:
        TestDryRunMakesNoWrites (0 create, 0 find, 0 secrets),
        TestHappyPathStoresCredsNeverPrintsThem (3 secrets stored, secret
        VALUES absent from output = INV-1), TestIdempotentReuseSkipsRegistration
        (0 network on local reuse), TestRemoteDuplicateBlocksWithoutForce,
        TestForceRegistersUnderFreeName (name -> dev-x-2), TestAPIErrorHalts
        (HALT + 400), TestPartialFailureReportsAgentAndResume (api key stored,
        private key not, error names agent-1 + rotate), TestMissingPrivateKeyErrors
        (0 secrets stored).
    - command: "env -u OPENBOX_CONTROL_TOKEN -u OPENBOX_BACKEND_URL ./openbox dev init --provider claude-code --dry-run --org acme"
      result: "pass"
      evidence: >
        exit 0; printed full DRY RUN plan (agent_type=developer, icon emoji,
        aivss_config note, managed_enable=false, secret-store account layout,
        manual-config). No env/network/store touched. Confirmed the dry-run
        branch in Run() returns BEFORE any d.Store or d.Registrar access, and
        main.go builds Deps with Store=nil/Registrar=nil in dry-run — writes
        are structurally impossible, not merely skipped.
    - command: "./openbox dev init --provider emacs | --provider '' (empty) | (no token)"
      result: "pass"
      evidence: >
        unknown provider -> exit 1 clear msg; empty provider -> exit 1;
        missing OPENBOX_CONTROL_TOKEN (non-dry-run) -> exit 1 with INV-1
        rationale. os.Exit(2) reserved for registered-but-manual-config partial
        success (main.go:126).
  cross_repo_verification:
    method: "Read-only Explore agent against LIVE /run/media/brian/DATA/works/openboxai/openbox-backend."
    result: "all claims VERIFIED"
    detail: >
      POST /agent/create with NO global prefix / NO versioning (so no /api/v1);
      icon @IsNotEmpty (required); aivss_config required; agent_type optional
      free-form string maxLength 100 (CLI sends 'developer', fine); agent_name
      @MaxLength(255); organization_id derived from caller identity, never body;
      success wrapped {data:{agent{id,agent_name,did,tier,trust_score}, token,
      identity{did, privateKey}}} by a global TransformInterceptor; privateKey =
      base64 raw Ed25519 seed returned once; dual-auth (Keycloak Bearer JWT +
      x-openbox-client, OR X-API-Key obx_key_). AIVSS DTO @Min/@Max match the Go
      Validate() bounds EXACTLY for all 14 fields (see aivss_audit).

aivss_audit:
  bounds_match: true
  all_14_within_bounds: true
  detail: >
    Go Validate() bounds == backend DTO for every field:
    attack_vector[1,4], attack_complexity[1,2], privileges_required[1,3],
    user_interaction[1,2], scope[1,2], model_robustness[1,5],
    data_sensitivity[1,5], ethical_impact[1,5], decision_criticality[1,5],
    adaptability[1,5], confidentiality_impact[1,5], integrity_impact[1,5],
    availability_impact[1,5], safety_impact[1,5]. DefaultDeveloperProfile()
    values (2,2,2,2,2 / 2,4,2,3,4 / 3,3,2,1) all fall inside their ranges.
    Validate() covers all 14; TestValidateCatchesOutOfRange proves it rejects an
    out-of-range edit. Run() calls Validate() before registering (devinit.go:114)
    so a bad edit fails locally with a field name, not as an opaque 400. Score
    not re-derived (out of scope, per instruction).

control_flow_audit:
  freeName:
    terminates: true
    detail: >
      devinit.go:264-279. Bounded loop i in [1,100) so it always terminates
      (no infinite loop). On any FindByName error it returns the ORIGINAL name;
      if all 99 candidates are taken it also returns the original name. Both
      cases hand back a name that is known/likely taken, so the subsequent
      Create hits the backend (org,name) uniqueness 400 -> wrapped as a
      confusing HALT rather than a clear 'no free name' message. Safe (never
      duplicates, never hangs) but poor UX -> LOW finding F4.
  partial_failure_ordering:
    correct: true
    detail: >
      devinit.go:206-214 writes api_key, then private_key, then did. On failure
      after the agent exists, resumeErr names the agent id + DID and says the
      once-only creds must be rotated. TestPartialFailureReportsAgentAndResume
      asserts api_key IS stored and private_key is NOT after a mid-write failure.
      Orphaned api_key on re-run does not falsely trigger reuse (reuse requires
      BOTH api_key AND private_key present, devinit.go:142-143). Sound.
  halt_4xx_branch:
    correct: true
    detail: >
      devinit.go:183-191 uses errors.As(*backend.APIError) to emit HALT with the
      exact status; backend.do() returns *APIError on any non-2xx (client.go:230).
      res.Registered stays false. TestAPIErrorHalts covers 400. Matches stop
      condition.
  missing_privatekey_branch:
    correct: true
    detail: >
      devinit.go:196-201 errors (naming the missing cred via missingCreds) BEFORE
      any Store.Set, after res.Registered=true (agent truly exists server-side).
      TestMissingPrivateKeyErrors asserts 0 secrets stored. Sound.
  swallowed_errors:
    detail: >
      devinit.go:155-163: the remote-duplicate guard is `if existing, err :=
      FindByName(...); err == nil && existing != nil`. A FindByName/list ERROR
      is silently swallowed and execution falls through to Create -> the dedup
      guard is bypassed whenever GET /agent/list fails. -> MEDIUM finding F1.
  ac_without_test:
    detail: >
      main.go is entirely untested (no _test.go in cmd/openbox): the
      no-secret-store HALT (secret.Detect ErrNoStore -> INV-1 stop condition),
      the env-only-token INV-1 guard, backend-url guard, and the os.Exit(2)
      partial-success wiring have no automated coverage (only exercised
      manually here). -> MEDIUM finding F2. DID fallback (client.go:137-139)
      and a non-APIError network failure from Create are also untested (LOW).

acceptance_criteria:
  - id: "AC1: dev init --provider registers via POST agent/create with agent_type=developer + sane default aivss_config; captures obx_ key, DID, Ed25519 key"
    met: true
    evidence: >
      backend.Client.Create posts /agent/create (verified no /api/v1) with
      AgentType='developer' (devinit.go:38,172), always-present icon
      (devinit.go:121-124), full aivss.DefaultDeveloperProfile (verified within
      DTO bounds), and parses token/identity.privateKey/did into Registration.
      integration_test asserts the sent DTO has agent_type=developer + non-empty
      icon + aivss_config object, and captures srv-agent/did:aip:server/obx_test
      key/base64 seed. Contract fully re-verified cross-repo.
  - id: "AC2: credentials to OS secret store, never plaintext in repo/config; config references the stored secret"
    met: true
    evidence: >
      internal/secret Store writes to libsecret via STDIN on Linux (INV-1 clean,
      backends.go:27-38) or macOS keychain. devinit stores 3 accounts namespaced
      org/provider/field; CredentialRef passes service+account only, never the
      value (provider.go:39-47). TestHappyPath...NeverPrintsThem proves secret
      values never reach output. No config file is written yet (adapters are
      stubs), so 'config references not value' is satisfied by design + the
      manual-config text which prints account names only. CAVEAT: macOS write
      path exposes the value transiently on argv (F3, routed to G_SEC) — Linux
      path (this build/test host) is clean.
  - id: "AC3: delegates provider config to the adapter installer; for an unbuilt adapter prints manual config + exits non-zero"
    met: true
    evidence: >
      provider stubs Available()==false; applyConfig prints Installer.Plan(ref)
      and returns an error (devinit.go:230-235); main.go maps ConfigManualOnly
      -> os.Exit(2) (main.go:124-127). TestHappyPath + integration_test assert
      ConfigManualOnly + error + manual text surfaced for claude-code. Holds for
      all 3 providers until SL-4/7/8.
  - id: "AC4: --dry-run prints plan, makes NO network or filesystem writes"
    met: true
    evidence: >
      Strongest AC. Run() returns via planDryRun BEFORE any Store/Registrar
      access (devinit.go:134-135); planDryRun uses only Out + Installer.Plan.
      main.go constructs Deps with Store=nil/Registrar=nil and never calls
      secret.Detect in dry-run. TestDryRunMakesNoWrites (0 create/find/secrets)
      + live run with env unset (exit 0, plan printed, nothing touched).
  - id: "AC5: idempotent re-init (detect existing, reuse rather than duplicate)"
    met: partial
    evidence: >
      Local reuse is solid: both creds present -> skip network entirely
      (devinit.go:142-152, TestIdempotentReuseSkipsRegistration). Remote-exists
      -without-local-creds is refused with a clear message + --force escape
      (TestRemoteDuplicateBlocksWithoutForce) — honest given once-only,
      unrecoverable creds (no backend upsert; verified). PARTIAL because the
      remote-duplicate guard SWALLOWS a FindByName error (devinit.go:155-163): if
      GET /agent/list fails, dedup is skipped and Create proceeds. The backend
      (org,name) uniqueness 400 prevents a true silent duplicate, but the user
      gets a confusing HALT instead of the friendly dedup path, so idempotent
      detection is not robust under partial connectivity (F1).
  - id: "AC6: records organization_id-scoped + shared DID namespace (INV-4/INV-7)"
    met: true
    evidence: >
      CreateAgentRequest carries NO organization_id (confirmed: org appears only
      in response structs) — org is derived server-side from the caller
      credential (verified cross-repo) = INV-4. DID is minted server-side via the
      shared did:aip uuidv5 scheme and captured with a fallback (identity.did ->
      agent.did) = INV-7. Secret accounts are additionally namespaced by org
      client-side.
  - id: "AC7: exposes org force-enable substrate but Phase-1 default opt-in (NFR-5/OD10)"
    met: true
    evidence: >
      --managed-enable flag defaults false (main.go:79); recorded into the agent
      config map as managed_enable (devinit.go:177-180); output states
      'verified, not activated — Phase-1 pilot is opt-in' (devinit.go:220-222).
      Substrate present, mandate not activated.

findings:
  - id: F1
    severity: medium
    classification: correctness/robustness
    target: "internal/devinit/devinit.go:155-163 (remote-duplicate guard)"
    detail: >
      The guard `if existing, err := d.Registrar.FindByName(ctx, name); err == nil
      && existing != nil` silently swallows any list error: on a failed GET
      /agent/list the dedup is skipped and Run proceeds to Create. This
      undermines AC5's remote detection under transient failures / auth blips.
      The backend uniqueness check is a safety net (no silent duplicate) but the
      operator gets a confusing HALT rather than the intended dedup message.
    recommendation: >
      On FindByName error, either surface it ('could not verify existing agents')
      or fail closed rather than silently continuing to Create.
  - id: F2
    severity: medium
    classification: test_coverage
    target: "cmd/openbox/main.go (no tests)"
    detail: >
      main.go has zero automated coverage. The INV-1 stop condition (no OS
      secret store -> secret.Detect ErrNoStore -> HALT, refuse plaintext), the
      env-only credential guard, the backend-url guard, and the os.Exit(2)
      partial-success mapping are only exercised manually in this review. For a
      high-risk credential-minting story the HALT-on-no-store path in particular
      should be tested (e.g. extract the detect/guard logic so it is unit
      testable).
    recommendation: "Add tests for the no-store HALT and the exit-code contract."
  - id: F3
    severity: high
    classification: security/decision_needed
    target: "internal/secret/backends.go:82-92 (macOS keychainStore.Set)"
    detail: >
      macOS `security add-generic-password -w <value>` passes the secret on argv,
      transiently visible via `ps` — unlike the Linux stdin path. INV-1's at-rest
      guarantee (nothing in repo/logs/config) holds; the transient argv window is
      a real gap. Already documented in code + README and routed to G_SEC. Not a
      Linux-path defect and not a blind-review block, but the mandatory G_SEC
      gate has NOT run.
    recommendation: "Sam to rule at G_SEC (accept transient window vs ship a keychain helper) before release."
  - id: F4
    severity: low
    classification: usability/robustness
    target: "internal/devinit/devinit.go:264-279 (freeName)"
    detail: >
      Bounded [1,100) so it always terminates (no hang). But on any FindByName
      error, or if all 99 candidates are taken, it returns the ORIGINAL
      (known/likely-taken) name, so Create then hits a backend 400 -> confusing
      HALT rather than a clear 'no free name available' error.
    recommendation: "Return an explicit error when no free name is found or lookup fails during --force."
  - id: F5
    severity: low
    classification: correctness
    target: "internal/devinit/devinit.go:100-102 (defaultAgentName truncation)"
    detail: >
      name[:255] truncates by BYTES; if username/hostname contain multi-byte
      UTF-8 this can split a rune (unlikely in practice). Also a user-supplied
      --agent-name is not length-validated locally (>255 -> backend 400; backend
      @MaxLength(255) confirmed).
    recommendation: "Truncate on rune boundary; optionally pre-validate --agent-name length."
  - id: F6
    severity: low
    classification: accuracy/test_coverage
    target: "build result claim + internal/secret/secret_test.go:50"
    detail: >
      Build result states '23 tests pass'; the reality is 22 PASS + 1 SKIP —
      TestSecretToolContract skips whenever no keyring is reachable (this host),
      so no test actually exercises a real OS keychain here. Also the DID
      fallback (client.go:137-139) and a non-APIError network failure from
      Create are untested.
    recommendation: "State '22 pass + 1 skip'; add a DID-fallback unit case."
  - id: F7
    severity: info
    classification: observation
    target: "--org flag semantics"
    detail: >
      --org is only a client-side secret-namespace/label input; real org scoping
      is server-side from the token. A mismatch (--org X, token belongs to Y)
      yields a cosmetically mislabeled secret account, not a security issue.
    recommendation: "None required; document that --org is a local namespace label."

G3_REVIEW:
  decision: revise
  blocking_findings: [F1, F2]
  gate_dependency: "G_SEC (Sam) still PENDING — F3; release cannot proceed until it runs."
  rationale: >
    The change is fundamentally correct and well-built: the backend contract is
    independently re-verified against live source (path, required icon,
    aivss_config, {data:{...}} shape, base64 Ed25519 seed, dual-auth, org-from-
    caller), the AIVSS default and all 14 Validate() bounds match the DTO
    exactly, INV-1 holds on the Linux path (secret via stdin, no secret value in
    output — proven by test), and --dry-run is structurally write-free (the
    collaborators are not even constructed). 6 of 7 ACs are fully met. I am not
    approving-to-done because: (1) AC5 is only PARTIAL — the remote-duplicate
    guard silently swallows list errors (F1), so idempotent detection is not
    robust; (2) the INV-1 HALT-on-no-secret-store path and the exit-code contract
    live entirely in an untested main.go (F2) on a high-risk credential-minting
    story; and (3) the mandatory G_SEC gate (F3, macOS argv exposure) has not
    run. None of these make the change wrong, so this is REVISE, not BLOCK: fix
    F1 + F2, then clear G_SEC before release. No correctness defect was found in
    the happy path, the HALT branch, the partial-failure ordering, or the
    missing-key branch.
  no_code_modified: true
