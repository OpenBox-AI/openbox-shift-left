summary: >
  Built the OpenBox developer-runtime data-plane client (STORY-SL-3): the shared, reusable
  transport every adapter (SL-4/7/8) and the git action (SL-6) use to emit a normalized SL-1
  event — build core GovernanceEventPayload → AIP Ed25519-sign → POST /api/v1/governance/evaluate
  → parse verdict. New Go module client/ (stdlib-only, no cgo, OD17). Signing verified BYTE-FOR-BYTE
  against the reference SDK (openbox-temporal-sdk-python/request_signing.py) AND core's server-side
  verifier (agent.go:93); the test mock re-verifies every request exactly as core would. Fail-open
  (INV-3), metadata-only (INV-2), idempotency (INV-5), no-leak (INV-1) all enforced + tested.
  Validation green (18 tests). One human gate remains: G_SEC (Sam) — AIP signing / key handling.
