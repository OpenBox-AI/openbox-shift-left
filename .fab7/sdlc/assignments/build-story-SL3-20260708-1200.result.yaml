cross_repo_reference:
  method: "Two read-only Explore agents (per user directive: always use explore for cross-repo reference) over ../openbox-temporal-sdk-python and ../openbox-core"
  verified:
    - "SIGNING (openbox-temporal-sdk-python/openbox/request_signing.py:84-95): canonical = UPPER(METHOD)\\nPATH\\nTIMESTAMP\\nNONCE\\nBODY_SHA256_HEX (LF, no trailing); Ed25519 over raw UTF-8 canonical (NO pre-hash); signature base64.StdEncoding (padded); nonce = token_urlsafe(24) = base64url-nopad 32 chars; body sha = lowercase hex sha256 of EXACT transmitted bytes; timestamp = datetime.now(utc).isoformat() → +00:00 offset (NOT Z)."
    - "KEY LOADING (config.py:190-203): stored key is base64 raw 32-byte Ed25519 SEED (std base64), decoded → 32 bytes → from_private_bytes == Go ed25519.NewKeyFromSeed."
    - "BODY SERIALIZATION (request_signing.py:41-51): compact JSON separators (',',':'); signed bytes == transmitted bytes (single marshal). Client marshals once in buildPayload; client.go never re-marshals."
    - "HEADERS (hook_governance.py:178-182 + request_signing.py:34-38): Authorization: Bearer <obx_>, X-OpenBox-SDK-Version, User-Agent, X-OpenBox-Agent-{DID,Timestamp,Nonce,Signature}, X-OpenBox-Body-SHA256."
    - "SERVER VERIFIER (openbox-core services/agent.go:93 BuildAgentIdentityCanonicalRequest): strings.ToUpper(method) joined by \\n; timestamp parsed time.RFC3339Nano within ±5min; body-sha constant-time compared; signature base64.StdEncoding; only enforced when agent.SigningRequired==true (OD16 sets true)."
    - "PAYLOAD (openbox-core internal/content/governance.go:186 GovernanceEventPayload): source/event_type/workflow_id/run_id/timestamp(string)/span_count(omitempty)/spans(omitempty)/metadata(json.RawMessage). sdk_version overwritten server-side from header — not sent in body."
    - "SPANDATA (governance.go:266): start_time/end_time int64 epoch NANOSECONDS (not omitempty); FuncName has JSON tag `function`; bytes_read/written *int64; lines_count *int; request_body/response_body *string; hook_type string."
    - "RESPONSE (governance.go:366 GovernanceVerdictPublicResponse — the handler returns ToPublicResponse() at api/governance.go:202, NOT the internal struct): verdict plain lowercase string {allow|constrain|require_approval|block|halt}; legacy `action` string; governance_event_id/risk_score/fallback_used always present."
    - "ACCEPT-LIST (api/governance.go:273 isValidGovernanceEventType): accepts only the 7 Temporal types today; the 7 dev lifecycle types are NOT accepted → real POST returns 400 until EXT-core's 3 additive edits. Integration therefore runs against the in-process core-mirror server."
