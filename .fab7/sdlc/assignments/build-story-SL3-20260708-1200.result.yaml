  - id: "client event id for idempotent ingestion (INV-5)"
    met: "partial → addressed in post-review revisions"
    evidence: >
      Build claimed 'met' but G3/G_SEC both found the event_id was NEVER transmitted (no wire field;
      DevEvent tag inert) and core does not dedupe dev events → a retry after a lost 200 double-counts.
      POST-REVIEW FIX: event_id is now carried in metadata.event_id (TestBuildPayload_EventIDOnWireForIdempotency)
      so the key reaches the wire for EXT-core to key dedupe on; within-call retries still reuse the identical
      body. True end-to-end dedupe remains an EXT-core dependency (documented, not silently claimed).
findings:
  - classification: "for_security_review"
    severity: "info"
    target: "G_SEC (Sam) — AIP signing / key handling"
    detail: >
      Trace for review: (1) the Ed25519 seed and obx_ key live only in signer.priv / Client.apiKey,
      never printed, never on argv (constructed from Config in-process). (2) Logger is documented +
      used to emit only event ids/types/transport errors; TestEmit_FailOpen_Unreachable asserts neither
      the key nor the seed appears in logs. (3) httpError.Error truncates the response body to 256 chars
      and the secret is only ever in the Authorization header, never the payload/response. (4) nonce is
      crypto/rand 24 bytes (core enforces single-use within a 5-min window). (5) timestamp uses a +00:00
      offset parseable by core's time.RFC3339Nano freshness check.
    recommendation: "Run G_SEC on client/signing.go + client/client.go before SL-4/SL-6 consume this client."
  - classification: "observation"
    severity: "low"
    target: "byte-identical body vs Python ensure_ascii"
    detail: >
      Python json.dumps defaults to ensure_ascii=True (non-ASCII → \\uXXXX); Go encoding/json emits UTF-8
      for non-ASCII (but escapes <,>,& via SetEscapeHTML). This does NOT affect correctness: core hashes
      the RECEIVED raw bytes and the client hashes+sends the SAME bytes (single marshal), so the signature
      always verifies regardless of matching Python's exact escaping. Documented; no action needed.
  - classification: "observation"
    severity: "low"
    target: "EXT-core accept-list"
    detail: >
      The 7 dev event_types return HTTP 400 on live core today (verified). In Phase-1 observe this is a
      fail-open drop (logged) — harmless. End-to-end acceptance is gated on EXT-core's 3 additive edits
      (S6 §3), tracked as an external dependency; client code needs no change when they land.
