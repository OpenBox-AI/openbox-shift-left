    evidence: "stripContent (default path in Emit) removes top-level content + span request/response bodies on a copy; TestStripContent_Default_RemovesAllContent asserts nothing content-shaped reaches the wire."
  - id: "parses verdict (HALT/BLOCK/REQUIRE_APPROVAL/ALLOW) but Phase-1 callers ignore it (observe)"
