summary: >
  Ran spikes S3 (session→commit attribution) and S4 (privacy/content boundary),
  both grounded in local repo evidence + cited external sources. S3: commit-message
  trailer is the single source of truth, resolved server-side at push against the
  real pushed SHA; only loss modes are fixup / GitHub-squash body-replace → explicit
  unattributed marker (INV-6). S4: every Phase-1 goal met by metadata alone; content
  is a secret/PII/trade-secret carrier not needed for Phase-1; industry defaults
  (Claude Code, Cursor, Copilot) are content-OFF. OD4 elicited and DECIDED:
  metadata-only default, content opt-in per org, Guardrail-redacted at-source async.
  Both outcomes folded into architecture (INV-2, INV-6) and PRD.
