    - command: "cd cli && go test ./internal/secret/ ./cmd/openbox/"
      result: "pass"
      evidence: "secret + main packages green (incl. TestFileBackendSelectedByFlag)"
    - command: "cd adapters/claude-code && go test ./..."
      result: "pass"
      evidence: "adapter green; fileSecretLookup format matches the CLI store byte-for-byte"
  not_run: []
open_decisions:
