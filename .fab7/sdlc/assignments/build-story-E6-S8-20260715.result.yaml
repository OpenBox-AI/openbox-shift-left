story: STORY-E6-S8
title: "Sidecar native policy evaluator (pure-Go first-match builder eval) + pull-at-init policy distribution + session-start staleness ([EXT-opa-bundle] close)"
epic: E6
status: review        # BUILT + all validations GREEN + full live E2E; PENDING brian G3 + Sam G_SEC (run separately); NOT committed
built_at: "2026-07-15"
builder: build-engineer
adr: "ADR-0005 (accepted brian 2026-07-15) — native builder eval, pure-Go/no-cgo/no-OPA; raw-rego residual; pull-at-init + session-start staleness. Supersedes design OD-SYNC-1; resolves OD-SYNC-2/OD-SYNC-4."

summary: >
  Closes [EXT-opa-bundle] (the seam E6-S5 left): the enforce sidecar now obtains a
  REAL per-agent org policy over the network and evaluates it locally with verdict
  parity to openbox-core — WITHOUT embedding a rego engine. A new pure-Go
  builderEvaluator interprets the backend config.policy_builder natively
  (FIRST-MATCH by rule order), and BuildOPAInput is reshaped to core's
  buildOPAInput+buildSpanMap field names so builder field paths resolve
  identically. Distribution is pull-at-init + `openbox dev sync` (org
  control-plane key) writing a pinned local bundle, plus a client-side
  session-start staleness check; the daemon does ZERO network I/O. The E6-S2/S3/
  S4/S6/S9 apply cascade is UNCHANGED — only how the Evaluation is PRODUCED and how
  the bundle is SOURCED changed.

design_cruxes:
  - "builderEvaluator precedence is FIRST-MATCH by rule order (mirrors generatePolicyBuilderRego's `not rule_i_match` guard clauses), NOT the legacy bundleEvaluator MAX-SEVERITY. A DISTINCT evaluator is used (SetBundle picks it when PolicyBuilder!=nil) so builder precedence is never silently changed — an earlier ALLOW beats a later BLOCK."
  - "The LOAD-BEARING parity fix is BuildOPAInput's SHAPE, not the verdict logic: field paths resolve directly against the input tree, so command lives under span.attributes (no top-level command/tool_kind span key), file_path/file_operation/function are promoted to top-level span keys, and semantic_type is derived to core's GRANULAR values (file_write/file_read/mcp_tool_call/internal). Shell = `internal` (core has no shell semantic type) — a shell command is matched on spans[_].attributes.command, a LOCAL-only axis."
  - "No embedded rego / no cgo / no OPA dep (ADR-0005 §Decision-1, honoring OD17/OD-SYNC-2): the only pure-Go rego is OPA itself (heavy dep tree); the light interpreters (Regorus/rego-cpp) are cgo-only. Native builder eval gives real parity for the common (builder-authored) case; hand-written raw rego is a documented fail-open-local residual (real local ALLOW so it proceeds under BOTH fail policies — honest under-blocking, never over-blocking)."
  - "Daemon is network-free (INV-3b strengthened): the 60s background poll is RETIRED (prime-once). Freshness is a client-side session-start compare; a positive --sync-interval keeps a LOCAL-file re-poll for back-compat only. The fail-closed staleness block is realized at the PreToolUse enforce gate (CC has no SessionStart deny primitive) via a content-free per-session stale marker."

cross_repo_recon:
  - "openbox-backend policy-builder.util.ts VERIFIED (buildConditionExpression / generatePolicyBuilderRego / normalizeFieldPath / POLICY_BUILDER_FIELD_PATTERN / buildValueLiteral / buildTargetExpression): 9 operators; contains = case-insensitive substring, value-as-string; typed ==/!=; numeric-when-valueType=number ordering; exists/not_exists = count>0/==0; count transform (unsupported for contains/exists/not_exists); matchMode all=AND / any=OR (multiple rule blocks); FIRST-MATCH via `not rule_{prev}` guards; default {decision:ALLOW,reason:null}; output rule is `result` (NOT `.decision` — the ADR-0005 §Decision-4 correction)."
  - "openbox-backend policy.entity.ts / agent.controller.ts / transform.interceptors.ts VERIFIED: GET /agent/:agentId/policies/current returns {status,data: PolicyEntity|null} (data:null = no current policy, HTTP 200 not 404); auth = x-api-key obx_key_ org key OR Keycloak JWT; permission read:agent_policy (org-scoped) → OD-SYNC-4 = org key."
  - "openbox-core buildOPAInput/buildSpanMap (opa.go) + ComputeSemanticTypeFromSpan (session.go) VERIFIED: no top-level org; span always has span_id/trace_id/name/semantic_type/start_time/end_time/attributes; file_path/file_operation/function promoted from typed fields; command has NO span key; semantic_type recomputed to granular values (shell → internal, not shell_command). NO core/backend source change (reuse-only)."

acceptance_criteria:
  AC1_builder_verdict_parity: "sidecar/builder_test.go — resolvePath, all 9 operators, both valueTypes, count transform ([_] and single), all/any matchMode, boolean valueType, FIRST-MATCH (earlier ALLOW beats later BLOCK, asserted explicitly), default ALLOW, decision→verdict mapping. -race GREEN."
  AC2_input_shape_parity: "sidecar/protocol_test.go (rewrote TestBuildOPAInput_ShapeMatchesCore + TestBuildOPAInput_SpanShapePerToolKind) — field NAMES match core for file read/write, mcp, shell; command under attributes; NO top-level tool_kind/command; semantic_type granular. A builder policy on spans[_].file_path / spans[_].semantic_type / spans[_].attributes.command fires as in core (proven end-to-end by the live mcp REQUIRE_APPROVAL matched on semantic_type==mcp_tool_call)."
  AC3_dev_sync: "cli/internal/backend/client_test.go (GetCurrentPolicy builder/null/raw-rego/403) + cli/cmd/openbox/main_test.go (dev sync writes pinned builder bundle 0600, null→allow bundle, raw-rego warning, 403 mapped hint, missing-token INV-1 guard). org key + rego never printed."
  AC4_staleness_fail_open: "adapters/claude-code/staleness_test.go TestStaleness_FailOpen_WarnsAndProceeds — mismatch → additionalContext 'run dev sync' + proceed; NO stale marker; NO deny."
  AC5_staleness_fail_closed: "TestStaleness_FailClosed_MarksAndGateDenies + enforce_conformance_test.go TestEnforcementConformance_StaleGate — mismatch → content-free marker → PreToolUse deny ('run dev sync') → ClearAllStaleMarkers → proceed."
  AC6_offline_never_denies: "TestStaleness_NoKeyProceeds / _UnreachableProceeds / _MatchIsSilent — no key / offline / match → proceed on last-good, never deny at fetch time (even under fail-closed)."
  AC7_daemon_network_free: "sidecar/sync.go prime-once (no ticker at interval<=0); decide()/sidecar.Client make no network call; FileBundleSource is the only loader. go list confirms no OPA dep. Live E2E daemon served from the local file only."
  AC8_apply_cascade_unchanged: "mapVerdict/applyDecision/applyFailurePolicy/sidecar.Client untouched; builder ALLOW/no-match proceeds byte-identically; only BLOCK/HALT→deny, REQUIRE_APPROVAL→ask, and the fail-closed stale deny tighten. Enforce OFF → inert (byte-identical to E6-S9)."

validation:
  build_vet_test_race: "sidecar + cli + adapters/claude-code all `go build ./... && go vet ./... && go test -race ./...` GREEN."
  conformance: "adapters/claude-code conformance GREEN incl. C1-C11 (E6-S7/S9) + NEW builder-policy E2E (BLOCK/no-match/REQUIRE_APPROVAL) + fail-closed stale-gate E2E (deny→clear→proceed)."
  cgo_static_binary: "CGO_ENABLED=0 go build -o /tmp/openbox ./cmd/openbox → OK (ELF, static; OD17)."
  no_opa_dep: "go list -m all | grep -i open-policy-agent → NOTHING in all three modules; go list -deps sidecar has no rego engine (pure-Go, hard requirement met)."
  live_e2e:
    - "Real `openbox dev sync` against a mock control plane serving config.policy_builder → writes a pinned builder bundle 0600 (org key NOT in the bundle)."
    - "Real `openbox sidecar serve` prime-loads the bundle (zero network I/O; INV-1 socket-dir 0700 guard exercised)."
    - "Real `openbox hook claude-code PreToolUse`: `rm -rf` → deny (OpenBox governance: destructive recursive delete (policy: pol-e2e)); `echo hi` → proceed (empty stdout, default ALLOW); mcp github → ask (matched spans[_].semantic_type==mcp_tool_call — proves input-shape parity)."
    - "Fail-closed stale marker → PreToolUse deny ('stale policy — run `openbox dev sync`'); after clearing → proceed."
    - "Leak checks: no shell command in the enforcement audit; no org key in bundle / spool / sessions / audit (INV-1/INV-2)."

invariants_upheld:
  - "INV-1: org key from OPENBOX_CONTROL_TOKEN env only (never a flag/argv); fetched rego never logged/printed and not exposed as a Policy field (presence signal only). Live-verified absent from bundle + all sinks."
  - "INV-2: no new egress (policy read is an INGRESS); BuildOPAInput/DecisionRequest metadata-only; stale marker content-free (session id only)."
  - "INV-3b: daemon decision path network-free (poll retired; FileBundleSource local loader); the only network calls are CLI dev sync + adapter SessionStart, both off the tool hot path; staleGateDecision is a local file stat."
  - "OD9 / tighten-only: every fault proceeds fail-open; fail-closed denies only on real outage/stale; raw-rego = real ALLOW (proceeds under both); apply cascade unchanged; enforce OFF → inert."

deviations_and_residuals:
  - "Hand-written raw rego does NOT localize (ADR-0005 §Decision-2, accepted): dev sync writes a raw_rego_unlocalized bundle that serves a REAL local ALLOW + prints a non-secret warning; enforcement for it relies on the async /evaluate audit (T2/T3, E6-S10/S11). Never over-blocks."
  - "semantic_type VALUE parity: derived locally to core's granular ComputeSemanticTypeFromSpan values (file_write/file_read/mcp_tool_call/internal) from Tool.Kind + file_operation. This is a build-time improvement beyond the story's field-NAME focus; a reviewer should confirm the shell=internal choice (matched via attributes.command) is the intended parity."
  - "span_id/trace_id/start_time/end_time are emitted present-but-EMPTY (core sets them unconditionally; a local decision needs no real ids/timing). Preserves exists-parity for a policy testing their presence; a policy that numerically compares start_time would diverge (no realistic builder policy does)."
  - "activity_type is NOT added to BuildOPAInput (the story's §2 top-level list omits it). A builder policy keyed on activity_type would not fire locally; noted for a reviewer (low risk — dev tool calls set activity_type='ToolCall', and the enforce axes are the span fields)."
  - "SyncInterval default flipped from 60s→prime-once. A positive --sync-interval still re-polls the LOCAL bundle file for mid-session bundle edits (back-compat); a running daemon otherwise needs a restart to pick up a new dev sync (acceptable — freshness is the session-start check)."

reviewer_scrutiny:
  - "regoCompare total-order fidelity (type-sensitive ==, cross-type ordering) vs OPA — the ordering-operator cross-type edge cases are unlikely in real policies but are where a subtle divergence could hide."
  - "count transform with a non-[_] path resolving to a non-collection → undefined → condition false (regoCount returns not-ok); confirm this matches rego count() type-error semantics."
  - "The fail-closed stale block is realized at the PreToolUse gate, not SessionStart (CC limitation, ADR-0005 §Decision-3 sanctioned). Confirm staleGateDecision gates on FailClosed (fail-open never denies on staleness) and the marker is content-free + traversal-guarded."
  - "writeBundleFile round-trips through sidecar.ParseBundle before replacing the last-good file (never write a bundle the daemon would refuse). Confirm a malformed builder config can't wedge the daemon (kept last-good) and can't over-block."
  - "installer.writeConfig now merge-preserves a prior agent_id/backend_url on idempotent re-init — confirm no regression to the existing reuse path."

follow_ups:
  - "E6-S10 Tier-2 sync /evaluate escalation + E6-S11 Tier-3 findings loop (design §8) close the raw-rego + guardrail floor; still unsliced."
  - "A server-side 409/426 staleness backstop (OD-SYNC-5) is deferred (needs a core /evaluate change + ADR)."
  - "activity_type / richer top-level input parity if a builder policy class needs it (currently span-field-focused)."

review_fixes_folded:
  note: >
    Both independent reviews returned 2026-07-15: G_SEC (Sam) APPROVE, G3 advisory
    PASS, no CONFIRMED defects; load-bearing parity verified correct. The four
    behavioral + two doc findings below were folded (verified core semantics and
    the apply cascade left untouched); a real test was added for each behavioral fix.
  fixes:
    - id: "G3-F1 (behavioral) — count→number coercion"
      raised_by: "G3 (review_auditor)"
      file: "sidecar/builder.go (valueLiteral)"
      resolution: "valueLiteral now treats Transform==\"count\" (for count-supported operators) as valueType=number regardless of the stored valueType, mirroring the backend parser — a count target can never be compared against a quoted-string literal (which regoCompare would rank cross-type and silently never match)."
      test: "sidecar/builder_test.go TestConditionHolds_CountForcesNumeric (count/equals & count/greater_than with valueType left as \"string\" still compare numerically; a wrong count value misses)."
    - id: "G_SEC-INFO-3 (behavioral) — validate PolicyBuilder decision strings"
      raised_by: "G_SEC (Sam)"
      file: "sidecar/bundle.go (validate)"
      resolution: "validate() now checks every PolicyBuilder.Rules[].Decision against the recognized set (case-insensitive), same as Rules[]/DefaultDecision — a typo'd decision (e.g. BLOKC) is REJECTED at parse/translate time instead of silently mapping to ALLOW (a dropped BLOCK). Both FileBundleSource and dev sync go through validate, keeping the last-good bundle on a bad edit."
      test: "sidecar/bundle_builder_test.go TestParseBundle_RejectsBadBuilderDecision (BLOKC rejected; BLOCK accepted)."
    - id: "G3-F4 / G_SEC-INFO-2 (behavioral) — atomic bundle write"
      raised_by: "G3 + G_SEC (both)"
      file: "cli/cmd/openbox/main.go (writeBundleFile)"
      resolution: "Switched the in-place os.WriteFile to write-temp (0600, same dir) + os.Rename, so a crash mid-write can never leave the daemon / staleness read a truncated bundle. The ParseBundle-before-write validation is retained."
      test: "cli/cmd/openbox/main_test.go TestDevSync_BuilderPolicyWritesPinnedBundle (unchanged) exercises the rename path + asserts 0600; the write path is now atomic by construction."
    - id: "G3-F5 (behavioral coverage) — persist agent_id/backend_url"
      raised_by: "G3 (review_auditor)"
      file: "cli/cmd/openbox/main_test.go (NEW test)"
      resolution: "Added a test driving the real register/init path (fake registrar) that asserts dev.json contains agent_id + backend_url, that they PERSIST across an idempotent re-init (installer merge-preserve), and that ResolveAgentID()/ResolveBackendURL() return them with the env unset (config fallback). No behavior change — closes the §6 coverage gap (previously only the env branch was tested)."
      test: "cli/cmd/openbox/main_test.go TestDevInit_PersistsAgentIDAndBackendURL."
    - id: "G3-F2 (docs) — mcp_server comment"
      raised_by: "G3 (review_auditor)"
      file: "sidecar/input.go"
      resolution: "Corrected the comment: core's buildSpanMap emits NO mcp_* field (recon B); attributes.mcp_server is a LOCAL-only superset for local matching (benign local OVER-match only, never under-match). Real MCP parity is via semantic_type==mcp_tool_call + tool name. Attribute kept."
      test: "n/a (comment-only)."
    - id: "G3-F6 (docs) — --sync-interval help text"
      raised_by: "G3 (review_auditor)"
      file: "cli/cmd/openbox/main.go (runSidecar flag help)"
      resolution: "Flag help now reflects prime-once at 0 (no re-poll, no network I/O; freshness is the client-side session-start check) and a positive value = LOCAL-file re-poll for back-compat. The stale '(default 60s)' text is gone."
      test: "n/a (help text)."
  no_action_recorded:
    - "G3-F3 — promotedSpanKeys omits status/error: out of scope for a ToolCall PRE-execution decision (no completed span yet); left as a noted gap."
    - "G_SEC-INFO-1 — TLS-only fetch enforcement: this is the deferred OD-SYNC-5 server-side backstop; stays on the backlog (needs a core change + ADR)."
  revalidation: "After the fixes: sidecar + cli + adapters/claude-code `go build/vet/test -race ./...` GREEN; conformance GREEN; CGO_ENABLED=0 binary builds; go list -m all | grep open-policy-agent → NOTHING (all 3 modules)."

reviews:
