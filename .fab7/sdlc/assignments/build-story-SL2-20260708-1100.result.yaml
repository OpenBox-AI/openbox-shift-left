findings:
  - classification: "decision_needed"
    severity: "high"
    target: "G_SEC / macOS keychain argv exposure"
    detail: >
      Linux (secret-tool) passes the secret on stdin — no argv exposure. macOS
      `security add-generic-password -w <value>` transiently exposes the secret
      via argv (`ps`); there is no no-cgo/no-argv path through that binary.
      Documented on keychainStore + in cli/README.md. Options: (a) accept the
      transient local-only window, or (b) ship a small keychain helper.
    recommendation: "Sam to rule at G_SEC; Phase-1 build implements (a) and flags it. Persistent INV-1 guarantee (nothing at rest in repo/logs) holds regardless."
  - classification: "observation"
    severity: "medium"
    target: "idempotency semantics vs the AC wording"
    detail: >
      The AC says 're-init reuses/updates rather than duplicating.' The backend
      shows token+privateKey ONCE and has no upsert, so true remote reuse is
      impossible. Implemented semantics: local secret-store presence => full
      reuse (no network); remote-exists-without-local-creds => refuse to
      duplicate + explain (delete+re-run or --force for a new distinctly-named
      agent). This is the correct honest behavior given the platform constraint.
    recommendation: "Confirm the semantics at review; consider a future `openbox dev rotate` to re-mint creds for an existing agent (POST :agentId/rotate-api-key)."
  - classification: "observation"
    severity: "low"
    target: "story inlined-context gaps (now corrected in code)"
    detail: >
      Story omitted the required `icon` field and stated the path as bare
      `agent/create` without ruling out a prefix; both corrected against live
      backend. Recommend a doc-sync of STORY-SL-2 / architecture D5 to record the
      no-prefix path, the X-API-Key auth alternative, the required icon, and that
      identity.privateKey is returned once (not KMS-only).
    recommendation: "learning-scribe doc-sync (non-blocking)."
