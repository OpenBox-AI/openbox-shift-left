cross_repo_reference:
  method: "Explore agents (read-only), per user directive: openbox-backend (agent/create DTO + AIVSS calc) and openbox-temporal-sdk-python (registration/credential/signing conventions)."
  verified:
    - "PATH: POST /agent/create — backend sets NO global prefix + NO versioning (main.ts), so there is NO /api/v1 here (unlike core's /api/v1/governance/evaluate). agent.controller.ts @Controller('agent')+@Post('create')."
    - "AUTH: global JwtAuthGuard accepts EITHER a Keycloak Bearer JWT (also requires header x-openbox-client) OR an org control-plane key via X-API-Key (obx_key_...). organization_id derives from the caller identity, never the body (INV-4). Permission CreateAgent."
    - "REQUIRED FIELDS: a minimal valid body = agent_name + icon + full aivss_config. `icon` is @IsNotEmpty on CreateAgentDto — this was ABSENT from the story's inlined context; the CLI now always sends it (default emoji)."
    - "RESPONSE: {data:{agent, token, identity}} (global TransformInterceptor wraps in `data`). identity.privateKey IS returned exactly once = base64 raw 32-byte Ed25519 seed (matches the SDK's expected agent_private_key format). token = obx_(live|test)_+48hex, also once-only. Caveat: identity is returned by the runtime object but is NOT in the Swagger CreateAgentResponseDto — parsed defensively with a fallback to agent.did."
    - "AIVSS DIRECTION (calc-aivss-score.ts): higher points => higher risk => LOWER aivss_score (a HIGH score is SAFE). Within ai_specific, data_sensitivity/ethical_impact/decision_criticality/adaptability DESCEND while model_robustness ASCENDS (the odd one out). The accepted posture computes to aivss_score ~= 52.74 (mid-band) and, with default behavioral=100/alignment=100, trust ~= 81 (Tier 2). NO 'moderate' tier enum exists (tiers are numeric: 90/75/50/25); the CLI pins only the 14 integers (all within @Min/@Max) and never asserts a tier locally."
    - "IDEMPOTENCY: no upsert. Duplicate (org, agent_name) [case-insensitive app check] -> 400 'already exists'; create always mints a new agent. token + privateKey are shown once and unrecoverable. => local secret-store presence is the real idempotency key; remote-exists-without-local-creds is refused (no duplicate) unless --force."
    - "SDK (openbox-temporal-sdk-python): does NOT mint — create_openbox_worker() only validates pre-provisioned creds via a signed GET /api/v1/auth/validate. Confirms the CLI is the mint step and the seed/key formats above. AIP canonical signing string captured for SL-3 (METHOD\\npath\\ntimestamp\\nnonce\\nbodySHA256_hex, no trailing newline; sig=std-base64; nonce=urlsafe-unpadded; ts=ISO-8601 +00:00)."
