name: ci

# Build, vet and test every module in the workspace on every change.
#
# Modules are discovered from go.work rather than listed here, so a new module
# is covered the moment it joins the workspace — the previous state of this repo
# (11 modules, no CI at all) is the failure mode worth engineering against.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        # A SUPPORTED major, and the reason is security rather than features.
        # Go patches only the two most recent majors, so a pin to an older one
        # stops receiving stdlib fixes entirely while still building green:
        # this was pinned to 1.23 two majors past its end of life, and
        # govulncheck found reachable stdlib vulnerabilities in every module
        # (quadratic net/url resolvePath, a crypto/tls post-handshake message
        # limit, encoding/asn1 recursion depth, net/textproto error escaping)
        # whose fixes shipped only in 1.25.11+ and could therefore never arrive
        # on any 1.23 patch.
        #
        # This is deliberately NOT the go.mod language floor, which stays at
        # 1.23: a newer toolchain compiles an older language version, so the
        # x/term v0.34.0 pin (v0.35.0+ would raise that floor across all twelve
        # modules) is unaffected. Toolchain and floor move independently, and
        # only one of them is a security input.
        #
        # A MAJOR, not a full version, so patch releases — which is what
        # security fixes are — arrive without a commit here.
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.work covers every module
        # Discovery below reads go.work, so a module missing from it would be
        # silently unverified — the exact hole this workflow exists to close.
        run: |
          on_disk=$(find . -name go.mod -not -path './.git/*' | wc -l)
          in_workspace=$(go list -m | wc -l)
          if [ "$on_disk" -ne "$in_workspace" ]; then
            echo "::error::$on_disk go.mod files on disk but $in_workspace modules in go.work — add the new module to go.work"
            exit 1
          fi

      - name: Resolve workspace modules
        # The repo root is not itself a module, so `./...` matches nothing;
        # every module's package pattern has to be named explicitly.
        run: echo "MODS=$(go list -m -f '{{.Dir}}/...' | tr '\n' ' ')" >> "$GITHUB_ENV"

      - name: Build
        run: go build $MODS

      - name: Vet
        run: go vet $MODS

      - name: Test
        # -race matters here: the spool, the liveness registry and the findings
        # cursor are all concurrently-written files with existing race tests.
        # No -short: the tests that exec the real built binary are the ones
        # that pin the INV-3 hook contract (exit 0, empty stdout).
        run: go test -race $MODS

      - name: Vulnerability scan
        # The gate that makes the pin above self-maintaining. Without it, the
        # toolchain silently ages out of support again and nothing says so —
        # which is exactly how it reached two majors past end of life, green the
        # whole way.
        #
        # A RED result here usually means "bump the toolchain", not "this change
        # broke something": a newly published stdlib advisory fails an unrelated
        # PR. That is the intended direction for a governance product — a known
        # reachable vulnerability in a shipped binary is worse than a blocked
        # merge — and the remedy is one line above.
        #
        # Per module, because the repo root is not a module. -show=verbose is
        # omitted: the default output already names the reachable symbol traces,
        # which is what turns a report into an action.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          failed=""
          for dir in $(go list -m -f '{{.Dir}}'); do
            echo "::group::govulncheck $dir"
            (cd "$dir" && govulncheck ./...) || failed="$failed $dir"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::reachable vulnerabilities in:$failed"
            exit 1
          fi

      - name: Cross-compile for Windows
        # ADR-0015 made Windows a supported target for the first time: credentials
        # are a plaintext file, so there is no platform secret-store subprocess to
        # port. Nothing in CI RUNS on Windows, and a cross-compile is not runtime
        # verification — but it catches the most likely regression class by far, a
        # stray unix-only call (syscall.Umask, /dev/null, os/exec of `security`),
        # and it costs one step with no extra runner.
        #
        # Everything about Windows beyond "it compiles" is in phase 8's manual
        # checklist and stated as unverified in the docs. Do not let this step be
        # read as more than it is.
        run: GOOS=windows GOARCH=amd64 go build $MODS

      - name: Cross-compile for Linux arm64
        # The other target a macOS/amd64-centric dev loop can silently break.
        run: GOOS=linux GOARCH=arm64 go build $MODS

      - name: Fuzz (short)
        # The secret redactor reads attacker-adjacent strings on the enforce
        # path, where a panic is a crashed hook. A short budget catches the
        # shallow cases on every change; the corpus persists in testdata for
        # anything found.
        #
        # The two rego-path fuzzers went with the local evaluator (ADR-0017).
        # FuzzRedact was defined in the same file and had to be deliberately
        # kept: it covers code that still runs on every gated call with a body.
        run: |
          cd decision
          go test -run XXX -fuzz FuzzRedact -fuzztime 20s ./

      - name: No tier vocabulary in user-facing docs
        # ADR-0017 replaced the tier model with three named features. This gate
        # covers the documents a USER reads, where "Tier 2" would describe a
        # layering the product does not have.
        #
        # It is deliberately NOT repo-wide. The `tier2` config key still parses
        # (deprecated and inert), so code has to keep spelling it, and comments
        # explaining what the tiers WERE are how a reader understands why a
        # deprecated key exists at all. A gate failing on those would be pressure
        # to delete the explanation, which is the opposite of what is wanted.
        #
        # ADRs are records and keep their own words; the upgrade note names the
        # deprecated keys on purpose.
        run: |
          hits=$(grep -rniE '\btier[- ]?[123]\b' docs README.md \
            | grep -v '^docs/adr/' \
            | grep -v '^docs/upgrading-to-inline-evaluation.md' \
            || true)
          if [ -n "$hits" ]; then
            echo "tier vocabulary in user-facing docs (ADR-0017 retired it):"
            echo "$hits"
            exit 1
          fi

      - name: Gateway units invoke only flags that exist
        # Phase 07's plan documented the service unit as running
        # `openbox gateway --config <path>`. No such flag exists, so a generated
        # unit would have been rejected by flag parsing and the gateway would have
        # failed to start on EVERY BOOT — a total outage of the phase's own
        # deliverable, discoverable only by running it.
        #
        # Four separate phantom flags were written into this plan's docs before
        # this gate existed, so it is mechanical rather than a review habit.
        run: |
          cd cli
          go test -run 'TestUnitsUseFlagsThatExist|TestUnitStopTimeoutMatchesTheGracePeriod' ./internal/gatewayservice/

      - name: No prevention claims about gateway bypass
        # The base assurance claim is DETECTION. Bypass is visible and
        # attributable, never prevented — prevention belongs to the org's MDM and
        # is out of OpenBox's scope. A doc that says "cannot be bypassed" is the
        # overstatement this product exists to prevent, and it is the kind of
        # sentence that gets written by accident while summarising.
        #
        # Phrases, not vocabulary: "not prevented" and "prevention needs your MDM"
        # are the CORRECT phrasings, so banning the word would push the wording in
        # exactly the wrong direction. That mistake was made once already while
        # writing the equivalent Go test.
        #
        # Known limit, stated so the fix is obvious: this cannot distinguish a
        # CLAIM from a DISCLAIMER. A sentence promising never to say "cannot be
        # bypassed" trips it — that happened on the first run, in the MDM recipe's
        # own "what OpenBox will not do" list. The remedy is to REWORD the doc, not
        # to weaken the gate: prose that disclaims a phrase reads almost the same
        # as prose that asserts it, and a reader skimming will not tell them apart
        # either.
        run: |
          hits=$(grep -rniE 'cannot be bypassed|cannot bypass|bypass is prevented|impossible to bypass|tamper-proof' \
            docs README.md 2>/dev/null | grep -v '^docs/adr/' || true)
          if [ -n "$hits" ]; then
            echo "prevention claim about bypass in user-facing docs:"
            echo "$hits"
            exit 1
          fi

      - name: Testbed scripts are syntactically valid
        # These are dormant until a stack is reachable, so nothing else executes
        # them. A dormant script with a syntax error is discovered at the worst
        # possible moment — the first time someone finally has a stack.
        run: |
          for f in testbed/*.sh testbed/lib/*.sh; do
            bash -n "$f" || { echo "syntax error in $f"; exit 1; }
          done

      - name: Testbed helpers are called with the arity they declare
        # `bash -n` CANNOT see this, and the failure is worse than a syntax error:
        # every script runs under `set -u`, so a tb_skip called with one argument
        # expands an unset $2 and the phase ABORTS at that line. 45-gateway.sh had
        # three, all on default paths, so cases E, F and G never executed and
        # run-all.sh recorded a bare non-zero exit with no diagnostic.
        #
        # Arity is counted from the double quotes on the call line, which is how
        # every call site in the suite is written. A call spanning lines, or one
        # using a variable rather than a literal, is skipped rather than guessed
        # at — a gate that reports false positives gets disabled.
        run: |
          bad=""
          for f in testbed/*.sh; do
            while IFS= read -r line; do
              case "$line" in
                *'tb_skip "'*)
                  q=$(printf '%s' "$line" | tr -cd '"' | wc -c)
                  [ "$q" -ge 4 ] || bad="$bad$f: $line"$'\n'
                  ;;
              esac
            done < "$f"
          done
          if [ -n "$bad" ]; then
            echo "tb_skip takes <name> <reason>; these pass one argument and would abort the phase under set -u:"
            printf '%s' "$bad"
            exit 1
          fi
          echo "all tb_skip call sites pass both arguments"

      - name: Docs never show an openbox flag the CLI does not define
        # Four separate phantom flags were written into this feature's docs before
        # any gate existed. The worst was a service unit documented as
        # `openbox gateway --config <path>`: flag parsing rejects it, so the
        # supervised gateway would have failed to start on EVERY BOOT.
        #
        # Scoped to COPYABLE commands — lines inside ``` fences, or lines that are
        # themselves an invocation. Prose is excluded on purpose: a sentence saying
        # "there is no --config flag" is correct and must not fail. The
        # prevention-claim gate above learned that same lesson by failing on its
        # own disclaimer.
        run: |
          declared=$(grep -rhoE '\.(Bool|String|Int64|Int|Duration)Var\(&[A-Za-z0-9_.]+, *"[a-z][a-z0-9-]*"|\.(Bool|String|Int64|Int|Duration)\("[a-z][a-z0-9-]*"' cli/cmd/openbox/*.go \
            | grep -oE '"[a-z][a-z0-9-]*"$' | tr -d '"' | sort -u)
          if [ -z "$declared" ]; then
            echo "could not extract any declared flags — the extractor broke, which would make this gate vacuous"
            exit 1
          fi
          # Only lines that a reader could copy: a fenced/indented command, or a
          # line whose first token is `openbox`.
          # [[:space:]] not \s: BSD grep (macOS, where this is developed) does not
          # support \s in ERE, so the pattern silently matched almost nothing and the
          # gate passed on a real phantom flag. Caught by a mutation drill, not review.
          used=$(grep -rhE '^[[:space:]]*(\$ )?openbox [a-z]' docs README.md 2>/dev/null \
            | grep -oE '\-\-[a-z][a-z0-9-]+' | sed 's/^--//' | sort -u)
          bad=""
          for f in $used; do
            echo "$declared" | grep -qx "$f" || bad="$bad $f"
          done
          if [ -n "$bad" ]; then
            echo "docs show openbox flags the CLI does not define:$bad"
            echo "declared flags were:"; echo "$declared" | tr '\n' ' '; echo
            exit 1
          fi
          echo "all openbox flags shown in copyable commands are declared"
